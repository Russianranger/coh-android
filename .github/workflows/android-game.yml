name: Wine Atlas game listener ARM64 qualification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-game.yml'
      - 'database/wine-game/**'
      - 'database/game-loopback/**'
      - 'patches/game-loopback/**'
      - 'tools/prepare_game_loopback_source.py'
      - 'tools/test_prepare_game_loopback_source.py'
      - 'tools/android/game/**'
      - 'tools/android/build_proot.py'
      - 'tools/android/extract_talloc_source.py'
      - 'tools/android/test_extract_talloc_source.py'
      - 'android/guest/game_*.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-game-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify composite inputs, data staging, bridge and lifecycle contracts
        run: |
          python3 -m unittest discover -s tools/android/game -p 'test_*.py' -v
          python3 -m unittest discover -s tools -p 'test_prepare_game_loopback_source.py' -v
          python3 -m unittest discover -s tools/android -p 'test_proot_download.py' -v
          python3 -m unittest discover -s tools/android -p 'test_extract_talloc_source.py' -v
  bridge:
    needs: tooling
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            database/wine-game
            tools
      - name: Build PE32 observer for stock TestClient
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation was not found' }
          New-Item -ItemType Directory -Path out/bridge -Force | Out-Null
          New-Item -ItemType Directory -Path out/stack-probe -Force | Out-Null
          $batch = @"
          @echo off
          call "$installation\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /O2 /MT /D_WIN32_WINNT=0x0601 database/wine-game/TestClientBridge.c /Fe:out/bridge/TestClientBridge.exe
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /O2 /MT database/wine-game/bridge_protocol_contract.c /Fe:out/bridge_protocol_contract.exe
          if errorlevel 1 exit /b 1
          out\bridge_protocol_contract.exe
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /O2 /MT /D_WIN32_WINNT=0x0601 database/wine-game/GameStackProbe.c /Fe:out/stack-probe/GameStackProbe.exe
          if errorlevel 1 exit /b 1
          python tools/android/game/test_stack_probe.py
          if errorlevel 1 exit /b 1
          "@
          Set-Content -Path out/build-bridge.cmd -Value $batch -Encoding ASCII
          cmd /c .\out\build-bridge.cmd
          if ($LASTEXITCODE -ne 0) { throw 'PE32 bridge build or native contracts failed' }
          python tools/android/game/package_game_runtime.py bridge-receipt --directory out/bridge --repository-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Bridge receipt failed' }
          python tools/android/game/stack_probe_receipt.py --directory out/stack-probe --repository-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Stack observer receipt failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: wine-testclient-bridge
          path: out/bridge/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wine-game-stack-probe
          path: out/stack-probe/
          if-no-files-found: error
  game-donors:
    needs: tooling
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify real Winsock listener and client UDP contracts
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation was not found' }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $batch = @"
          @echo off
          call "$installation\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          python tools/android/game/test_game_loopback_bind.py --require-windows
          if errorlevel 1 exit /b 1
          "@
          Set-Content -Path out/test-game-listeners.cmd -Value $batch -Encoding ASCII
          cmd /c .\out\test-game-listeners.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Game listener Windows contracts failed' }
      - name: Stage separate creation and resume source trees
        shell: pwsh
        run: |
          python tools/prepare_game_loopback_source.py --output out/game-create-source --variant creation
          if ($LASTEXITCODE -ne 0) { throw 'Game creation source preparation failed' }
          python tools/prepare_game_loopback_source.py --output out/game-resume-source --variant resume
          if ($LASTEXITCODE -ne 0) { throw 'Game resume source preparation failed' }
      - name: Build MapServer and creation TestClient with opt-in listeners
        working-directory: out/game-create-source
        shell: pwsh
        run: |
          cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DCOH_PG_PERSISTENCE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Game creation configure failed' }
          cmake --build out/build/vs2026 --config OptDebug --target MapServer TestClient --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Game creation build failed' }
      - name: Build resume TestClient with opt-in listeners
        working-directory: out/game-resume-source
        shell: pwsh
        run: |
          cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DCOH_PG_PERSISTENCE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Game resume configure failed' }
          cmake --build out/build/vs2026 --config OptDebug --target TestClient --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Game resume build failed' }
      - uses: actions/download-artifact@v4
        with:
          name: reference-win32-runtime
          path: out/reference-artifact
          run-id: 36088012664
          github-token: ${{ github.token }}
      - name: Verify accepted reference archive for dependency closure
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('out/reference-artifact/coh-reference-win32.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'dd551750de26765297a45310bba51817b36a942d23f97d4da7f0d1365f49d3aa'
          with zipfile.ZipFile(archive) as value:
              assert all('/' not in n and '\\' not in n and n not in ('.', '..') for n in value.namelist())
              value.extractall('out/reference-runtime')
      - name: Package separately identified game listener donors
        shell: pwsh
        run: >-
          python tools/android/game/package_loopback_game.py
          --create-directory out/game-create-source/out/build/vs2026/bin/OptDebug
          --resume-directory out/game-resume-source/out/build/vs2026/bin/OptDebug
          --create-build-input out/game-create-source/game-loopback-build-input.json
          --resume-build-input out/game-resume-source/game-loopback-build-input.json
          --create-cache out/game-create-source/out/build/vs2026/CMakeCache.txt
          --resume-cache out/game-resume-source/out/build/vs2026/CMakeCache.txt
          --reference out/reference-runtime
          --repository-commit "$env:GITHUB_SHA"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output out/game-listeners
      - uses: actions/upload-artifact@v4
        with:
          name: wine-game-loopback-donors
          path: out/game-listeners/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wine-game-loopback-symbols
          path: out/game-listeners/symbols/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-game-loopback-build-inputs
          path: |
            out/game-create-source/game-loopback-build-input.json
            out/game-resume-source/game-loopback-build-input.json
            out/game-create-source/out/build/vs2026/CMakeCache.txt
            out/game-resume-source/out/build/vs2026/CMakeCache.txt
          if-no-files-found: warn
  runtime:
    needs: [bridge, game-donors]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wine-testclient-bridge
          path: out/bridge
      - uses: actions/download-artifact@v4
        with:
          name: wine-game-stack-probe
          path: out/stack-probe
      - uses: actions/download-artifact@v4
        with:
          name: wine-game-loopback-donors
          path: out/game-listeners
      - uses: actions/download-artifact@v4
        with:
          name: wine-dbserver-package
          path: out/wine-dbserver
          run-id: 36460867428
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: reference-win32-runtime
          path: out/reference-artifact
          run-id: 36088012664
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: resume-testclient-win32
          path: out/resume-client
          run-id: 36297542986
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-diagnostic-runtime-inputs
          path: out/android/assets/runtime
          run-id: 36364550345
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-proot-android-source-and-build
          path: out/android/accepted-proot-sources
          run-id: 36364550345
          github-token: ${{ github.token }}
      - name: Recover pinned talloc source from accepted runtime provenance
        run: python3 tools/android/extract_talloc_source.py --assets out/android/assets/runtime --bundle out/android/accepted-proot-sources/proot-corresponding-sources.tar.gz --output out/android/source-cache/talloc-2.4.3.tar.gz > out/android/talloc-source-receipt.json
      - name: Verify accepted inner reference archive and assemble composite package
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('out/reference-artifact/coh-reference-win32.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'dd551750de26765297a45310bba51817b36a942d23f97d4da7f0d1365f49d3aa'
          with zipfile.ZipFile(archive) as value:
              assert all('/' not in n and '\\' not in n and n not in ('.','..') for n in value.namelist())
              value.extractall('out/reference-runtime')
          PY
          python3 tools/android/game/package_game_runtime.py assemble --reference out/reference-runtime --dbserver out/wine-dbserver --resume out/resume-client --bridge out/bridge --output out/wine-game --repository-commit "$GITHUB_SHA" --dbserver-profile loopback --game-listener-profile loopback --loopback-game out/game-listeners
      - name: Retrieve existing reviewed asset input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_runtime_asset_bundle.py --receipt assets/reference-inputs-receipt.json --output out/asset-inputs.zip --release-asset-id 588984151
      - name: Verify and stage reviewed full game data and accepted schema
        run: |
          python3 tools/runtime_asset_bundle.py stage --archive out/asset-inputs.zip --manifest assets/reference-inputs-manifest.json --output out/reviewed-assets
          python3 tools/android/game/prepare_game_data.py --asset-data out/reviewed-assets --output out/game-data
          python3 tools/android/dbserver/prepare_dbserver_schema.py --output out/dbserver-schema
      - name: Install host runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gawk default-jdk-headless iproute2 util-linux
      - name: Build matching native ARM64 PRoot
        run: python3 tools/android/build_proot.py --target linux-arm64 --output out/android/native --talloc-archive out/android/source-cache/talloc-2.4.3.tar.gz
      - name: Qualify all local game listeners with Atlas saves and exact character resume
        run: python3 tools/android/game/host_game_smoke.py --assets out/android/assets/runtime --package out/wine-game --data out/game-data --schema out/dbserver-schema --stack-probe out/stack-probe --dbserver-profile loopback --game-listener-profile loopback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-game-arm64-evidence
          path: |
            out/android/game-evidence/
            out/wine-game/game-package.json
            out/game-data/game-data-manifest.json
            out/dbserver-schema/schema-manifest.json
            out/bridge/bridge-build.json
            out/android/native/linux-arm64/proot-build-receipt.json
            out/android/talloc-source-receipt.json
          if-no-files-found: warn
