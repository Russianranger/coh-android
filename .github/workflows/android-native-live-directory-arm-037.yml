name: Closed native live directory ARM qualification 0.13.37
on:
  push:
    branches: [codex/native-live-directory-arm-037]
    paths:
      - .github/workflows/android-native-live-directory-arm-037.yml
      - tools/native_live_directory/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-live-directory-arm-037-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-component-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/native_live_directory
            .github/workflows/android-native-live-directory-arm-037.yml
          sparse-checkout-cone-mode: false
      - name: Pinned NDK compiler for read-only retained inspection
        run: |
          task_sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$task_sdk_manager"
          "$task_sdk_manager" 'ndk;27.2.12479018'
      - name: Recover original successfully executed ARM components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Russianranger/coh-android/actions/artifacts/11878700818/zip > "$RUNNER_TEMP/coh-live-original-ARM.zip"
      - name: Fresh read-only audit controls
        env:
          COH_LIVE_RETAINED_ARM_ARTIFACT: ${{ runner.temp }}/coh-live-original-ARM.zip
        run: python3 -W error::ResourceWarning tools/native_live_directory/test_audit_retained_native_live_directory.py
      - name: Authenticate original ELF and source plus unchanged compiler dry run
        run: >-
          python3 -W error::ResourceWarning
          tools/native_live_directory/audit_retained_native_live_directory.py
          --artifact "$RUNNER_TEMP/coh-live-original-ARM.zip"
          --out out/native-live-retained-inspection-037
          --ndk "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Preserve exact source and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-live-directory-arm-037-${{ github.sha }}
          path: |
            out/native-live-retained-inspection-037
            tools/native_live_directory
            .github/workflows/android-native-live-directory-arm-037.yml
          if-no-files-found: error
