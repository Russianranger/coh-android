name: Stop redundant runs from coordinator publication 633b12b
on:
  push:
    branches: [native-android]
    paths: [.github/workflows/native-owned-633-cleanup.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop-own-runs:
    if: github.ref == 'refs/heads/native-android' && contains(github.event.head_commit.message, '[stop-redundant-633]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the four redundant runs from this coordinator publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          expected = '633b12bd2864cc135fda6d8fa94e971005d35aa8'
          repo = 'Russianranger/coh-android'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          records = []
          out = Path(os.environ['RUNNER_TEMP']) / 'owned-633-cleanup.json'
          for identity in [39004702532, 39004702524, 39004702537, 39004702550]:
              url = 'https://api.github.com/repos/' + repo + '/actions/runs/' + str(identity)
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  run = json.load(response)
              assert run['head_sha'] == expected and run['head_branch'] == 'native-android'
              assert run['event'] == 'push' and run['run_attempt'] == 1
              item = {key: run[key] for key in ['id', 'name', 'head_sha', 'head_branch', 'status', 'conclusion']}
              if run['status'] != 'completed':
                  request = urllib.request.Request(url + '/cancel', data=b'', headers=headers, method='POST')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 202
                  item['cancellation_requested'] = True
              else:
                  item['cancellation_requested'] = False
              records.append(item)
              out.write_text(json.dumps({'scope': 'Only coordinator-owned redundant publication runs; no server, APK or other-agent state touched', 'runs': records}, indent=2) + '\n')
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-633-cleanup-receipt
          path: ${{ runner.temp }}/owned-633-cleanup.json
          if-no-files-found: error
          retention-days: 90
