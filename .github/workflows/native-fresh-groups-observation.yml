      run: "python3 native-android/engine/scenecatalog-server/check_source_snapshot_verifier.py \\\n  --capture \"$RUNNER_TEMP/groups-private-result/source.cohgtx\"\
        \ \\\n  --native-packet \"$RUNNER_TEMP/groups-private-result/native/groups.bin\" \\\n  --work \"$RUNNER_TEMP/groups-private-verification\"\
        \ \\\n  --output \"$RUNNER_TEMP/groups-private-verification/verification.json\"\npython3 - <<'PYCODE'\nimport hashlib,json,os,pathlib,signal,subprocess,sys,time\n\
        private=pathlib.Path(os.environ['RUNNER_TEMP'])\ndef sha(path):\n    digest=hashlib.sha256()\n    with path.open('rb')\
        \ as stream:\n        while block:=stream.read(65536):digest.update(block)\n    return digest.hexdigest()\n# Latch\
        \ exact fresh outputs inside the same source-owned job. Do not\n# print these private receipt/run/capture/verifier\
        \ identities.\nresult=private/'groups-private-result';verification=private/'groups-private-verification'\ninputs=private/'groups-inputs'\n\
        runtime=json.loads(pathlib.Path('out/groups-control/control-fixture.json').read_bytes())['runtime_host_path']\ncommand=[sys.executable,'native-android/engine/scenecatalog-server/admit_source_snapshot.py',\n\
        \    '--private-output',str(result),'--private-work',str(private/'groups-private-work'),\n    '--fixture-directory',str(inputs/'fixture'),'--runtime',runtime,\n\
        \    '--control-fixture','out/groups-control/control-fixture.json',\n    '--db-donor-apk',str(inputs/'donor/COH-Atlas-Gameplay-0.13.34.apk'),\n\
        \    '--compile-directory',str(inputs/'observer/fresh-groups-compile'),\n    '--native-capture',str(inputs/'initial-capture/coh-capture-local-initial'),\n\
        \    '--native-build-receipt',str(inputs/'initial-capture/build.json'),\n    '--verification',str(verification/'verification.json'),\n\
        \    '--verifier-executable',str(verification/'build/verify-source-snapshot'),\n    '--capture-receipt-sha256',sha(result/'capture-receipt.json'),\n\
        \    '--run-identity-sha256',sha(result/'run-identity.json'),\n    '--fixture-receipt-sha256',os.environ['FIXTURE_RECEIPT_SHA256'],\n\
        \    '--compile-receipt-sha256','0daf56e8dcae5d40ab9d5ef08bc09d022eba0a9a609170ce6d1ce867b2ca18c5',\n    '--native-build-receipt-sha256',os.environ['INITIAL_BUILD_SHA256'],\n\
        \    '--verification-sha256',sha(verification/'verification.json'),\n    '--output','out/groups-public/source-snapshot.json']\n\
        # Capture the tool's fixed status too: no subprocess exception may\n# serialize a fully expanded private command into\
        \ the Actions log.\ndef owned(command,timeout):\n    child=None;passed=False\n    try:\n        child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)\n\
        \        stdout,stderr=child.communicate(timeout=timeout)\n        passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2\n\
        \    except Exception:passed=False\n    finally:\n        if child is not None:\n            try:os.killpg(child.pid,signal.SIGTERM)\n\
        \            except ProcessLookupError:pass\n            end=time.monotonic()+2\n            while time.monotonic()<end:\n\
        \                try:os.killpg(child.pid,0)\n                except ProcessLookupError:break\n                time.sleep(.05)\n\
        \            else:\n                try:os.killpg(child.pid,signal.SIGKILL)\n                except ProcessLookupError:pass\n\
        \            try:child.wait(timeout=5)\n            except Exception:passed=False\n            try:os.killpg(child.pid,0);passed=False\n\
        \            except ProcessLookupError:pass\n            for stream in (child.stdout,child.stderr):\n            \
        \    if stream is not None:stream.close()\n    return passed\npassed=owned(command,900)\nprint(json.dumps({'source_snapshot_admission_completed':passed,'world_authority':False}))\n\
        if not passed:raise SystemExit(2)\n# Fresh-only gate repeats the exact complete source admission and\n# copies only\
        \ the four approved byte-exact source bodies. It launches\n# no new runtime; generic private captures cannot use this\
        \ export.\nretention=list(command)\nretention[1]='native-android/engine/scenecatalog-server/retain_fresh_source_snapshot.py'\n\
        retention[retention.index('--output')+1]='out/groups-public/fresh-source-snapshot'\nretention+=['--source-admission','out/groups-public/source-snapshot.json',\n\
        \    '--source-admission-sha256',sha(pathlib.Path('out/groups-public/source-snapshot.json'))]\nretained=owned(retention,1200)\n\
        print(json.dumps({'four_fresh_source_payloads_retained':retained,'world_authority':False}))\nif not retained:raise\
        \ SystemExit(2)\ninitial=list(retention)\ninitial[1]='native-android/engine/scenecatalog-server/retain_fresh_initial_observation.py'\n\
        initial[initial.index('--output')+1]='out/groups-public/fresh-initial-observation'\ndestination=inputs/'fresh-initial-command.json'\n\
        with os.fdopen(os.open(destination,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w') as output:json.dump(initial,output)\n\
        PYCODE\n"
    - name: Retain optional initial packet only through the fresh fixture export gate
      id: initial_snapshot
      if: steps.source_snapshot.outcome == 'success'
      continue-on-error: true
      run: "python3 - <<'PYCODE'\nimport json,os,pathlib,signal,subprocess,time\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs/fresh-initial-command.json'\n\
        command=json.loads(path.read_bytes())\ndef owned(command,timeout):\n    child=None;passed=False\n    try:\n      \
        \  child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)\n\
        \        stdout,stderr=child.communicate(timeout=timeout)\n        passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2\n\
        \    except Exception:passed=False\n    finally:\n        if child is not None:\n            try:os.killpg(child.pid,signal.SIGTERM)\n\
        \            except ProcessLookupError:pass\n            end=time.monotonic()+2\n            while time.monotonic()<end:\n\
        \                try:os.killpg(child.pid,0)\n                except ProcessLookupError:break\n                time.sleep(.05)\n\
        \            else:\n                try:os.killpg(child.pid,signal.SIGKILL)\n                except ProcessLookupError:pass\n\
        \            try:child.wait(timeout=5)\n            except Exception:passed=False\n            try:os.killpg(child.pid,0);passed=False\n\
        \            except ProcessLookupError:pass\n            for stream in (child.stdout,child.stderr):\n            \
        \    if stream is not None:stream.close()\n    return passed\nretained=owned(command,1200)\nprint(json.dumps({'fresh_test_initial_packet_retained':retained,'world_authority':False}))\n\
        raise SystemExit(0 if retained else 2)\nPYCODE\n"
    - name: Extract only fixed public booleans and coarse source-defined failure enum
      if: always() && steps.source_admission.outcome == 'success'
      run: 'mkdir -p out/groups-public

        python3 native-android/engine/scenecatalog-server/summarize_groups_capture.py --private-output "$RUNNER_TEMP/groups-private-result"
        --output out/groups-public/summary.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fresh-editmsg-profile-groups-public-status-${{ github.sha }}
        path: 'out/groups-public/summary.json

          out/groups-public/tooling.json

          out/groups-public/source-snapshot.json

          '
        if-no-files-found: warn
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: always() && steps.source_snapshot.outcome == 'success'
      with:
        name: admitted-fresh-source-snapshot-${{ github.sha }}
        path: 'out/groups-public/fresh-source-snapshot/catalog.cohcat

          out/groups-public/fresh-source-snapshot/runtime.cohrts

          out/groups-public/fresh-source-snapshot/resources.cohres

          out/groups-public/fresh-source-snapshot/public-bounds.cohrbw

          out/groups-public/fresh-source-snapshot/manifest.json

          '
        if-no-files-found: error
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: always() && steps.initial_snapshot.outcome == 'success'
      with:
        name: admitted-fresh-initial-observation-${{ github.sha }}
        path: 'out/groups-public/fresh-initial-observation/initial-update.bin

          out/groups-public/fresh-initial-observation/manifest.json

          '
        if-no-files-found: error
        retention-days: 90
