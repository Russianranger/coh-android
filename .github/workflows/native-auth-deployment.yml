name: Nonshipping encrypted-auth deployment staging
on:
  push:
    branches: [native-android]
    paths:
      - native-android/engine/auth-interop/deployment/**
      - .github/workflows/native-auth-deployment.yml
  workflow_dispatch:
    inputs:
      execute_staging:
        description: Build original AuthServer and test a fresh private LocalDB; no login or installed profile
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: native-auth-deployment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    if: >-
      github.repository == 'Russianranger/coh-android' &&
      github.ref == 'refs/heads/native-android' &&
      ((github.event_name == 'workflow_dispatch' && inputs.execute_staging) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[auth-stage]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Qualify source policy, admission and isolated deployment controls
        run: >-
          python3 native-android/engine/auth-interop/deployment/check.py
          --source-root . --sanitize --output out/auth-staging-controls/qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-auth-staging-source-controls
          path: out/auth-staging-controls/
          if-no-files-found: error
          retention-days: 90
  original-win32-and-disposable-sql:
    needs: source-controls
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Preserve exact original LF source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reuse exact previously compiled unchanged original AuthServer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, subprocess, zipfile
          temporary = Path(os.environ['RUNNER_TEMP'])
          archive = temporary/'auth-original-stage.zip'
          with archive.open('xb') as stream:
              subprocess.run(['gh','api','repos/Russianranger/coh-android/actions/artifacts/12064402579/zip'], stdout=stream, check=True, timeout=180)
          assert archive.stat().st_size == 428036
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'eda726ddc281b2e6b29e8c4d3c0f5e0805f505a8542c0ef80f5dad6208eb570d'
          output = temporary/'auth-original-reuse'
          output.mkdir()
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              assert len(infos) <= 64 and sum(x.file_size for x in infos) <= 32*1024**2
              assert all(not PurePosixPath(x.filename).is_absolute() and '..' not in PurePosixPath(x.filename).parts and '\\' not in x.filename for x in infos)
              source.extractall(output)
          print('Exact prior original AuthServer artifact admitted; no server executed')
          PY
      - name: Reuse exact previously compiled original ODBC and checksum controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, subprocess, zipfile
          temporary = Path(os.environ['RUNNER_TEMP'])
          archive = temporary/'auth-controls-stage.zip'
          with archive.open('xb') as stream:
              subprocess.run(['gh','api','repos/Russianranger/coh-android/actions/artifacts/12066431903/zip'], stdout=stream, check=True, timeout=180)
          assert archive.stat().st_size == 646099
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'c6949ac8c534ff82a3260ab9ed385dc0a34f9d4ff8b8ec9a761cfd04a65d47c3'
          output = temporary/'auth-controls-reuse'
          output.mkdir()
          with zipfile.ZipFile(archive) as source:
              infos = source.infolist()
              assert len(infos) <= 64 and sum(x.file_size for x in infos) <= 32*1024**2
              assert all(not PurePosixPath(x.filename).is_absolute() and '..' not in PurePosixPath(x.filename).parts and '\\' not in x.filename for x in infos)
              source.extractall(output)
          print('Exact prior control artifact admitted; controls execute afresh')
          PY
      - name: Stage original AuthServer and execute original x86 ODBC bindings in private LocalDB
        shell: pwsh
        run: |
          python native-android/engine/auth-interop/deployment/hosted_auth_stage.py --source-root . --expected-commit "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/coh-auth-staging" --reuse-auth-stage "$env:RUNNER_TEMP/auth-original-reuse" --reuse-controls-stage "$env:RUNNER_TEMP/auth-controls-reuse"
          if ($LASTEXITCODE -ne 0) { throw 'Isolated auth staging did not qualify; preserve exact diagnostics' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-auth-original-win32-disposable-sql
          path: ${{ runner.temp }}/coh-auth-staging/
          if-no-files-found: error
          retention-days: 90
