name: Native Android source world and camera probe
on:
  push:
    branches: [native-android]
    paths:
      - native-android/world-probe/**
      - native-android/material-probe/app/src/main/cpp/**
      - native-android/material-probe/shaders/**
      - native-android/material-probe/contract/material_reference.py
      - native-android/src/coh_dds.c
      - native-android/src/coh_assets.c
      - native-android/src/byte_reader.h
      - native-android/include/coh_native_core.h
      - native-android/world/**
      - native-android/tools/world_fixture/**
      - native-android/tools/material_fixture/**
      - .github/workflows/native-world-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-world-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Recover source-authored world geometry, camera inputs, and source oracles
        run: |
          mkdir -p native-android/results/world-probe
          python3 - <<'PYSTAGE'
          import json, os, pathlib
          receipt = {'schema': 1, 'phase': 9, 'stage': 'original source material declaration validation',
                     'status': 'started', 'passed': False, 'source_commit': os.environ['GITHUB_SHA'],
                     'workflow_run_id': os.environ['GITHUB_RUN_ID']}
          pathlib.Path('native-android/results/world-probe/source-validation-stage.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PYSTAGE
          python3 -m pip install Pillow==12.3.0
          python3 native-android/world-probe/contract/verify_source_tricks.py --repo-root . --output native-android/results/world-probe/source-trick-resolution.json
          python3 native-android/tools/world_fixture/acquire.py --output native-android/results/world-corpus
          python3 native-android/tools/world_fixture/prepare.py --corpus native-android/results/world-corpus --output native-android/world-probe/app/src/main/assets --evidence-output native-android/results/world-probe/fixture --source-trick-audit native-android/results/world-probe/source-trick-resolution.json
          python3 - <<'PYMETA'
          import pathlib, re
          java = pathlib.Path('native-android/world-probe/app/src/main/java/org/coh/worldprobe/MainActivity.java').read_text()
          bound = re.search(r'MAX_METADATA_BYTES = (\d+) \* 1024;', java)
          assert bound and int(bound.group(1)) == 512, 'Missing exact 512 KiB Java metadata input bound'
          metadata = pathlib.Path('native-android/world-probe/app/src/main/assets/world-fixture.json')
          assert 0 < metadata.stat().st_size <= int(bound.group(1)) * 1024, 'Fixture metadata exceeds Android loader bound'
          PYMETA
      - name: Qualify independent world, view, and projection references
        run: |
          python3 native-android/tools/world_fixture/world_reference.py --self-check > native-android/results/world-probe/world-reference-selfcheck.json
          python3 native-android/world-probe/contract/build_material_reference.py --self-check > native-android/results/world-probe/material-reference-selfcheck.json
      - name: Qualify bounded world parser and original camera geometry parity
        run: |
          python3 native-android/tools/world_fixture/native_world_check.py --world native-android/world-probe/app/src/main/assets/world.bin --reference native-android/world-probe/app/src/main/assets/world-reference.bin --output native-android/results/world-probe/host-world-proof.json
      - name: Verify exact binary32 source order regression witnesses
        run: |
          python3 native-android/tools/world_fixture/gpu_arithmetic_check.py --world native-android/world-probe/app/src/main/assets/world.bin --reference native-android/world-probe/app/src/main/assets/world-reference.bin --output native-android/results/world-probe/gpu-arithmetic-regression.json
      - name: Assemble isolated ARM64 test APK
        run: |
          python3 native-android/world-probe/gradle.py :app:assembleDebug :app:lintDebug
          mkdir -p native-android/results/world-probe
          cp native-android/world-probe/app/build/outputs/apk/debug/app-debug.apk native-android/results/world-probe/CoH-Native-World-Probe-0.1.1-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs native-android/results/world-probe/CoH-Native-World-Probe-0.1.1-arm64.apk > native-android/results/world-probe/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native-android/results/world-probe/CoH-Native-World-Probe-0.1.1-arm64.apk > native-android/results/world-probe/apk-badging.txt
      - name: Assemble separate emulator test APK
        run: |
          python3 native-android/world-probe/gradle.py -PprobeAbis=x86_64 :app:assembleDebug
          cp native-android/world-probe/app/build/outputs/apk/debug/app-debug.apk native-android/results/world-probe/CoH-Native-World-Probe-0.1.1-emulator-x86_64.apk
      - name: Verify package ABI and record exact build inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, struct, subprocess, zipfile
          root = pathlib.Path('native-android/results/world-probe')
          assets = pathlib.Path('native-android/world-probe/app/src/main/assets')
          expected_assets = {'world.bin', 'world-reference.bin', 'material-reference.bin'}
          metadata = json.loads((assets/'world-fixture.json').read_text())
          assert set(metadata['assets']) == expected_assets, metadata['assets']
          assert {path.name for path in assets.iterdir() if path.is_file()} == expected_assets | {'world-fixture.json'}
          for name, identity in metadata['assets'].items():
              payload = (assets/name).read_bytes()
              assert len(payload) == identity['bytes'] and hashlib.sha256(payload).hexdigest() == identity['sha256'], name
          artifacts = []
          for label, abi, machine in [('arm64', 'arm64-v8a', 183), ('emulator-x86_64', 'x86_64', 62)]:
              path = root / ('CoH-Native-World-Probe-0.1.1-' + label + '.apk')
              with zipfile.ZipFile(path) as apk:
                  native = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
                  assert native == ['lib/' + abi + '/libcoh_world_probe.so'], native
                  elf = apk.read(native[0])
                  assert elf[:6] == b'\x7fELF\x02\x01' and struct.unpack_from('<H', elf, 18)[0] == machine
                  packaged_assets = {name.removeprefix('assets/') for name in apk.namelist() if name.startswith('assets/') and not name.endswith('/')}
                  assert packaged_assets == expected_assets | {'world-fixture.json'}, packaged_assets
                  for name in packaged_assets:
                      assert apk.read('assets/'+name) == (assets/name).read_bytes(), name
              signer = pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/apksigner'
              aapt = signer.with_name('aapt')
              signature = subprocess.check_output([str(signer), 'verify', '--verbose', '--print-certs', str(path)], text=True)
              badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(path)], text=True)
              package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
              assert package and package.groups() == ('org.coh.worldprobe', '2', '0.1.1-phase9'), badging
              assert "sdkVersion:'26'" in badging and "targetSdkVersion:'35'" in badging, badging
              assert "native-code: '" + abi + "'" in badging, badging
              assert "launchable-activity: name='org.coh.worldprobe.MainActivity'" in badging, badging
              assert not re.search(r'^uses-permission:', badging, re.M), badging
              cert = re.search(r'^Signer #1 certificate SHA-256 digest: ([0-9a-f]+)$', signature, re.M)
              assert cert and len(cert.group(1)) == 64, signature
              (root/('apk-signature-'+label+'.txt')).write_text(signature)
              (root/('apk-badging-'+label+'.txt')).write_text(badging)
              artifacts.append({'file': path.name, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'abi': abi, 'elf_machine': machine, 'native_library': {'file': native[0], 'bytes': len(elf), 'sha256': hashlib.sha256(elf).hexdigest()}, 'packaged_fixture_bytes_verified': True, 'manifest_verified': True, 'signature_verified': True, 'signer_certificate_sha256': cert.group(1)})
          assert len({item['signer_certificate_sha256'] for item in artifacts}) == 1, 'ARM64 and emulator package signing identities differ'
          fixture_files = [{'file': str(path.relative_to(assets)), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(assets.rglob('*')) if path.is_file()]
          assert fixture_files, 'Fixture preparation produced no assets'
          receipt = {'schema': 1, 'source_commit': os.environ['GITHUB_SHA'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'application_id': 'org.coh.worldprobe', 'min_sdk': 26, 'target_sdk': 35, 'compile_sdk': 35, 'gradle': '8.9', 'gradle_distribution_sha256': 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab', 'android_gradle_plugin': '8.7.3', 'ndk': '28.2.13676358', 'cmake': '3.22.1', 'signing': 'isolated CI debug key; not the production launcher key', 'phase': 9, 'probe_version': '0.1.1-phase9', 'version_code': 2, 'original_game_execution': False, 'full_scene_execution': False, 'full_atlas_loaded': False, 'original_lighting_qualified': False, 'original_scene_sorter_qualified': False, 'artifacts': artifacts, 'fixture_assets': fixture_files, 'thor_device_execution_verified': False}
          (root/'build-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(item['sha256']+'  '+item['file']+'\n' for item in artifacts))
          for path in assets.glob('*.json'):
              (root/path.name).write_bytes(path.read_bytes())
          PY
      - name: Enable hosted emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Android 13 original world, camera, material, and lifecycle qualification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/world-probe/tools/emulator_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-world-probe-evidence
          path: native-android/results/world-probe/
          if-no-files-found: error
          retention-days: 30
