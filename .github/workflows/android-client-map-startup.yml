name: Thor .32 certified MapServer startup, Kings preparation and complete acceptance audit
on:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - tools/android/interactive/release-client-map-startup-0.13.32.json
      - .github/workflows/android-client-map-startup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-client-map-startup-publication
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.gate.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: gate
        name: Preserve any completed .32 publication and require the exact approved donor
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools/android/interactive')
          import build_client_map_startup_apk as current
          marker = json.loads(Path('tools/android/interactive/release-client-map-startup-0.13.32.json').read_text())
          assert marker['version'] == current.VERSION_NAME and marker['version_code'] == current.VERSION_CODE
          assert marker['donor_commit'] == current.DONOR_COMMIT and marker['asset_version'] == '1.0.0'
          assert type(marker['publish_enabled']) is bool
          if not marker['publish_enabled']:
            with Path(os.environ['GITHUB_OUTPUT']).open('a') as output: output.write('required=false\n')
            print('Native component qualification is pending; publication remains disabled')
            raise SystemExit(0)
          request = urllib.request.Request('https://api.github.com/repos/'+current.REPOSITORY+'/releases/tags/'+current.RELEASE_TAG,
            headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
            with urllib.request.urlopen(request, timeout=30) as response: release = json.load(response)
          except urllib.error.HTTPError as error:
            if error.code != 404: raise
            required = True
          else:
            current.validate_existing_release(release); required = False
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('required='+str(required).lower()+'\n')
          print('Publication required:', required, '; retained .31 Game/DbServer/graphics and Assets 1.0.0')
          PY
  apk:
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {contents: write, actions: read}
    env:
      COH_MAP_STARTUP_ASSET_CACHE: '${{ github.workspace }}/out/map-startup-assets'
      COH_RECEIPT_REPAIR_TEST_DONOR_APK: '${{ github.workspace }}/out/historical-donor.apk'
      COH_ANIMATION_TEST_DONOR_APK: '${{ github.workspace }}/out/profile-donor.apk'
      COH_ANIMATION_TEST_DONOR_REPORT: '${{ github.workspace }}/out/profile-donor-evidence/client-animation-repair-apk-build-report.json'
      COH_REQUIRE_POSTGRESQL: '1'
      COH_REQUIRE_STARTUP_BUNDLE_PG: '1'
      COH_REQUIRE_LEVELUP_UI_REPAIR_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: coh-host-fixture
      PGDATABASE: coh_test_startup_bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Free unused hosted-runner toolchains for the measured complete asset fixture
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          df -h "$GITHUB_WORKSPACE"
          for unused in /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL; do
            case "$unused" in
              /usr/share/dotnet|/usr/share/swift|/usr/local/.ghcup|/opt/ghc|/opt/hostedtoolcache/CodeQL)
                sudo rm -rf -- "$unused"
                ;;
              *) exit 1 ;;
            esac
          done
          df -h "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          print('Available fixture headroom:', round(free / 1024**3, 2), 'GiB')
          assert free >= 30 * 1024**3, 'Complete original asset preparation requires 30 GiB runner headroom'
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: SDK signing tools and all retained PostgreSQL and Vulkan host fixtures
        run: |
          timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16 libvulkan-dev mesa-vulkan-drivers python3-pil python3-yaml tesseract-ocr tesseract-ocr-eng
          python3 - <<'PY'
          import shutil, subprocess, sys
          from PIL import Image
          import yaml
          assert shutil.which('tesseract'), 'Required real OCR fixture executable missing'
          languages = subprocess.check_output(['tesseract', '--list-langs'], text=True)
          assert 'eng' in languages.splitlines(), 'Required real OCR English fixture missing'
          print('Verified host image/YAML/OCR dependencies for', sys.executable)
          PY
          sudo pg_ctlcluster 16 main start || /usr/lib/postgresql/16/bin/pg_isready --host "$PGHOST" --port "$PGPORT"
          sudo -u postgres psql --no-psqlrc --dbname postgres --set ON_ERROR_STOP=1 --command "ALTER ROLE postgres WITH LOGIN PASSWORD 'coh-host-fixture'"
          sudo -u postgres createdb --owner postgres coh_test_startup_bundle
          test "$(psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT current_user = 'postgres' AND current_database() = 'coh_test_startup_bundle' AND current_setting('server_version_num')::integer / 10000 = 16")" = t
      - name: Authenticate public .31, historical .29/.30 donors and separately qualified native component
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/android/interactive/build_client_map_startup_apk.py download-donor --output out/donor.apk
          python3 tools/android/interactive/build_client_map_startup_apk.py download-donor-evidence --output out/donor-evidence
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-donor --output out/historical-donor.apk
          python3 tools/android/interactive/build_client_profile_recovery_apk.py download-donor --output out/profile-donor.apk
          python3 tools/android/interactive/build_client_profile_recovery_apk.py download-donor-evidence --output out/profile-donor-evidence
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/android/interactive')
          import qualify_client_map_startup as qualification
          donor = qualification.derivative.read_json(Path('out/donor-evidence/client-profile-recovery-apk-build-report.json'))
          qualification.stage_historical_source(Path('out/historical-source-031'), donor)
          PY
          python3 tools/android/interactive/package_map_startup_native.py stage-inputs --marker tools/android/interactive/release-client-map-startup-0.13.32.json --output out/map-startup-inputs --repository-commit "$GITHUB_SHA"
      - name: Qualify current repairs, complete native/asset preparation, strict SQL/save and every retained suite
        run: >-
          python3 tools/android/interactive/qualify_client_map_startup.py --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
          --historical-donor-apk out/historical-donor.apk
          --profile-donor-apk out/profile-donor.apk --profile-donor-build-report out/profile-donor-evidence/client-animation-repair-apk-build-report.json
          --historical-source out/historical-source-031 --map-startup-inputs out/map-startup-inputs
          --output out/client-map-startup-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-client-map-startup-qualification
          path: out/client-map-startup-qualification.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: 36731428735
          github-token: ${{ github.token }}
      - name: Compile complete-asset acceptance Java and assemble certified MapServer; retain Game/DbServer/GPU/assets
        env: {COH_INTERACTIVE_KEYSTORE_PASSWORD: android}
        run: >-
          python3 tools/android/interactive/build_client_map_startup_apk.py build --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
          --map-startup-inputs out/map-startup-inputs
          --qualification out/client-map-startup-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks"
          --output out/client-map-startup-apk/COH-Atlas-Gameplay-0.13.32.apk
      - name: Retain diagnostic candidates before independent audit without accepting them
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('out/unaccepted-map-startup'); target.mkdir(parents=True, exist_ok=True)
          for name in ('COH-Atlas-Gameplay-0.13.32.apk', 'COH-Atlas-Gameplay-0.13.32.apk.sha256',
              'COH-Atlas-Gameplay-0.13.32-testing.txt', 'client-map-startup-apk-build-report.json'):
            source = Path('out/client-map-startup-apk')/name
            if source.is_file() and not source.is_symlink(): shutil.copyfile(source, target/name)
          (target/'UNACCEPTED.txt').write_text('Diagnostic candidates only. These bytes precede the independent audit and do not authorize publication.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-client-map-startup-unaccepted-diagnostics
          path: out/unaccepted-map-startup/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Fresh-process SDK signer and exact payload reconstruction with independent hash seed
        env: {PYTHONHASHSEED: '73422'}
        run: >-
          python3 tools/android/interactive/build_client_map_startup_apk.py audit --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
          --map-startup-inputs out/map-startup-inputs
          --qualification out/client-map-startup-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/client-map-startup-apk/COH-Atlas-Gameplay-0.13.32.apk
          --build-report out/client-map-startup-apk/client-map-startup-apk-build-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-map-startup-apk
          path: out/client-map-startup-apk/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Publish the qualified APK only and verify unchanged Assets 1.0.0 metadata
        env: {GH_TOKEN: '${{ github.token }}'}
        run: >-
          python3 tools/android/interactive/build_client_map_startup_apk.py publish --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
          --map-startup-inputs out/map-startup-inputs
          --qualification out/client-map-startup-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/client-map-startup-apk/COH-Atlas-Gameplay-0.13.32.apk
          --build-report out/client-map-startup-apk/client-map-startup-apk-build-report.json
      - name: Remove owned signing staging
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
  public-audit:
    needs: [changes, apk]
    if: always() && needs.changes.result == 'success' && needs.apk.result == 'success' && needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Free unused hosted-runner toolchains for the measured complete asset fixture
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          df -h "$GITHUB_WORKSPACE"
          for unused in /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL; do
            case "$unused" in
              /usr/share/dotnet|/usr/share/swift|/usr/local/.ghcup|/opt/ghc|/opt/hostedtoolcache/CodeQL)
                sudo rm -rf -- "$unused"
                ;;
              *) exit 1 ;;
            esac
          done
          df -h "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          print('Available fixture headroom:', round(free / 1024**3, 2), 'GiB')
          assert free >= 30 * 1024**3, 'Complete original asset preparation requires 30 GiB runner headroom'
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: SDK audit tools only
        run: timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with: {name: coh-client-map-startup-apk, path: out/accepted}
      - uses: actions/download-artifact@v4
        with: {name: coh-client-map-startup-qualification, path: out}
      - name: Authenticate public .31 donor, qualified native component and unchanged asset pack
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/android/interactive/build_client_map_startup_apk.py download-donor --output out/donor.apk
          python3 tools/android/interactive/build_client_map_startup_apk.py download-donor-evidence --output out/donor-evidence
          python3 tools/android/interactive/package_map_startup_native.py stage-inputs --marker tools/android/interactive/release-client-map-startup-0.13.32.json --output out/map-startup-inputs --repository-commit "$GITHUB_SHA"
          python3 tools/android/interactive/build_client_map_startup_apk.py verify-assets --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
      - name: Download actual public .31 APK, checksum and instructions
        run: >-
          python3 tools/android/interactive/build_client_map_startup_apk.py download-public
          --build-report out/accepted/client-map-startup-apk-build-report.json --output out/public
      - name: Audit actual public signer, DEX, component ancestry, retained native/assets and complete preparation
        env: {PYTHONHASHSEED: '2022'}
        run: >-
          python3 tools/android/interactive/build_client_map_startup_apk.py audit --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-profile-recovery-apk-build-report.json
          --map-startup-inputs out/map-startup-inputs
          --qualification out/client-map-startup-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/public/COH-Atlas-Gameplay-0.13.32.apk
          --build-report out/accepted/client-map-startup-apk-build-report.json
      - name: Record public-byte proof without physical Thor claims
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('out/accepted/client-map-startup-apk-build-report.json').read_text())
          Path('out/client-map-startup-public-byte-audit.json').write_text(json.dumps({
            'format': 1, 'status': 'passed', 'repository_commit': report['repository_commit'],
            'run_id': int(os.environ['GITHUB_RUN_ID']), 'apk': {key: report[key] for key in ('bytes', 'sha256', 'version_name', 'version_code')},
            'public_apk_verified': True, 'actual_runtime_asset_installers_verified': True, 'full_startup_orchestration_verified': True,
            'java_or_dex_recompiled': True, 'native_runtime_booted': False,
            'retained_game_and_dbserver_verified': True, 'retained_game_archive_native_members': 24,
            'native_mapserver_recompiled': True, 'native_animation_and_fx_component_fixtures_verified': True,
            'original_asset_public_byte_audit_artifact_id': 11708366753,
            'unchanged_assets_1_0_0_metadata_verified': True, 'asset_release_republished': False,
            'physical_recovery_validated': False, 'physical_kings_row_zoning_validated': False,
            'physical_fps_gain_validated': False, 'physical_map_startup_speedup_validated': False,
            'sub_30_second_map_startup_validated': False}, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-map-startup-public-byte-audit
          path: out/client-map-startup-public-byte-audit.json
          retention-days: 90
          if-no-files-found: error
