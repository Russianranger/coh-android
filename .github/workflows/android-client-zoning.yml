name: Thor Atlas instance zoning milestone
# Compile reviewed Java/guest zoning only; reuse exact public .25 native binaries.
on:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - .github/workflows/android-client-zoning.yml
      - tools/android/interactive/build_client_zoning_apk.py
      - tools/android/interactive/qualify_client_zoning.py
      - tools/android/interactive/test_client_zoning_package.py
      - tools/android/interactive/test_client_zoning_java.py
      - tools/android/interactive/test_character_zoning.py
      - android/guest/character_zoning.py
      - android/guest/local_character_server.py
      - android/guest/character_reopen_diagnostic.py
      - android/guest/character_creation_diagnostic.py
      - android/guest/character_session_budget.py
      - android/zoning/src/main/java/io/github/russianranger/cohclientinteractive/ClientZoning.java
      - docs/COH-ZONING-0.13.26.md
      - docs/COH-Atlas-Gameplay-0.13.26-testing.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-client-zoning-publication
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.gate.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve any complete existing publication
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys, json, os, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools/android/interactive')
          import build_client_zoning_apk as current
          if current.RELEASE_TAG != 'coh-atlas-gameplay-v0.13.26':
              raise ValueError('Exact continuation release required')
          request = urllib.request.Request('https://api.github.com/repos/'+current.REPOSITORY+'/releases/tags/'+current.RELEASE_TAG,
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response: release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              required = True
          else:
              current.validate_existing_release(release)
              required = False
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output: output.write('required='+str(required).lower()+'\n')
          print(json.dumps({'release_tag': current.RELEASE_TAG, 'publication_required': required,
              'existing_release_modified': False, 'completed_gpu_probe_and_driver_builds_repeated': False}))
          PY
  qualify:
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COH_REQUIRE_STARTUP_BUNDLE_PG: '1'
      COH_REQUIRE_LEVELUP_UI_REPAIR_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: coh-host-fixture
      PGDATABASE: coh_test_startup_bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Start required host PostgreSQL 16 fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          if pg_lsclusters --no-header | awk '$1 == "16" && $2 == "main" { found = 1 } END { exit !found }'; then
            if ! /usr/lib/postgresql/16/bin/pg_isready --host "$PGHOST" --port "$PGPORT"; then
              sudo pg_ctlcluster 16 main start
            fi
          else
            sudo pg_createcluster 16 main --port 5432 --start
          fi
          test "$(sudo -u postgres psql --no-psqlrc --host /var/run/postgresql --port 5432 --dbname postgres --tuples-only --no-align --command "SELECT current_setting('server_version_num')::integer / 10000")" = 16
          sudo -u postgres psql --no-psqlrc --host /var/run/postgresql --port 5432 --dbname postgres --set ON_ERROR_STOP=1 --command "ALTER ROLE postgres WITH LOGIN PASSWORD 'coh-host-fixture'"
          coh_fixture_database_exists="$(sudo -u postgres psql --no-psqlrc --host /var/run/postgresql --port 5432 --dbname postgres --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'coh_test_startup_bundle'")"
          if [ "$coh_fixture_database_exists" != 1 ]; then
            sudo -u postgres createdb --host /var/run/postgresql --port 5432 --owner postgres coh_test_startup_bundle
          fi
          test "$(psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT current_user = 'postgres' AND current_database() = 'coh_test_startup_bundle' AND current_setting('server_version_num')::integer / 10000 = 16")" = t
      - name: Authenticate original completed .25 Game and native proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-retained-native --output out/client-zoning-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Authenticate the published .25 packaging artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor-evidence --output out/client-zoning-donor/evidence
      - name: Recover the exact public .25 runtime donor APK
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor --output out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
      - name: Install host-only Vulkan headers and software fixture driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev mesa-vulkan-drivers
      - name: Qualify all 117 retained suites, focused zoning guards and native transfer fixtures
        run: >-
          python3 tools/android/interactive/qualify_client_zoning.py
          --repository-commit "$GITHUB_SHA"
          --donor-apk out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
          --donor-build-report out/client-zoning-donor/evidence/client-render-queue-apk-build-report.json
          --retained-client-directory out/client-zoning-native
          --output out/client-zoning-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-client-zoning-qualification
          path: out/client-zoning-qualification.json
          if-no-files-found: error
          retention-days: 90
  apk:
    needs: [changes, qualify]
    if: needs.changes.outputs.required == 'true' && github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate original completed .25 Game and native proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-retained-native --output out/client-zoning-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Ensure SDK 35 tools
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Authenticate the published .25 packaging artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor-evidence --output out/client-zoning-donor/evidence
      - name: Recover the exact public .25 runtime donor APK
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor --output out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-zoning-qualification
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: 36731428735
          github-token: ${{ github.token }}
      - name: Compile reviewed zoning Java and guest controls over exact .25 native runtime
        env:
          COH_INTERACTIVE_KEYSTORE_PASSWORD: android
        run: >-
          python3 tools/android/interactive/build_client_zoning_apk.py build
          --donor-apk out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
          --donor-build-report out/client-zoning-donor/evidence/client-render-queue-apk-build-report.json
          --qualification out/client-zoning-qualification.json
          --retained-client-directory out/client-zoning-native
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --repository-commit "$GITHUB_SHA"
          --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks"
          --output out/client-zoning-apk/COH-Atlas-Gameplay-0.13.26.apk
      - name: Fresh-process SDK signer and actual native/payload audit before publication
        env:
          PYTHONHASHSEED: '73422'
        run: >-
          python3 tools/android/interactive/build_client_zoning_apk.py audit
          --donor-apk out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
          --donor-build-report out/client-zoning-donor/evidence/client-render-queue-apk-build-report.json
          --qualification out/client-zoning-qualification.json
          --retained-client-directory out/client-zoning-native
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --repository-commit "$GITHUB_SHA"
          --apk out/client-zoning-apk/COH-Atlas-Gameplay-0.13.26.apk
          --build-report out/client-zoning-apk/client-zoning-apk-build-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-zoning-packaging-evidence
          path: |
            out/client-zoning-apk/client-zoning-apk-build-report.json
            out/client-zoning-apk/COH-Atlas-Gameplay-0.13.26-testing.txt
            out/client-zoning-apk/COH-Atlas-Gameplay-0.13.26.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-zoning-apk
          path: out/client-zoning-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Publish only the newly qualified continuation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/android/interactive/build_client_zoning_apk.py publish
          --donor-apk out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
          --donor-build-report out/client-zoning-donor/evidence/client-render-queue-apk-build-report.json
          --qualification out/client-zoning-qualification.json
          --retained-client-directory out/client-zoning-native
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --repository-commit "$GITHUB_SHA"
          --apk out/client-zoning-apk/COH-Atlas-Gameplay-0.13.26.apk
          --build-report out/client-zoning-apk/client-zoning-apk-build-report.json
      - name: Remove owned signing staging
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
  public-audit:
    needs: [changes, qualify, apk]
    if: needs.changes.outputs.required == 'true' && github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '2022'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate original completed .25 Game and native proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-retained-native --output out/client-zoning-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Ensure SDK 35 tools
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Authenticate the published .25 packaging artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor-evidence --output out/client-zoning-donor/evidence
      - name: Recover the exact public .25 runtime donor APK
        run: python3 tools/android/interactive/build_client_zoning_apk.py download-donor --output out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-zoning-qualification
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-zoning-packaging-evidence
          path: out/client-zoning-public
      - name: Download actual public APK, checksum and testing instructions
        run: >-
          python3 tools/android/interactive/build_client_zoning_apk.py download-public
          --build-report out/client-zoning-public/client-zoning-apk-build-report.json
          --output out/client-zoning-public
      - name: Independently audit actual public bytes against exact donor, native proof and SDK signer
        run: >-
          python3 tools/android/interactive/build_client_zoning_apk.py audit
          --donor-apk out/client-zoning-donor/COH-Atlas-Gameplay-0.13.25.apk
          --donor-build-report out/client-zoning-donor/evidence/client-render-queue-apk-build-report.json
          --qualification out/client-zoning-qualification.json
          --retained-client-directory out/client-zoning-native
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --repository-commit "$GITHUB_SHA"
          --apk out/client-zoning-public/COH-Atlas-Gameplay-0.13.26.apk
          --build-report out/client-zoning-public/client-zoning-apk-build-report.json
      - name: Record truthful public byte qualification
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/client-zoning-public/client-zoning-apk-build-report.json').read_text())
          evidence = {key: report[key] for key in ('bytes', 'sha256', 'repository_commit', 'version_name', 'version_code',
              'runtime_repository_commit', 'retained_native_repository_commit', 'native_client_recompiled',
              'native_client_compiled_in_current_publication_run', 'java_or_dex_recompiled',
              'mesa_driver_compiled_in_current_run', 'native_vulkan_probe_compiled_in_current_run',
              'wgl_probe_compiled_in_current_run', 'runtime_refresh_required', 'physical_zoning_validated',
              'physical_performance_validated', 'physical_fps_gain_validated',
              'successful_gpu_driver_and_both_probes_retained', 'software_fallback_preserved')}
          evidence.update(format=1, status='passed', fresh_process_prepublication_audit_passed=True,
              public_apk_checksum_and_notes_verified=True, sdk_signer_payload_audit_passed=True,
              public_url='https://github.com/Russianranger/coh-android/releases/download/coh-atlas-gameplay-v0.13.26/COH-Atlas-Gameplay-0.13.26.apk')
          Path('out/client-zoning-public-byte-audit.json').write_text(json.dumps(evidence, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-zoning-public-byte-audit
          path: out/client-zoning-public-byte-audit.json
          if-no-files-found: error
          retention-days: 90
