name: Native Android combined local-server client
on:
  push:
    branches: [native-android]
    paths:
      - native-android/combined-client/**
      - "!native-android/combined-client/evidence/**"
      - "!native-android/combined-client/diagnostics/**"
      - "!native-android/combined-client/tools/analyze_startup_resources.py"
      - "!native-android/combined-client/tools/test_startup_resources.py"
      - "!native-android/combined-client/tools/bench_startup_console.py"
      - "!native-android/combined-client/tools/read_startup_receipts.py"
      - "!native-android/combined-client/tools/test_startup_receipts.py"
      - native-android/engine/local/**
      - native-android/engine/perf/**
      - .github/workflows/native-combined-client.yml
      - .github/workflows/native-combined-memory-diagnostic.yml
      - .github/workflows/native-combined-report-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-combined-client-${{ github.ref }}
  # Retain ordinary runs; explicitly supersede an unqualified test candidate.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[replace-report-candidate]') }}
jobs:
  report-diagnostic-candidate:
    permissions:
      contents: write
      actions: read
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && !contains(github.event.head_commit.message, '[combined-requalify]') && !contains(github.event.head_commit.message, '[combined-017-requalify]') && !contains(github.event.head_commit.message, '[native-contracts-only]')
    uses: ./.github/workflows/native-combined-report-diagnostic.yml
