name: Native Android complete character probe
on:
  push:
    branches: [native-android]
    paths:
      - native-android/character-probe/**
      - native-android/material-probe/app/src/main/cpp/**
      - native-android/material-probe/shaders/**
      - native-android/material-probe/contract/material_reference.py
      - native-android/src/coh_dds.c
      - native-android/src/coh_assets.c
      - native-android/src/byte_reader.h
      - native-android/include/coh_native_core.h
      - native-android/animation/**
      - native-android/character/**
      - native-android/tools/character_fixture/**
      - native-android/tools/material_fixture/**
      - .github/workflows/native-character-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-character-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package-and-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Recover complete source-selected character fixtures and source oracles
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 native-android/tools/character_fixture/acquire.py --output native-android/results/character-corpus
          python3 native-android/tools/character_fixture/prepare.py --corpus native-android/results/character-corpus --output native-android/character-probe/app/src/main/assets --evidence-output native-android/results/character-probe/fixture
      - name: Qualify independent actor hierarchy and costume material references
        run: |
          python3 - <<'PYREF'
          import sys, json
          sys.path.insert(0, 'native-android/character-probe/contract')
          import hierarchy_reference
          hierarchy_reference.self_check()
          with open('native-android/results/character-probe/hierarchy-reference-selfcheck.json', 'w') as output:
              json.dump({'passed': True, 'kind': 'independent source actor hierarchy/socket analytic checks'}, output)
          PYREF
          python3 native-android/character-probe/contract/build_character_material_reference.py --self-check > native-android/results/character-probe/material-reference-selfcheck.json
      - name: Qualify bounded complete character parser and actor parity
        run: |
          python3 native-android/tools/character_fixture/native_character_check.py --character native-android/character-probe/app/src/main/assets/character.bin --rig native-android/character-probe/app/src/main/assets/rig.bin --morph native-android/character-probe/app/src/main/assets/morph.bin --reference native-android/character-probe/app/src/main/assets/character-reference.bin --output native-android/results/character-probe/host-character-proof.json
      - name: Assemble isolated ARM64 test APK
        run: |
          python3 native-android/character-probe/gradle.py :app:assembleDebug :app:lintDebug
          mkdir -p native-android/results/character-probe
          cp native-android/character-probe/app/build/outputs/apk/debug/app-debug.apk native-android/results/character-probe/CoH-Native-Character-Probe-0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs native-android/results/character-probe/CoH-Native-Character-Probe-0.1.0-arm64.apk > native-android/results/character-probe/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native-android/results/character-probe/CoH-Native-Character-Probe-0.1.0-arm64.apk > native-android/results/character-probe/apk-badging.txt
      - name: Assemble separate emulator test APK
        run: |
          python3 native-android/character-probe/gradle.py -PprobeAbis=x86_64 :app:assembleDebug
          cp native-android/character-probe/app/build/outputs/apk/debug/app-debug.apk native-android/results/character-probe/CoH-Native-Character-Probe-0.1.0-emulator-x86_64.apk
      - name: Verify package ABI and record exact build inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, zipfile
          root = pathlib.Path('native-android/results/character-probe')
          assets = pathlib.Path('native-android/character-probe/app/src/main/assets')
          expected_assets = {'character.bin', 'rig.bin', 'morph.bin', 'character-reference.bin', 'material-reference.bin'}
          metadata = json.loads((assets/'character-fixture.json').read_text())
          assert set(metadata['assets']) == expected_assets, metadata['assets']
          assert {path.name for path in assets.iterdir() if path.is_file()} == expected_assets | {'character-fixture.json'}
          for name, identity in metadata['assets'].items():
              payload = (assets/name).read_bytes()
              assert len(payload) == identity['bytes'] and hashlib.sha256(payload).hexdigest() == identity['sha256'], name
          artifacts = []
          for label, abi, machine in [('arm64', 'arm64-v8a', 183), ('emulator-x86_64', 'x86_64', 62)]:
              path = root / ('CoH-Native-Character-Probe-0.1.0-' + label + '.apk')
              with zipfile.ZipFile(path) as apk:
                  native = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
                  assert native == ['lib/' + abi + '/libcoh_character_probe.so'], native
                  elf = apk.read(native[0])
                  assert elf[:6] == b'\x7fELF\x02\x01' and struct.unpack_from('<H', elf, 18)[0] == machine
                  packaged_assets = {name.removeprefix('assets/') for name in apk.namelist() if name.startswith('assets/') and not name.endswith('/')}
                  assert packaged_assets == expected_assets | {'character-fixture.json'}, packaged_assets
                  for name in packaged_assets:
                      assert apk.read('assets/'+name) == (assets/name).read_bytes(), name
              artifacts.append({'file': path.name, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'abi': abi, 'elf_machine': machine, 'native_library': {'file': native[0], 'bytes': len(elf), 'sha256': hashlib.sha256(elf).hexdigest()}, 'packaged_fixture_bytes_verified': True})
          fixture_files = [{'file': str(path.relative_to(assets)), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(assets.rglob('*')) if path.is_file()]
          assert fixture_files, 'Fixture preparation produced no assets'
          receipt = {'schema': 1, 'source_commit': os.environ['GITHUB_SHA'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'application_id': 'org.coh.characterprobe', 'min_sdk': 26, 'target_sdk': 35, 'compile_sdk': 35, 'gradle': '8.9', 'gradle_distribution_sha256': 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab', 'android_gradle_plugin': '8.7.3', 'ndk': '28.2.13676358', 'cmake': '3.22.1', 'signing': 'isolated CI debug key; not the production launcher key', 'phase': 8, 'probe_version': '0.1.0-phase8', 'original_game_execution': False, 'full_sequencer_execution': False, 'artifacts': artifacts, 'fixture_assets': fixture_files, 'thor_device_execution_verified': False}
          (root/'build-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join(item['sha256']+'  '+item['file']+'\n' for item in artifacts))
          for path in assets.glob('*.json'):
              (root/path.name).write_bytes(path.read_bytes())
          PY
      - name: Enable hosted emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Android 13 complete actor, costume material, and lifecycle qualification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/character-probe/tools/emulator_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-character-probe-evidence
          path: native-android/results/character-probe/
          if-no-files-found: error
          retention-days: 30
