name: Native initial ALLENTS first-create probe
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-initial-create-probe.yml
      - native-android/engine/initial-capture/coh_initial_create_probe.*
      - native-android/engine/initial-capture/check_initial_create_probe.py
      - native-android/engine/initial-capture/test_initial_create_probe.c
      - native-android/combined-client/app/src/main/cpp/interop_network.c
      - native-android/combined-client/diagnostics/interop-adapter-20261018/check_adapter.py
      - native-android/combined-client/diagnostics/interop-adapter-20261018/test_interop_adapter.c
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-first-create-${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-create:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install native test headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Qualify original-create fixtures and bounded parser
        run: python3 native-android/engine/initial-capture/check_initial_create_probe.py --sanitize --output "$RUNNER_TEMP/first-create-host.json"
      - name: Qualify affected JNI observation and cleanup
        run: python3 native-android/combined-client/diagnostics/interop-adapter-20261018/check_adapter.py --source-root . --output "$RUNNER_TEMP/first-create-adapter"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-first-create-${{ github.sha }}
          path: |
            ${{ runner.temp }}/first-create-host.json
            ${{ runner.temp }}/first-create-adapter/
          if-no-files-found: error
          retention-days: 90
