name: Native initial ALLENTS first-pose probe
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-initial-create-probe.yml
      - native-android/engine/initial-capture/coh_initial_pose_probe.*
      - native-android/engine/initial-capture/check_initial_pose_probe.py
      - native-android/engine/initial-capture/test_initial_pose_probe.c
      - native-android/engine/initial-capture/qualification/initial-pose-20261019/jni-fixture.h
      - native-android/combined-client/app/src/main/cpp/interop_network.c
      - native-android/combined-client/diagnostics/interop-adapter-20261018/check_adapter.py
      - native-android/combined-client/diagnostics/interop-adapter-20261018/test_interop_adapter.c
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-first-pose-${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-pose:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install native test headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Qualify original mode and absolute pose fixtures
        run: |
          python3 native-android/engine/initial-capture/check_initial_pose_probe.py --sanitize --output "$RUNNER_TEMP/first-pose-host.json" --fixture-output "$RUNNER_TEMP/first-pose-jni-fixture.h"
          cmp "$RUNNER_TEMP/first-pose-jni-fixture.h" native-android/engine/initial-capture/qualification/initial-pose-20261019/jni-fixture.h
      - name: Qualify affected JNI observation and cleanup
        run: python3 native-android/combined-client/diagnostics/interop-adapter-20261018/check_adapter.py --source-root . --output "$RUNNER_TEMP/first-pose-adapter"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-first-pose-${{ github.sha }}
          path: |
            ${{ runner.temp }}/first-pose-host.json
            ${{ runner.temp }}/first-pose-adapter/
          if-no-files-found: error
          retention-days: 90
