name: Thor .30 animation installer repair retaining .29 native and assets
on:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - tools/android/interactive/release-client-animation-repair-0.13.30.json
      - .github/workflows/android-client-animation-repair.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-client-animation-repair-publication
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.gate.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: gate
        name: Preserve any completed .30 publication and require the exact approved donor
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools/android/interactive')
          import build_client_animation_repair_apk as current
          marker = json.loads(Path('tools/android/interactive/release-client-animation-repair-0.13.30.json').read_text())
          assert marker['version'] == current.VERSION_NAME and marker['version_code'] == current.VERSION_CODE
          assert marker['donor_commit'] == current.DONOR_COMMIT and marker['asset_version'] == '1.0.0'
          request = urllib.request.Request('https://api.github.com/repos/'+current.REPOSITORY+'/releases/tags/'+current.RELEASE_TAG,
            headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
            with urllib.request.urlopen(request, timeout=30) as response: release = json.load(response)
          except urllib.error.HTTPError as error:
            if error.code != 404: raise
            required = True
          else:
            current.validate_existing_release(release); required = False
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('required='+str(required).lower()+'\n')
          print('Publication required:', required, '; retained .29 DEX/native/graphics and Assets 1.0.0')
          PY
  apk:
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: write, actions: read}
    env:
      COH_ANIMATION_REPAIR_ASSET_CACHE: '${{ github.workspace }}/out/animation-repair-assets'
      COH_RECEIPT_REPAIR_TEST_DONOR_APK: '${{ github.workspace }}/out/donor.apk'
      COH_ANIMATION_TEST_DONOR_APK: '${{ github.workspace }}/out/donor.apk'
      COH_ANIMATION_TEST_DONOR_REPORT: '${{ github.workspace }}/out/donor-evidence/client-receipt-repair-apk-build-report.json'
      COH_REQUIRE_STARTUP_BUNDLE_PG: '1'
      COH_REQUIRE_LEVELUP_UI_REPAIR_PG: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: coh-host-fixture
      PGDATABASE: coh_test_startup_bundle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: SDK signing tools and all retained PostgreSQL and Vulkan host fixtures
        run: |
          timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16 libvulkan-dev mesa-vulkan-drivers
          sudo pg_ctlcluster 16 main start || /usr/lib/postgresql/16/bin/pg_isready --host "$PGHOST" --port "$PGPORT"
          sudo -u postgres psql --no-psqlrc --dbname postgres --set ON_ERROR_STOP=1 --command "ALTER ROLE postgres WITH LOGIN PASSWORD 'coh-host-fixture'"
          sudo -u postgres createdb --owner postgres coh_test_startup_bundle
          test "$(psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --command "SELECT current_user = 'postgres' AND current_database() = 'coh_test_startup_bundle' AND current_setting('server_version_num')::integer / 10000 = 16")" = t
      - name: Download exact public .29 donor and authenticated packaging and public-byte evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-donor --output out/donor.apk
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-donor-evidence --output out/donor-evidence
      - name: Qualify actual packaged animation, graph and cache installers and every retained suite
        run: >-
          python3 tools/android/interactive/qualify_client_animation_repair.py --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
          --output out/client-animation-repair-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-client-animation-repair-qualification
          path: out/client-animation-repair-qualification.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: 36731428735
          github-token: ${{ github.token }}
      - name: Repackage two reviewed guest helpers with exact retained .29 DEX and native archives
        env: {COH_INTERACTIVE_KEYSTORE_PASSWORD: android}
        run: >-
          python3 tools/android/interactive/build_client_animation_repair_apk.py build --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
          --qualification out/client-animation-repair-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks"
          --output out/client-animation-repair-apk/COH-Atlas-Gameplay-0.13.30.apk
      - name: Retain diagnostic candidates before independent audit without accepting them
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('out/unaccepted-animation-repair'); target.mkdir(parents=True, exist_ok=True)
          for name in ('COH-Atlas-Gameplay-0.13.30.apk', 'COH-Atlas-Gameplay-0.13.30.apk.sha256',
              'COH-Atlas-Gameplay-0.13.30-testing.txt', 'client-animation-repair-apk-build-report.json'):
            source = Path('out/client-animation-repair-apk')/name
            if source.is_file() and not source.is_symlink(): shutil.copyfile(source, target/name)
          (target/'UNACCEPTED.txt').write_text('Diagnostic candidates only. These bytes precede the independent audit and do not authorize publication.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-client-animation-repair-unaccepted-diagnostics
          path: out/unaccepted-animation-repair/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Fresh-process SDK signer and exact payload reconstruction with independent hash seed
        env: {PYTHONHASHSEED: '73422'}
        run: >-
          python3 tools/android/interactive/build_client_animation_repair_apk.py audit --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
          --qualification out/client-animation-repair-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/client-animation-repair-apk/COH-Atlas-Gameplay-0.13.30.apk
          --build-report out/client-animation-repair-apk/client-animation-repair-apk-build-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-animation-repair-apk
          path: out/client-animation-repair-apk/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Publish the qualified APK only and verify unchanged Assets 1.0.0 metadata
        env: {GH_TOKEN: '${{ github.token }}'}
        run: >-
          python3 tools/android/interactive/build_client_animation_repair_apk.py publish --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
          --qualification out/client-animation-repair-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/client-animation-repair-apk/COH-Atlas-Gameplay-0.13.30.apk
          --build-report out/client-animation-repair-apk/client-animation-repair-apk-build-report.json
      - name: Remove owned signing staging
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
  public-audit:
    needs: [changes, apk]
    if: always() && needs.changes.result == 'success' && needs.apk.result == 'success' && needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: SDK audit tools only
        run: timeout 180 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with: {name: coh-client-animation-repair-apk, path: out/accepted}
      - uses: actions/download-artifact@v4
        with: {name: coh-client-animation-repair-qualification, path: out}
      - name: Authenticate original .29 donor and previously audited unchanged asset pack
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-donor --output out/donor.apk
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-donor-evidence --output out/donor-evidence
          python3 tools/android/interactive/build_client_animation_repair_apk.py verify-assets --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
      - name: Download actual public .30 APK, checksum and instructions
        run: >-
          python3 tools/android/interactive/build_client_animation_repair_apk.py download-public
          --build-report out/accepted/client-animation-repair-apk-build-report.json --output out/public
      - name: Audit public signer, retained native and asset identity, and actual packaged asset installers
        env: {PYTHONHASHSEED: '2022'}
        run: >-
          python3 tools/android/interactive/build_client_animation_repair_apk.py audit --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor.apk --donor-build-report out/donor-evidence/client-receipt-repair-apk-build-report.json
          --qualification out/client-animation-repair-qualification.json --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --apk out/public/COH-Atlas-Gameplay-0.13.30.apk
          --build-report out/accepted/client-animation-repair-apk-build-report.json
      - name: Record public-byte proof without physical Thor claims
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('out/accepted/client-animation-repair-apk-build-report.json').read_text())
          Path('out/client-animation-repair-public-byte-audit.json').write_text(json.dumps({
            'format': 1, 'status': 'passed', 'repository_commit': report['repository_commit'],
            'run_id': int(os.environ['GITHUB_RUN_ID']), 'apk': {key: report[key] for key in ('bytes', 'sha256', 'version_name', 'version_code')},
            'public_apk_verified': True, 'actual_runtime_asset_installers_verified': True,
            'all_native_member_bytes_retained': True,
            'original_asset_public_byte_audit_artifact_id': 11708366753,
            'unchanged_assets_1_0_0_metadata_verified': True, 'asset_release_republished': False,
            'physical_recovery_validated': False, 'physical_kings_row_zoning_validated': False,
            'physical_fps_gain_validated': False}, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coh-client-animation-repair-public-byte-audit
          path: out/client-animation-repair-public-byte-audit.json
          retention-days: 90
          if-no-files-found: error
