name: Native socket boundary exact-binary continuation
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-socket-boundary-requalify.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-socket-boundary-requalify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-boundary-android13:
    if: github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[socket-boundary-requalify]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Recover the exact already-executed socket binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Russianranger/coh-android/actions/runs/38830583695 > /tmp/socket-source-run.json
          gh api repos/Russianranger/coh-android/actions/artifacts/12016554135 > /tmp/socket-source-artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/12016554135/zip > /tmp/socket-source-evidence.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, zipfile
          source = '7c9cfdb9d5f87c2297f8772fc3aeff528577728f'
          output = Path('native-android/results/socket-boundary-requalify')
          output.mkdir(parents=True, exist_ok=True)
          run = json.loads(Path('/tmp/socket-source-run.json').read_text())
          artifact = json.loads(Path('/tmp/socket-source-artifact.json').read_text())
          assert run['id'] == 38830583695 and run['head_sha'] == source
          assert run['head_branch'] == 'native-android' and run['event'] == 'push'
          assert run['path'] == '.github/workflows/native-session-protocol.yml'
          assert artifact['id'] == 12016554135 and artifact['name'] == 'native-session-android-socket-evidence'
          assert artifact['size_in_bytes'] == 74084 and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == source
          archive = Path('/tmp/socket-source-evidence.zip')
          assert archive.stat().st_size == 74084
          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_sha == '22aee991e1f5f0d2dfb0cece75f4fe48d889cebd8f53b87e263789906d12de00'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', source], check=True)
          closure = ['native-android/engine/network/', 'native-android/protocol/',
                     'native-android/include/', 'native-android/src/coh_blowfish.c',
                     'native-android/src/byte_reader.h', 'native-android/engine/coh_contracts.h']
          subprocess.run(['git', 'diff', '--exit-code', source, 'HEAD', '--', *closure], check=True)
          expected_sources = {'engine/network/coh_net.c': 'e242a386bc0981a6f1c7d2029e1c6d405d7d6ef49f65f44f3970781212d981e1', 'engine/network/coh_net_frame.c': '44d439583ce6e41cb4a5546dcf5a206af5511af9e22feb5f4b28b39a56ce7bbc', 'engine/network/coh_net_zip.c': '40fafbf3e1bbac6c0e3d8cdbb128de8fbad3342c1b4c5e5357027bbf95a20747', 'engine/network/coh_net_udp.c': 'c0d8d598a8e748bccaa34a5e55392cf267c86b4ce05059aa1eef401cde8b3f4d', 'engine/network/tests/test_udp.c': '3321729647edf084898467110a55b2f03737b21b478c1321122a6f84e7061286', 'protocol/coh_protocol.c': '6a209d824141c6c97ba60ac5888b3e2953b33a06f086ec8df5fa038b83f74eea', 'src/coh_blowfish.c': 'ee89821fd473ba06b7e34e4350bb624cc6092dc59903a25179ded5a2bfbfc470', 'engine/network/coh_net.h': 'fedddf3c7c83cc7636af027b3c0bd7c1cb8dbb919275b8ac6cd59cc7b7b6dddb', 'engine/network/coh_net_udp.h': '7309f2b2bd431bb620ea0980b456bd3373fa0f1d369654a3702167cd11cff1e4', 'engine/network/coh_net_zip_internal.h': 'a84bf15c49556643459cb0c43cdae3abd27eb9fb05c5e9387d1684df239a7ffd', 'engine/coh_contracts.h': '2a43032fc97c7aa7042224431a4b90f1ec3d27566bed7ff2fe9070e72cb37832', 'protocol/coh_protocol.h': '61312a886aca0f8ff5275950497375477cc158d4ed9c5b7af6aa019f51f3d3d4', 'include/coh_native_core.h': '48c4e1fcbe4380778066aa1257159503883773e3b7e250fafcc61abc28818106', 'src/byte_reader.h': 'c00f1ab7cce5e15fb7d693041bec751ddc8dbe06d9ff86c131f677cdb55238e1'}
          for name, digest in expected_sources.items():
              assert hashlib.sha256((Path('native-android')/name).read_bytes()).hexdigest() == digest, name
          members = {'android-udp-stdout.txt', 'coh-net-udp-arm64', 'boundary-build.json', 'coh-net-udp-x86_64'}
          with zipfile.ZipFile(archive) as z:
              assert len(z.infolist()) == 4 and set(z.namelist()) == members
              assert sum(info.file_size for info in z.infolist()) <= 4194304
              for info in z.infolist():
                  assert info.filename in members and not info.is_dir() and info.file_size <= 1048576
                  assert not info.flag_bits & 1
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000
              assert z.testzip() is None
              for info in z.infolist():
                  (output/info.filename).write_bytes(z.read(info))
          receipt = json.loads((output/'boundary-build.json').read_text())
          assert receipt['schema'] == 'coh-native-android-socket-boundary-build-v1' and receipt['passed'] is True
          assert receipt['android_executed'] is False
          assert receipt['source_sha256'] == {k: v for k, v in expected_sources.items() if k.endswith('.c')}
          expected_binaries = {
              'arm64': {'sha256': '94fcac187db8895caaae5480121911f50835a7eb7290fc7a6bd6d40840cb0c88', 'bytes': 68672},
              'x86_64': {'sha256': 'e141cb6055fd43d008269cf54187301fad1068cf90e635a39f9b619cc9920108', 'bytes': 72176},
          }
          assert set(receipt['binaries']) == set(expected_binaries)
          for abi, expected in expected_binaries.items():
              binary = output/('coh-net-udp-'+abi)
              assert binary.stat().st_size == expected['bytes'] == receipt['binaries'][abi]['bytes']
              assert hashlib.sha256(binary.read_bytes()).hexdigest() == expected['sha256'] == receipt['binaries'][abi]['sha256']
          old_stdout = output/'android-udp-stdout.txt'
          shutil.copyfile(old_stdout, output/'previous-android-udp-stdout.txt')
          proof = {'schema': 'coh-native-socket-boundary-reuse-v1', 'passed': True,
                   'source_commit': source, 'source_run': 38830583695, 'source_artifact': 12016554135,
                   'archive_sha256': archive_sha, 'archive_bytes': 74084,
                   'binaries': expected_binaries, 'production_closure_unchanged': True,
                   'source_sha256': expected_sources,
                   'previous_stdout_sha256': hashlib.sha256(old_stdout.read_bytes()).hexdigest(),
                   'rebuilt': False, 'apk_rebuilt': False, 'android_executed': False}
          (output/'exact-binary-reuse.json').write_text(json.dumps(proof, indent=2)+'\n')
          print(json.dumps({'passed': True, 'exact_existing_binaries': True, 'rebuilt': False}))
          PY
      - name: Check strict socket report validation
        run: python3 native-android/engine/session/android_boundary.py --self-test --output native-android/results/socket-boundary-requalify
      - name: Enable hosted Android emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Qualify exact existing boundary binary on Android 13
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/engine/session/android_boundary.py --execute --output native-android/results/socket-boundary-requalify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-socket-boundary-requalified
          path: native-android/results/socket-boundary-requalify/
          if-no-files-found: error
          retention-days: 90
