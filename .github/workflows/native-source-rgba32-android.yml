name: Typed source RGBA32 ownership on Android13
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-source-rgba32-android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-source-rgba32-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-rgba32-android13:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[source-rgba32-android]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact NDKr28c without replaying host controls
        run: |
          curl --fail --silent --show-error --location --output /tmp/source-rgba32-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  /tmp/source-rgba32-ndk.zip' | sha256sum -c -
          unzip -q /tmp/source-rgba32-ndk.zip -d /tmp/source-rgba32-ndk
      - name: Build only the new standalone fixture for arm64 and x86_64
        run: |
          python3 native-android/engine/world-render-adapter/tests/run_source_rgba32_android.py build --source-root "$GITHUB_WORKSPACE" --actual-defaults-zip native-android/combined-client/diagnostics/continuation-f-20261017/actual-groups-39078874753/default-bodies-artifact.zip --ndk /tmp/source-rgba32-ndk/android-ndk-r28c --output out/source-rgba32-android/build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: test -c /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Execute new source RGBA32 ownership controls on Android13
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/engine/world-render-adapter/tests/run_source_rgba32_android.py execute --source-root "$GITHUB_WORKSPACE" --build out/source-rgba32-android/build --adb "$ANDROID_HOME/platform-tools/adb" --output out/source-rgba32-android/execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-rgba32-both-abis-android13-${{ github.sha }}
          path: out/source-rgba32-android/
          if-no-files-found: error
          retention-days: 90
