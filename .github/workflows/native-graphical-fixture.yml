name: Fresh original graphical full-database witness
on:
  push:
    branches: [native-android]
    paths: [.github/workflows/native-graphical-fixture.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-graphical-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-source-character:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[graphical-fixture]'))
    # Required only to read the retained input ZIP from its existing draft release.
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Install only retained host launcher and graphical driver dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gawk default-jdk-headless tesseract-ocr python3-pil
          df -h "$RUNNER_TEMP"
      - name: Check fixture publication, cleanup and source-padded PostgreSQL status
        run: python3 native-android/engine/scenecatalog-server/test_graphical_fixture.py
      - name: Retrieve exact retained APK and previously executed ARM64 launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,stat,subprocess,zipfile
          launcher={
            'licenses/PRoot-COPYING':(19106,'0ffa6454acbe7e410ac6f0007df83b9b3161fe55484c1f4b87487c0f2d228a6d'),
            'licenses/talloc-talloc.h':(65526,'e01fb092aaed2b431be26674e2b791c77fb5984537c29b514e957582c6b31465'),
            'licenses/talloc-LICENSE':(7651,'da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768'),
            'proot':(287720,'a6ae0af6e1ed808f2d5c9fc0e01198bb1606fbd30e94cab35edcfe0b9084fbbb'),
            'proot-build-receipt.json':(3048,'6b853fd6732aa57ce4d8d096152f7818f47afdc91b6926fb6492b1ab2da987b5'),
            'proot-corresponding-sources.tar.gz':(1014945,'721b011aabba1b82c47713eb91c54e7395325f650882060b52448a3bd264221d'),
            'proot-loader':(17672,'c132e52ce325929514b3341aa51aefbcbd3685394350ece03c527f08ee3fb8b5')}
          specs=[
            (11192425448,553313601,'82a769943a7237465c26d42e419fa54e39ec6ab6010376f566a752a1c47f6a90','out/client',1024*1024**2,None),
            (12116450116,1177704,'bf4063b2d15a4cb92127df5b0cf0eabd894a0ecc855ceaa4c0acda3acb772808',os.environ['RUNNER_TEMP']+'/coh-fixture-native/linux-arm64',32*1024**2,launcher)]
          for ident,size,digest,directory,limit,members in specs:
              target=pathlib.Path(directory);target.mkdir(parents=True)
              archive=target.parent/(str(ident)+'.zip')
              with archive.open('xb') as output:subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=600)
              with archive.open('rb') as source:actual=hashlib.file_digest(source,'sha256').hexdigest()
              assert archive.stat().st_size==size and actual==digest
              with zipfile.ZipFile(archive) as z:
                  infos=z.infolist();assert len(infos)<=256 and len({i.filename for i in infos})==len(infos) and sum(i.file_size for i in infos)<=limit
                  for item in infos:
                      path=pathlib.PurePosixPath(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename and ':' not in item.filename and not stat.S_ISLNK(item.external_attr>>16)
                  if members is not None:
                      assert {i.filename for i in infos}==set(members)
                      for item in infos:
                          payload=z.read(item)
                          assert not item.is_dir() and (item.file_size,hashlib.sha256(payload).hexdigest())==members[item.filename]
                  z.extractall(target)
              if members is not None:
                  for executable in ('proot','proot-loader'):(target/executable).chmod(0o755)
              archive.unlink()
          PY
      - name: Prepare exact donor checkout without rebuilding retained launcher
        run: |
          git worktree add --detach "$RUNNER_TEMP/coh-fixture-donor" 204615c6c4a809d6b814c7174b81448cffea3f7a
      - name: Read the same reviewed original game ZIP without recapture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/coh-fixture-donor/tools/fetch_runtime_asset_bundle.py" --receipt "$RUNNER_TEMP/coh-fixture-donor/assets/reference-inputs-receipt.json" --output "$GITHUB_WORKSPACE/out/client-assets.zip" --release-asset-id 588984151
      - name: Create and ordinarily save one fresh original character then capture its whole database
        id: capture
        run: |
          PROOT_RECEIPT_SHA=6b853fd6732aa57ce4d8d096152f7818f47afdc91b6926fb6492b1ab2da987b5
          python3 native-android/engine/scenecatalog-server/capture_graphical_fixture.py --donor "$RUNNER_TEMP/coh-fixture-donor" --ocr-overlay "$GITHUB_WORKSPACE/tools/android/interactive/character_host_smoke.py" --apk "$GITHUB_WORKSPACE/out/client/COH-Character-Reopen-0.10.0.apk" --build-report "$GITHUB_WORKSPACE/out/client/interactive-apk-build-report.json" --archive "$GITHUB_WORKSPACE/out/client-assets.zip" --proot "$RUNNER_TEMP/coh-fixture-native/linux-arm64" --proot-receipt-sha256 "$PROOT_RECEIPT_SHA" --work "$RUNNER_TEMP/coh-fixture-work" --evidence "$GITHUB_WORKSPACE/out/fixture-evidence" --output "$GITHUB_WORKSPACE/out/fresh-fixture"
      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome == 'success'
        with:
          name: source-created-graphical-fixture-${{ github.sha }}
          path: out/fresh-fixture/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome != 'success'
        with:
          name: source-created-graphical-fixture-${{ github.sha }}
          path: out/fresh-fixture/fixture-capture.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-created-graphical-fixture-evidence-${{ github.sha }}
          path: out/fixture-evidence/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-created-fixture-host-launcher-${{ github.sha }}
          path: ${{ runner.temp }}/coh-fixture-native/linux-arm64/
          if-no-files-found: warn
          retention-days: 90
