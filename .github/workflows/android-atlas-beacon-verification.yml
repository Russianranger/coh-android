name: Verify authentic recovered Atlas native beacon artifact
on:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - .github/workflows/android-atlas-beacon-verification.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: android-atlas-beacon-native-verification
  cancel-in-progress: false
env:
  # Frozen only after the new proof-only run succeeds; the failed origin is separate.
  COH_ATLAS_BEACON_REUSE_RUN_ID: '37390562231'
  COH_ATLAS_BEACON_REUSE_COMMIT: 'd856c41b586c87fd2d093eaa4d17c28d3508b66d'
jobs:
  verify:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Preserve exact generation source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coh-ui-beacon-native
          path: out/ui-beacon-native
          run-id: ${{ env.COH_ATLAS_BEACON_REUSE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify known host-only checkpoint routing and retained fail-closed boundaries
        run: python3 -m unittest discover -s tools/android/interactive -p 'test_classify_*change.py' -q
      - name: Verify actual native graph evidence and print exact frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.request

          sys.path[:0] = ['tools/android/interactive', 'tools', 'android/guest']
          import generate_atlas_beacons as producer
          import atlas_beacon_package as guest

          run_id = int(os.environ['COH_ATLAS_BEACON_REUSE_RUN_ID'])
          native_commit = os.environ['COH_ATLAS_BEACON_REUSE_COMMIT']
          producer.require(run_id > 0 and len(native_commit) == 40
              and all(value in '0123456789abcdef' for value in native_commit),
              'An exact successful proof-only follow-up run and source commit are required')
          request = urllib.request.Request(
              f'https://api.github.com/repos/Russianranger/coh-android/actions/runs/{run_id}',
              headers={'Accept': 'application/vnd.github+json',
                       'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.loads(response.read(4 * 1024 * 1024))
          producer.require(run.get('id') == run_id and run.get('status') == 'completed'
              and run.get('conclusion') == 'success' and run.get('head_sha') == native_commit
              and run.get('head_branch') == 'codex/character-persistence-continuation'
              and run.get('path') == '.github/workflows/android-atlas-beacon-generation.yml',
              'Exact standalone native recovery qualification run is not successful')

          directory = Path('out/ui-beacon-native')
          manifest = producer.validate_package(directory, os.environ['GITHUB_SHA'])
          report = json.loads((directory / producer.REPORT).read_bytes())
          producer.require(report['repository_commit'] == native_commit
              and report['native'] == manifest['native'],
              'Native artifact provenance differs from the successful proof-only run')
          identity = manifest['input_identity']
          producer.require(manifest['source_commit'] == guest.SOURCE_COMMIT
              and manifest['data_commit'] == guest.DATA_COMMIT
              and manifest['stock_mapserver_sha256'] == guest.STOCK_MAPSERVER_SHA256
              and identity['asset_archive'] == guest.BASE_ARCHIVE
              and identity['world_manifest']['sha256'] == guest.WORLD_MANIFEST_SHA256
              and identity['visual_source_manifest'] == guest.VISUAL_SOURCE_MANIFEST
              and identity['visual_geometry_sha256'] == guest.VISUAL_GEOMETRY_SHA256
              and identity['visual_object_geometry_sha256'] == guest.VISUAL_OBJECT_GEOMETRY_SHA256
              and identity['required_geometry_sha256'] == guest.REQUIRED_GEOMETRY_SHA256
              and hashlib.sha256(producer.canonical(manifest['required_geometry_files'])).hexdigest()
                  == guest.REQUIRED_GEOMETRY_SHA256,
              'Native artifact does not match the retained exact world and original visual donors')
          mirror = report['cold_mirror']
          origin = producer.validate_recovered_origin(report['graph_origin'], directory,
              report['build_input'], report['generator'])
          producer.require(report['format'] == manifest['format'] == 3
              and report['cleanup_complete'] is True and report['owned_roles'] == 0
              and report['qualification_mode'] == 'recovered_primary_fresh_proofs'
              and report['native_worker_spawning_allowed'] is False
              and report['profile_verification_processes'] == 2
              and mirror['required_geometry_installed_before_mirror'] is True
              and mirror['created_before_full_visual_overlay_and_readback'] is True
              and mirror['readonly_inputs_hardlinked'] is True
              and mirror['private_cache_roots'] == ['data/bin', 'data/geobin', 'data/server'],
              'Native proof-only roles or fresh isolated profile proof is incomplete')
          producer.require(set(manifest['input_profiles']) == {'required_geometry_cold', 'client_visual_reopen'}
              and report['profile_proofs'] == manifest['input_profiles']
              and manifest['native'] == origin['native']
              and manifest['native']['native_pathfinder_successes'] == 32
              and manifest['native']['native_full_graph_readback_verified'] is True
              and manifest['native']['fresh_ordinary_world_crc_verified'] is True,
              'Both actual required-geometry native CRC/readback/path proofs are required')

          result = {
              'format': 2, 'status': 'passed',
              'verification_repository_commit': os.environ['GITHUB_SHA'],
              'qualification_repository_commit': report['repository_commit'],
              'original_generation_repository_commit': origin['source']['repository_commit'],
              'qualification_run': {'id': run_id, 'head_sha': run['head_sha'],
                  'status': run['status'], 'conclusion': run['conclusion'],
                  'path': run['path']},
              'archive': producer.pin(directory / producer.ARCHIVE),
              'manifest': producer.pin(directory / producer.MANIFEST),
              'generation_report': producer.pin(directory / producer.REPORT),
              'native': manifest['native'], 'input_profiles': manifest['input_profiles'],
              'input_identity': identity,
              'common_input_files': len(manifest['input_files']),
              'required_geometry_files': len(manifest['required_geometry_files']),
              'graph_files': manifest['files'],
              'generation_sources': report['generation_sources'],
              'build_input_sha256': hashlib.sha256(producer.canonical(report['build_input'])).hexdigest(),
              'cleanup_complete': True, 'owned_roles': 0,
              'qualification_mode': report['qualification_mode'],
              'graph_origin': origin,
              'qualification_visual': report['qualification_visual'],
              'profile_cache_isolation': report['profile_cache_isolation'],
              'native_worker_spawning_allowed': False,
              'profile_verification_processes': 2,
              'physical_npc_pathing_validated': False,
          }
          target = Path('out/atlas-beacon-cloud-verification.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print('COH_ATLAS_BEACON_CLOUD_VERIFICATION_V1 ' + producer.canonical(result).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coh-atlas-beacon-cloud-verification
          path: out/atlas-beacon-cloud-verification.json
          if-no-files-found: error
          retention-days: 90
