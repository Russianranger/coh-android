name: Generate authentic single-map Atlas native beacons
on:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - .github/workflows/android-atlas-beacon-generation.yml
      - tools/prepare_atlas_beacon_generator_source.py
      - tools/android/interactive/generate_atlas_beacons.py
      - patches/atlas-beacons/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-atlas-beacon-native-generation
  cancel-in-progress: true
jobs:
  generate:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/codex/character-persistence-continuation'
    # GitHub requires write permission to READ this existing reviewed draft
    # release asset, as in the accepted server-cache workflow. No publishing step.
    permissions:
      contents: write
      actions: read
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - name: Preserve exact generation source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: coh-reopen-startup-repair-packaging-evidence
          path: out/ui-beacon-donor/evidence
          run-id: 37324515114
          github-token: ${{ github.token }}
      - name: Recover exact public working world and reviewed original import input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Path out/ui-beacon-donor -Force | Out-Null
          $donor = 'out/ui-beacon-donor/COH-Atlas-Gameplay-0.13.13.apk'
          if (Test-Path $donor) { throw 'Fresh public donor path required' }
          Invoke-WebRequest -Uri 'https://github.com/Russianranger/coh-android/releases/download/coh-atlas-gameplay-v0.13.13/COH-Atlas-Gameplay-0.13.13.apk' -OutFile $donor -TimeoutSec 300
          if ((Get-Item $donor).Length -ne 1535592811 -or (Get-FileHash $donor -Algorithm SHA256).Hash.ToLowerInvariant() -ne '81f199d6380faa09261a85efea6fd3abca6ed58749b8cc68c75d1cd579d454a4') { throw 'Exact public 0.13.13 donor differs' }
          python tools/fetch_runtime_asset_bundle.py --receipt assets/reference-inputs-receipt.json --release-asset-id 588984151 --output out/ui-beacon-donor/reference-assets.zip
          if ($LASTEXITCODE -ne 0) { throw 'Exact original import input download failed' }
      - name: Stage a contained host-only single-map native generator
        shell: pwsh
        run: |
          python tools/prepare_atlas_beacon_generator_source.py --output C:/bcn-src
          if ($LASTEXITCODE -ne 0) { throw 'Native generator staging failed' }
      - name: Compile Win32 generator without changing shipped MapServer
        working-directory: C:/bcn-src
        shell: pwsh
        run: |
          cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DCOH_PG_PERSISTENCE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native generator configure failed' }
          cmake --build out/build/vs2026 --config OptDebug --target MapServer --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Native generator compile failed' }
      - name: Generate actual Atlas graph then independently read back and exercise native paths
        shell: pwsh
        run: >-
          python tools/android/interactive/generate_atlas_beacons.py
          --donor-apk out/ui-beacon-donor/COH-Atlas-Gameplay-0.13.13.apk
          --donor-receipt out/ui-beacon-donor/evidence/reopen-startup-repair-apk-build-report.json
          --asset-archive out/ui-beacon-donor/reference-assets.zip
          --generator C:/bcn-src/out/build/vs2026/bin/OptDebug/MapServer.exe
          --build-input C:/bcn-src/atlas-beacon-generator-build-input.json
          --repository-commit "$env:GITHUB_SHA"
          --work C:/bcn-run
          --output out/ui-beacon-native
          --timeout-seconds 5400
      - uses: actions/upload-artifact@v4
        with:
          name: coh-ui-beacon-native
          path: out/ui-beacon-native/
          if-no-files-found: error
          retention-days: 90
      - name: Collect short-path host evidence on the repository drive
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'out/ui-beacon-native/evidence'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $files = @{
            'C:/bcn-src/atlas-beacon-generator-build-input.json' = 'atlas-beacon-generator-build-input.json'
            'C:/bcn-src/out/build/vs2026/CMakeCache.txt' = 'CMakeCache.txt'
            'C:/bcn-src/out/build/vs2026/CMakeFiles/CMakeConfigureLog.yaml' = 'CMakeConfigureLog.yaml'
            'C:/bcn-src/out/build/vs2026/bin/OptDebug/MapServer.exe' = 'host-only-beacon-generator.exe'
            'C:/bcn-src/out/build/vs2026/bin/OptDebug/MapServer.pdb' = 'host-only-beacon-generator.pdb'
          }
          # All runtime evidence is copied onto D: before upload-artifact.
          # Owned native internal errors/minidumps are finite and preserved even
          # when Python fails before it can write its role-failure receipt.
          $diagnostics = Join-Path $destination 'native-internal'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $total = 0L
          $count = 0
          foreach ($runtime in @('C:/bcn-run/r', 'C:/bcn-run/c')) {
            if (-not (Test-Path -LiteralPath $runtime)) { continue }
            $candidates = Get-ChildItem -LiteralPath $runtime -File -Recurse | Where-Object {
              $_.Name -like 'errorLogLastRun*' -or $_.Extension -in @('.dmp', '.mdmp') -or
              ($_.FullName -like '*\logs\*' -and $_.Extension -in @('.log', '.txt'))
            }
            foreach ($file in $candidates) {
              if ($count -ge 128 -or $file.Length -gt 134217728 -or $total + $file.Length -gt 268435456) { continue }
              $relative = [IO.Path]::GetRelativePath('C:/bcn-run', $file.FullName)
              $target = Join-Path $diagnostics $relative
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $target -Force
              $count++
              $total += $file.Length
            }
          }
          @{ copied_files = $count; copied_bytes = $total; max_files = 128; max_bytes = 268435456 } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $destination 'native-internal-copy.json')
          foreach ($source in $files.Keys) {
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $destination $files[$source]) -Force
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-ui-beacon-generation-evidence
          path: |
            out/ui-beacon-native/atlas-beacon-generation-report.json
            out/ui-beacon-native/evidence/
          if-no-files-found: warn
          retention-days: 90
