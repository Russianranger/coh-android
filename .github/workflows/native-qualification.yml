          need(receipt['apk']==dict(name=name,**expected) and audit['apk']==expected and receipt['signer_certificate_sha256']==SIGNER,'candidate APK/certificate identity differs')
          need(audit['passed'] is True and audit['internal_core_and_static_archive_exports_hidden'] is True and audit['world_authority'] is False,'original DSO audit differs')
