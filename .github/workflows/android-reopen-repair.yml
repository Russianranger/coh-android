name: Thor runtime refresh and character reopen repair

on:
  workflow_dispatch:
  push:
    branches: [codex/character-persistence-continuation]
    paths:
      - '.github/workflows/android-reopen-repair.yml'
      - 'tools/android/interactive/build_reopen_repair_apk.py'
      - 'tools/android/interactive/qualify_reopen_repair.py'
      - 'tools/android/interactive/test_reopen_repair_package.py'
      - 'docs/COH-Atlas-Gameplay-0.11.6-testing.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-reopen-repair-apk
  cancel-in-progress: false

env:
  # Reuse the exact Game/MapServer artifact already published in 0.11.5.
  # This repair does not compile either target or replace native build history.
  NATIVE_RUN: '37048610759'

jobs:
  observer:
    if: >-
      github.repository == 'Russianranger/coh-android' &&
      github.ref == 'refs/heads/codex/character-persistence-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      native_commit: ${{ steps.native-source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bind separately completed native run and its exact source commit
        id: native-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, urllib.request
          identifier = os.environ['NATIVE_RUN']
          if identifier != '37048610759':
              raise ValueError('A completed exact native responsiveness run is required')
          base = 'https://api.github.com/repos/Russianranger/coh-android/actions'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'coh-reopen-repair-build'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path, headers=headers), timeout=45) as response:
                  return json.load(response)
          run = get('/runs/'+identifier)
          if not (run['status'] == 'completed' and run['conclusion'] == 'success'
                  and run['path'] == '.github/workflows/android-responsiveness-native.yml'
                  and run['head_repository']['full_name'] == 'Russianranger/coh-android'
                  and run['head_branch'] == 'codex/character-persistence-continuation'
                  and run['head_sha'] == '0ddd27dfaddf9ac53a6a65548c8199bced767fbe'):
              raise ValueError('Native responsiveness build identity or completion differs')
          jobs = get('/runs/'+identifier+'/jobs')['jobs']
          if not any(job['name'] == 'native' and job['conclusion'] == 'success' for job in jobs):
              raise ValueError('Native build job did not complete')
          artifacts = [item for item in get('/runs/'+identifier+'/artifacts')['artifacts']
                       if item['name'] == 'coh-responsiveness-native' and not item['expired']]
          if len(artifacts) != 1 or not artifacts[0].get('digest', '').startswith('sha256:'):
              raise ValueError('Native executable artifact is missing or ambiguous')
          pathlib.Path('out').mkdir(exist_ok=True)
          pathlib.Path('out/native-run-provenance.json').write_text(json.dumps({'run': run, 'artifact': artifacts[0]}, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit='+run['head_sha']+'\n')
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: coh-startup-perf-packaging-evidence
          path: out/donor-evidence
          run-id: 37030944557
          github-token: ${{ github.token }}
      - name: Download and pin the public 0.11.4 APK
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py download-donor
          --output out/donor/COH-Atlas-Gameplay-0.11.4.apk
      - name: Download and pin public 0.11.5 to reproduce its immediate reopen failure
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py download-prior
          --output out/prior/COH-Atlas-Gameplay-0.11.5.apk
      - name: Qualify actual guest extraction, bounded Android refresh buffers and retained guards
        run: >-
          python3 tools/android/interactive/qualify_reopen_repair.py
          --repository-commit "$GITHUB_SHA"
          --donor-apk out/donor/COH-Atlas-Gameplay-0.11.4.apk
          --donor-build-report out/donor-evidence/startup-perf-apk-build-report.json
          --prior-apk out/prior/COH-Atlas-Gameplay-0.11.5.apk
          --output out/reopen-repair-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-reopen-repair-observer-evidence
          path: |
            out/reopen-repair-qualification.json
            out/native-run-provenance.json
          if-no-files-found: error

  apk:
    needs: observer
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: coh-startup-perf-packaging-evidence
          path: out/donor-evidence
          run-id: 37030944557
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-responsiveness-native
          path: out/native-responsiveness
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-reopen-repair-observer-evidence
          path: out/qualification
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: 36731428735
          github-token: ${{ github.token }}
      - name: Download the exact public donor APK
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py download-donor
          --output out/donor/COH-Atlas-Gameplay-0.11.4.apk
      - name: Download the exact failing 0.11.5 APK for native reuse and rejection proof
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py download-prior
          --output out/prior/COH-Atlas-Gameplay-0.11.5.apk
      - name: Build the unchanged source-bound Win32 launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686
          mkdir -p out/launcher
          i686-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -static-libgcc -mconsole \
            android/native/client-launcher.c -luser32 -lkernel32 -o out/launcher/client-launcher.exe
      - name: Ensure Android compilation and signing tools
        timeout-minutes: 4
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] ||
             [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] ||
             [ ! -f "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" ] ||
             [ ! -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ]; then
            timeout 180s sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile the refresh repair shell and package the retained native candidates
        env:
          COH_INTERACTIVE_KEYSTORE_PASSWORD: android
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py build
          --donor-apk out/donor/COH-Atlas-Gameplay-0.11.4.apk
          --donor-build-report out/donor-evidence/startup-perf-apk-build-report.json
          --prior-apk out/prior/COH-Atlas-Gameplay-0.11.5.apk
          --qualification out/qualification/reopen-repair-qualification.json
          --native-package out/native-responsiveness
          --native-commit "${{ needs.observer.outputs.native_commit }}"
          --launcher out/launcher/client-launcher.exe
          --repository-commit "$GITHUB_SHA"
          --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks"
          --output out/reopen-repair/COH-Atlas-Gameplay-0.11.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coh-reopen-repair-packaging-evidence
          path: |
            out/reopen-repair/reopen-repair-apk-build-report.json
            out/reopen-repair/COH-Atlas-Gameplay-0.11.6.apk.sha256
            out/reopen-repair/COH-Atlas-Gameplay-0.11.6-testing.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coh-reopen-repair-apk
          path: out/reopen-repair/
          if-no-files-found: error
      - name: Publish the retained-signer extraction repair after focused qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/android/interactive/build_reopen_repair_apk.py publish
          --apk out/reopen-repair/COH-Atlas-Gameplay-0.11.6.apk
          --build-report out/reopen-repair/reopen-repair-apk-build-report.json
          --donor-apk out/donor/COH-Atlas-Gameplay-0.11.4.apk
          --donor-build-report out/donor-evidence/startup-perf-apk-build-report.json
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --prior-apk out/prior/COH-Atlas-Gameplay-0.11.5.apk
          --qualification out/qualification/reopen-repair-qualification.json
      - name: Remove retained signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
