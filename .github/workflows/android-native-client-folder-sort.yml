name: Nonshipping bounded Game directory constructor candidate
on:
  push:
    branches: [codex/native-client-folder-sort-037]
    paths:
      - .github/workflows/android-native-client-folder-sort.yml
      - tools/prepare_native_client_folder_sort_source.py
      - tools/test_native_client_folder_sort_source.py
      - tools/package_native_client_folder_sort.py
      - tools/test_package_native_client_folder_sort.py
      - database/client-folder-sort/**
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: native-client-folder-sort-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-game:
    runs-on: windows-2025-vs2026
    timeout-minutes: 100
    steps:
      - name: Preserve exact repository source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Authenticate completed .36 public artifact as the unchanged Game and DLL donor
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $script = @'
          import hashlib,json,os,pathlib,time,urllib.error,urllib.request
          target=pathlib.Path('out/donor-036.apk')
          expected={'bytes':42076692,'sha256':'14d88da1796d155dc1b98e45ac642c7702ff3286e7ef0f2a0772f8e48693b12f'}
          base='https://api.github.com/repos/Russianranger/coh-android'
          def get(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==2:raise
                      time.sleep(5)
          run=get(base+'/actions/runs/38346809297');jobs=get(base+'/actions/runs/38346809297/jobs')
          assert run['head_sha']=='3570430cefdb15d9b239563e85cccf4d8fe6f32e' and run['conclusion']=='success'
          audits=[j for j in jobs['jobs'] if j['id']==115141593507]
          assert len(audits)==1 and audits[0]['name']=='public-audit' and audits[0]['conclusion']=='success'
          pathlib.Path('out/donor-public-run.json').write_text(json.dumps(run,indent=2)+'\n')
          pathlib.Path('out/donor-public-jobs.json').write_text(json.dumps(jobs,indent=2)+'\n')
          url='https://github.com/Russianranger/coh-android/releases/download/coh-atlas-gameplay-v0.13.36/COH-Atlas-Gameplay-0.13.36.apk'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url,timeout=60) as response,target.open('xb') as stream:
                      total=0;digest=hashlib.sha256()
                      while block:=response.read(1024**2):
                          total+=len(block);assert total<=expected['bytes'];digest.update(block);stream.write(block)
                  assert total==expected['bytes'] and digest.hexdigest()==expected['sha256']
                  break
              except urllib.error.HTTPError as error:
                  target.unlink(missing_ok=True)
                  if error.code not in (429,500,502,503,504) or attempt==2:raise
                  time.sleep(5)
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { throw 'Audited exact native donor authentication failed' }
      - name: Stage retained Game once with the isolated empty-directory constructor overlay
        shell: pwsh
        run: |
          python tools/package_native_client_folder_sort.py stage --output C:/coh-client-folder-sort
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained Game source and constructor staging failed' }
      - name: Execute actual Win32 stock and candidate constructor parity fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Win32 MSVC installation unavailable' }
          New-Item -ItemType Directory -Path out/contracts -Force | Out-Null
          $batch = @"
          @echo off
          call "$installation\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          python tools/test_native_client_folder_sort_source.py --windows-qualify --output out/contracts/native-client-folder-sort-checks.json
          if errorlevel 1 exit /b 1
          python tools/test_package_native_client_folder_sort.py --donor-apk out/donor-036.apk -v
          if errorlevel 1 exit /b 1
          "@
          Set-Content -Path out/contracts/native-folder-sort.cmd -Value $batch -Encoding ASCII
          cmd /c .\out\contracts\native-folder-sort.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Actual Win32 native constructor parity fixture failed' }
      - name: Compile one new full Game candidate without rebuilding any retained native donor
        working-directory: C:/coh-client-folder-sort
        shell: pwsh
        run: |
          cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DCOH_PG_PERSISTENCE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native Game candidate configuration failed' }
          cmake --build out/build/vs2026 --config OptDebug --parallel --target Game
          if ($LASTEXITCODE -ne 0) { throw 'Native Game candidate compilation failed' }
      - name: Authenticate source, native Win32 evidence and exact retained DLL import closure
        shell: pwsh
        run: |
          python tools/package_native_client_folder_sort.py package --source C:/coh-client-folder-sort --directory C:/coh-client-folder-sort/out/build/vs2026/bin/OptDebug --cache C:/coh-client-folder-sort/out/build/vs2026/CMakeCache.txt --checks out/contracts/native-client-folder-sort-checks.json --donor-apk out/donor-036.apk --repository-commit "$env:GITHUB_SHA" --run-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --output out/native-client-folder-sort
          if ($LASTEXITCODE -ne 0) { throw 'Exact bounded Game native candidate package failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: coh-nonshipping-native-client-folder-sort
          path: out/native-client-folder-sort/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-nonshipping-native-client-folder-sort-diagnostics
          path: |
            out/contracts/
            out/donor-public-run.json
            out/donor-public-jobs.json
          retention-days: 90
          if-no-files-found: warn
