name: ArmPort zone beacon graph

# Genuine native beacon graphs for the static zones of the shared zone tree
# (every static zone except Atlas Park and King's Row). Mercy Island (map 71)
# first: Thor 0.13.63 "Beacon file not loaded for map:
# maps/City_Zones/V_City_01_01/V_City_01_01.txt"; its pets and NPCs could not walk
# to a target. Every zone next (owner, 2026-11-09): one run, up to 8 map jobs at
# once, nothing else running alongside. The host-only generator is King's Row's
# with the map taken from COH_ZONE_BEACON_MAP and the owned worker count from
# COH_ZONE_BEACON_WORKERS, so one compile (job `generator`) serves every map job
# (generator_run_id reuses an earlier one). The world is King's Row's generator
# world with the shared zone tree's collision leaves (zone_index.COLLISION_FILES).
# Nothing here signs or publishes; each map's graph is this run's artifact.
on:
  # Dispatch only. A workflow that exists only off the default branch is
  # dispatchable after its first run ("workflow armport-zone-beacons.yml not found
  # on the default branch", 2026-11-09); a narrow push trigger on x86/perf-round3
  # made that run (42675871153, e12956ebb) and is gone. Dispatch on
  # x86/perf-round1: the Lua archive cache below belongs to that branch.
  workflow_dispatch:
    inputs:
      map_ids:
        description: Map ids with a graph slot in android/guest/zone_beacon_package.py, comma separated, or all
        required: true
        default: '71'
      workers:
        description: Owned native worker clients per map (1-8; one Mercy Island worker took 2 h 20 min)
        required: true
        default: '3'
      resource_run_id:
        description: Run holding coh-assets-resource-inputs (donor APK, reference archive, zone archive)
        required: true
        default: '38112251836'
      generator_run_id:
        description: Optional earlier run of this workflow whose compiled zone generator to reuse
        required: false
        default: ''
      generator_commit:
        description: That run's head commit (required with generator_run_id)
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: armport-zone-beacons
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      maps: ${{ steps.maps.outputs.maps }}
      workers: ${{ steps.maps.outputs.workers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Choose the maps (every one must have a graph slot) and the owned worker count
        id: maps
        working-directory: tools/android/interactive
        env:
          MAP_IDS: ${{ inputs.map_ids }}
          WORKERS: ${{ inputs.workers }}
        run: |
          python3 - <<'PYCONTROL' >> "$GITHUB_OUTPUT"
          import json, os, re
          import generate_zone_beacons as g
          slots = sorted(g.manifest_validator().WORLDS)
          text = os.environ['MAP_IDS'].strip()
          if text == 'all':
              maps = slots
          else:
              assert re.fullmatch(r'[0-9]+( *, *[0-9]+)*', text), 'map_ids: comma-separated numbers or all'
              maps = [int(value) for value in text.split(',')]
              assert len(set(maps)) == len(maps), 'Duplicate map id'
          for map_id in maps:
              g.zone(map_id)
          workers = os.environ['WORKERS'].strip()
          assert re.fullmatch('[1-8]', workers), 'workers: 1-8'
          g.worker_roles(int(workers))
          print('maps=' + json.dumps(maps, separators=(',', ':')))
          print('workers=' + workers)
          PYCONTROL
          cat "$GITHUB_OUTPUT"

  generator:
    runs-on: windows-2025-vs2026
    # The two-process compile took about 6-7 minutes (runs 39365299854, 42678203754).
    timeout-minutes: 90
    env:
      RESOURCE_RUN_ID: ${{ inputs.resource_run_id || '38112251836' }}
      GENERATOR_RUN_ID: ${{ inputs.generator_run_id || '' }}
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove the portable package validation before the compile
        shell: pwsh
        working-directory: tools/android/interactive
        run: |
          python test_zone_beacons.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows zone package validation fixtures failed' }
          python ../../test_pinned_lua_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Lua source fixtures failed' }
      - name: Recover the exact completed zone generator compile
        if: env.GENERATOR_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: coh-zone-host-generator
          path: C:/zone-bcn-src
          run-id: ${{ env.GENERATOR_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify the retained generator's source receipt before execution
        if: env.GENERATOR_RUN_ID != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.generator_commit }}' -notmatch '^[0-9a-f]{40}$') { throw 'generator_commit is required with generator_run_id' }
          $run = gh api "repos/${{ github.repository }}/actions/runs/$env:GENERATOR_RUN_ID" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/armport-zone-beacons.yml' -or $run.head_sha -ne '${{ inputs.generator_commit }}') { throw 'The generator run is not this workflow at generator_commit' }
          python -c "import json,sys; sys.path.insert(0,'tools'); import prepare_zone_beacon_generator_source as p; v=json.load(open('C:/zone-bcn-src/'+p.RECEIPT)); assert v==p.expected(), 'Zone generator receipt differs'; print('receipt matches')"
          if ($LASTEXITCODE -ne 0) { throw 'Retained zone generator receipt differs' }
      - name: Stage the separate nonshippable zone producer
        if: env.GENERATOR_RUN_ID == ''
        shell: pwsh
        run: |
          python tools/prepare_zone_beacon_generator_source.py --output C:/zone-bcn-src
          if ($LASTEXITCODE -ne 0) { throw 'Zone host generator staging failed' }
      # Run 42675871153: www.lua.org timed out every connection while CMake fetched Lua
      # 5.1.5 at configure ("Each download failed!"), as in armport-build 42488979665.
      # Same cache as armport-build's server-metrics job (caches are per branch).
      - uses: actions/cache@v4
        if: env.GENERATOR_RUN_ID == ''
        with:
          path: out/lua-cache
          key: armport-lua-5.1.5-2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
      - name: Provide the pinned Lua 5.1.5 source (job cache, else verified downloads)
        if: env.GENERATOR_RUN_ID == ''
        shell: pwsh
        run: |
          python tools/pinned_lua_source.py --prepared C:/zone-bcn-src --cache out/lua-cache --output C:/zone-lua/lua51 --record out/zone-lua/lua-source.json
          if ($LASTEXITCODE -ne 0) { throw 'No verified Lua 5.1.5 archive' }
      - name: Compile the host-only generator (two compiler processes)
        if: env.GENERATOR_RUN_ID == ''
        working-directory: C:/zone-bcn-src
        shell: pwsh
        # At most two projects at once (msbuild /m:2), each cl.exe single-process (/MP1).
        env:
          _CL_: '/MP1'
        run: |
          # CPM's own override: a fresh extraction, still patched by the source's lua-cmake.patch.
          cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DCOH_PG_PERSISTENCE_TESTS=OFF -DCPM_lua51_SOURCE=C:/zone-lua/lua51
          if ($LASTEXITCODE -ne 0) { throw 'Zone host generator configure failed' }
          cmake --build out/build/vs2026 --config OptDebug --parallel 2 --target MapServer
          if ($LASTEXITCODE -ne 0) { throw 'Zone host generator compile failed' }
      - name: Keep the compiled generator for this run's map jobs and later runs
        uses: actions/upload-artifact@v4
        with:
          name: coh-zone-host-generator
          path: |
            C:/zone-bcn-src/zone-beacon-generator-build-input.json
            C:/zone-bcn-src/out/build/vs2026/bin/OptDebug/MapServer.exe
            C:/zone-bcn-src/out/build/vs2026/bin/OptDebug/MapServer.pdb
          if-no-files-found: error
          retention-days: 90
      - name: Preserve compile diagnostics even on failure
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/zone-generator -Force | Out-Null
          foreach ($name in @('zone-beacon-generator-build-input.json', 'out/build/vs2026/CMakeCache.txt', 'out/build/vs2026/CMakeFiles/CMakeConfigureLog.yaml')) {
            $source = Join-Path C:/zone-bcn-src $name
            if (Test-Path $source) { Copy-Item $source out/zone-generator/ }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-zone-generator-evidence
          path: |
            out/zone-lua/
            out/zone-generator/
          if-no-files-found: warn
          retention-days: 90

  beacons:
    needs: [plan, generator]
    runs-on: windows-2025-vs2026
    name: beacons (${{ matrix.map }})
    # Generation is bounded at 14400 s and each of the two proofs at 900 s. Hosted jobs stop at 360.
    timeout-minutes: 355
    strategy:
      # Owner, 2026-11-09: one run, up to 8 map jobs at once; a failed map does not stop the others.
      fail-fast: false
      max-parallel: 8
      matrix:
        map: ${{ fromJSON(needs.plan.outputs.maps) }}
    env:
      MAP_ID: ${{ matrix.map }}
      WORKERS: ${{ needs.plan.outputs.workers }}
      RESOURCE_RUN_ID: ${{ inputs.resource_run_id || '38112251836' }}
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Name the map before native generation
        shell: pwsh
        working-directory: tools/android/interactive
        run: |
          python -c "import generate_zone_beacons as g; print(g.zone(int('$env:MAP_ID')))"
          if ($LASTEXITCODE -ne 0) { throw 'No zone graph is defined for this map' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: coh-assets-resource-inputs
          path: out/resources
          run-id: ${{ env.RESOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Take this run's compiled generator
        uses: actions/download-artifact@v4
        with:
          name: coh-zone-host-generator
          path: C:/zone-bcn-src
      - name: Verify the generator's source receipt before execution
        shell: pwsh
        run: |
          python -c "import json,sys; sys.path.insert(0,'tools'); import prepare_zone_beacon_generator_source as p; v=json.load(open('C:/zone-bcn-src/'+p.RECEIPT)); assert v==p.expected(), 'Zone generator receipt differs'; print('receipt matches')"
          if ($LASTEXITCODE -ne 0) { throw 'Zone generator receipt differs' }
      - name: Generate the collision-complete graph and run two fresh native CRC/readback/32-route proofs
        shell: pwsh
        run: >-
          python tools/android/interactive/generate_zone_beacons.py --map-id $env:MAP_ID --workers $env:WORKERS
          --donor-apk out/resources/donor.apk --asset-archive out/resources/reference.zip
          --zones-archive out/resources/zones-world-supplement.zip
          --zones-manifest out/resources/zones-world-supplement-manifest.json
          --generator C:/zone-bcn-src/out/build/vs2026/bin/OptDebug/MapServer.exe
          --build-input C:/zone-bcn-src/zone-beacon-generator-build-input.json
          --repository-commit "${{ github.sha }}" --work C:/zone-bcn-run
          --output out/zone-beacons --timeout-seconds 14400
      - uses: actions/upload-artifact@v4
        with:
          name: coh-zone-beacons-${{ env.MAP_ID }}
          path: |
            out/zone-beacons/zone-beacons-${{ env.MAP_ID }}.zip
            out/zone-beacons/zone-beacons-${{ env.MAP_ID }}-manifest.json
            out/zone-beacons/zone-beacons-${{ env.MAP_ID }}-lock.json
            out/zone-beacons/zone-beacons-${{ env.MAP_ID }}-generation-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Summarize the graph
        shell: pwsh
        run: |
          $report = Get-Content -Raw "out/zone-beacons/zone-beacons-$env:MAP_ID-generation-report.json" | ConvertFrom-Json
          $summary = [ordered]@{ map_id = $report.map_id; map = $report.map; native = $report.native; archive = $report.archive;
                                 manifest = $report.manifest; owned_workers = $report.owned_workers; worker_work = $report.worker_work;
                                 generation_seconds = $report.generation_seconds; elapsed_seconds = $report.elapsed_seconds }
          $line = ($summary | ConvertTo-Json -Compress -Depth 6)
          Write-Output "::notice title=ArmPort zone beacon graph $env:MAP_ID::$line"
      - name: Preserve owned native diagnostics even on failure
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/zone-beacons/native-build -Force | Out-Null
          foreach ($tree in @('C:/zone-bcn-run/r', 'C:/zone-bcn-run/c')) {
            if (Test-Path $tree) {
              $tag = Split-Path $tree -Leaf
              Get-ChildItem -LiteralPath $tree -Filter 'errorLogLastRun*' -File | ForEach-Object {
                if ($_.Length -lt 134217728) { Copy-Item $_.FullName "out/zone-beacons/native-build/$tag-$($_.Name)" }
              }
            }
          }
          if (Test-Path out/zone-beacons/evidence) {
            Get-ChildItem out/zone-beacons/evidence -File | ForEach-Object {
              $tail = Get-Content -LiteralPath $_.FullName -Tail 40 -ErrorAction SilentlyContinue
              Write-Output "=== $($_.Name) (last 40 lines)"; $tail | ForEach-Object { Write-Output $_ }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-zone-beacon-evidence-${{ env.MAP_ID }}
          path: |
            out/zone-beacons/evidence/
            out/zone-beacons/native-build/
          if-no-files-found: warn
          retention-days: 90
