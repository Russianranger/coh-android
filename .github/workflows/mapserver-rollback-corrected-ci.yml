name: Corrected MapServer rollback APK packaging
# Corrected-cohort kickoff: native41378036783 at source1f75894db911.
# Corrected-cohort setup: wait for the new candidate coordinator to
# finish, then build one server_metrics=false APK through its existing signer.
on:
  push:
    branches: ['armport/mapserver-modern-runtime-qualification']
    paths: ['.github/workflows/mapserver-rollback-corrected-ci.yml']

permissions:
  contents: read
concurrency:
  group: mapserver-rollback-apk-1f75894db911
  cancel-in-progress: false

jobs:
  rollback-package:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/armport/mapserver-modern-runtime-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: armport/modern-runtime
      - name: Check rollback ordering and duplicate-refusal controls
        run: python3 armport/modern-runtime/test_rollback_ci.py -v
      - name: Wait for primary chain then build the exact server rollback APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u armport/modern-runtime/rollback_ci.py
