name: Native Atlas and Kings world parity for retained Map metadata candidate
on:
  push:
    branches: [codex/native-map-world-037]
    paths:
      - .github/workflows/android-native-map-world-037.yml
      - tools/android/interactive/prepare_native_map_world_inputs_037.py
      - tools/android/interactive/qualify_native_map_world_037.py
      - tools/android/interactive/test_native_map_world_037.py
      - tools/android/interactive/native_map_world_pool_037.py
      - tools/android/interactive/test_native_map_world_pool_037.py
      - tools/android/interactive/aggregate_native_map_world_pools_037.py
      - tools/android/interactive/test_aggregate_native_map_world_pools_037.py
      - tools/android/interactive/recover_native_map_world_partial_037.py
      - tools/android/interactive/test_recover_native_map_world_partial_037.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: native-map-world-037-${{ github.ref }}
  # Preserve earlier actual qualification evidence until its bounded operation finishes.
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Recover exact original partial bytes for authentic host refusal tests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/partial-host-tests
          gh api repos/Russianranger/coh-android/actions/artifacts/11873697327/zip > out/partial-host-tests/executed-partial.zip
      - name: Validate native world evidence boundaries and hostile provider cases
        env: {COH_WORLD_PARTIAL_TEST_ARCHIVE: out/partial-host-tests/executed-partial.zip}
        run: |
          python3 -m unittest discover -s tools/android/interactive -p test_native_map_world_037.py
          python3 -m unittest discover -s tools/android/interactive -p test_native_map_world_pool_037.py
          python3 -m unittest discover -s tools/android/interactive -p test_aggregate_native_map_world_pools_037.py
          python3 -m unittest discover -s tools/android/interactive -p test_recover_native_map_world_partial_037.py
      - name: Authenticate exact successful original prepared provider artifact and unchanged producer
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/prepared-attribution
          gh api repos/Russianranger/coh-android/actions/runs/38477608206 > out/prepared-attribution/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38477608206/jobs > out/prepared-attribution/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11856696807 > out/prepared-attribution/artifact.json
          gh api 'repos/Russianranger/coh-android/contents/tools/android/interactive/prepare_native_map_world_inputs_037.py?ref=0ed6bd74bb61478c1028c29fdffa252f18707dd9' > out/prepared-attribution/producer-source.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil
          root=pathlib.Path('out/prepared-attribution')
          run=json.loads((root/'run.json').read_text());jobs=json.loads((root/'jobs.json').read_text())['jobs']
          artifact=json.loads((root/'artifact.json').read_text());source=json.loads((root/'producer-source.json').read_text())
          assert run['id']==38477608206 and run['head_sha']=='0ed6bd74bb61478c1028c29fdffa252f18707dd9'
          assert run['head_branch']=='codex/native-map-world-037' and run['path']=='.github/workflows/android-native-map-world-037.yml'
          prepare=[j for j in jobs if j['id']==115572069249 and j['name']=='prepare']
          assert len(prepare)==1 and prepare[0]['status']=='completed' and prepare[0]['conclusion']=='success'
          assert artifact['id']==11856696807 and artifact['name']=='coh-native-world-037-prepared-public-providers'
          assert artifact['size_in_bytes']==2070662208 and artifact['digest']=='sha256:d61ba32c646bd3f8815a92759abba737e997a3b9de489d26126bf3015f1e6d2c'
          assert artifact['expired'] is False and artifact['workflow_run']['id']==38477608206
          assert artifact['workflow_run']['head_sha']==run['head_sha']
          assert source['encoding']=='base64' and source['path']=='tools/android/interactive/prepare_native_map_world_inputs_037.py'
          raw=base64.b64decode(source['content']);local=pathlib.Path(source['path']).read_bytes()
          assert len(raw)==13080 and hashlib.sha256(raw).hexdigest()=='0e9a7eb952464bb3aa8fc31320da3eb55cc401842044929b95f068959ff42c77'
          assert local==raw
          assert shutil.disk_usage('.').free >= 6*1024**3
          (root/'admission.json').write_text(json.dumps({'source':run['head_sha'],'run_id':run['id'],
              'original_overall_run_conclusion':run['conclusion'],'successful_prepare_job_id':prepare[0]['id'],
              'artifact_id':artifact['id'],'artifact_zip_bytes':artifact['size_in_bytes'],'artifact_zip_digest':artifact['digest'],
              'prepare_source_bytes_unchanged':True,'actual_preparation_reexecuted':False,
              'original_native_qualification_claimed_passed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-native-world-037-original-preparation-attribution
          path: |
            out/prepared-attribution/
            out/partial-attribution/*.json
          retention-days: 90
          if-no-files-found: warn
  native-worlds:
    name: native-map-${{ matrix.map_id }}-${{ matrix.fx }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        map_id: [5]
        fx: [server_only, full]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Preserve committed source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: coh-native-world-037-original-preparation-attribution, path: out/prepared-attribution}
      - name: Qualify actual controlled Windows custody before large provider work
        run: python -Werror::ResourceWarning -m unittest discover -s tools/android/interactive -p test_native_map_world_pool_037.py
      - name: Authenticate and recover cancelled nine-case frontier without native replay
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/partial-attribution
          gh api repos/Russianranger/coh-android/actions/runs/38505018109 > out/partial-attribution/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38505018109/jobs > out/partial-attribution/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11873697327 > out/partial-attribution/artifact.json
          python - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'tools/android/interactive')
          import recover_native_map_world_partial_037 as partial
          root=pathlib.Path('out/partial-attribution');run=json.loads((root/'run.json').read_text());jobs=json.loads((root/'jobs.json').read_text())['jobs'];artifact=json.loads((root/'artifact.json').read_text())
          assert run['id']==partial.RUN and run['head_sha']==partial.SOURCE and run['conclusion']=='cancelled'
          assert run['head_branch']=='codex/native-map-world-037' and run['path']=='.github/workflows/android-native-map-world-037.yml'
          selected=[j for j in jobs if j['id']==partial.JOB and j['name']=='native-worlds']
          assert len(selected)==1 and selected[0]['conclusion']=='cancelled' and selected[0]['status']=='completed'
          assert artifact['id']==partial.ARTIFACT and artifact['name']=='coh-native-world-037-executed-evidence'
          assert artifact['size_in_bytes']==partial.ZIP_PIN['bytes'] and artifact['digest']=='sha256:'+partial.ZIP_PIN['sha256']
          assert artifact['expired'] is False and artifact['workflow_run']['id']==partial.RUN and artifact['workflow_run']['head_sha']==partial.SOURCE
          PY
          gh api repos/Russianranger/coh-android/actions/artifacts/11873697327/zip > out/partial-attribution/executed-partial.zip
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools/android/interactive')
          import recover_native_map_world_partial_037 as partial
          recovered,_=partial.recover('out/partial-attribution/executed-partial.zip')
          assert len(recovered['recovered_individual_cases'])==9 and recovered['remaining_fresh_native_cases']==7
          PY
      - name: Recover original authenticated prepared bytes without Linux reassembly
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/Russianranger/coh-android/actions/artifacts/11856696807/zip > out/original-provider.zip
          python - <<'PY'
          import hashlib,pathlib,stat,sys,zipfile,shutil
          sys.path.insert(0,'tools/android/interactive')
          import qualify_native_map_world_037 as gate
          path=pathlib.Path('out/original-provider.zip')
          assert gate.pin(path)=={'bytes':2070662208,'sha256':'d61ba32c646bd3f8815a92759abba737e997a3b9de489d26126bf3015f1e6d2c'}
          output=pathlib.Path('out/prepared-worlds');output.mkdir()
          names={'provider-db.tar.gz','provider-1.tar.gz','provider-5.tar.gz','full-fxinfo.bin','COH-Atlas-Gameplay-0.13.36.apk',gate.inputs.MANIFEST}
          with zipfile.ZipFile(path) as archive:
              assert set(archive.namelist())==names and len(archive.namelist())==len(names)
              for member in archive.infolist():
                  assert not member.is_dir() and not member.flag_bits&1
                  assert stat.S_IFMT(member.external_attr>>16) in (0,stat.S_IFREG)
                  assert 0<member.file_size<=4*1024**3
                  with archive.open(member) as source,(output/member.filename).open('xb') as target:shutil.copyfileobj(source,target,1024**2)
          manifest=gate.read_manifest(output/gate.inputs.MANIFEST)
          assert gate.pin(output/'COH-Atlas-Gameplay-0.13.36.apk')==gate.inputs.APK
          assert gate.pin(output/'full-fxinfo.bin')==gate.inputs.FX_VARIANTS['full']
          for key,provider in manifest['providers'].items():assert gate.pin(output/('provider-'+key+'.tar.gz'))==provider['archive']
          assert gate.pin(output/gate.inputs.MANIFEST)=={'bytes':87193832,'sha256':'e234440c5d1eca22c993d828993b194d5949d741a7afdfeadf561052d256ae65'}
          path.unlink()
          PY
      - name: Authenticate and recover the exact already executed stock Atlas generation
        if: matrix.map_id == 1 && matrix.fx == 'server_only'
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/inherited-stock-attribution
          gh api repos/Russianranger/coh-android/actions/runs/38494199595 > out/inherited-stock-attribution/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38494199595/jobs > out/inherited-stock-attribution/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11864550716 > out/inherited-stock-attribution/artifact.json
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('out/inherited-stock-attribution')
          run=json.loads((root/'run.json').read_text());jobs=json.loads((root/'jobs.json').read_text())['jobs']
          artifact=json.loads((root/'artifact.json').read_text())
          assert run['id']==38494199595 and run['head_sha']=='04b7a623ef21d7ad48774a58b3122c69ae07f46b'
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_branch']=='codex/native-map-world-037' and run['path']=='.github/workflows/android-native-map-world-037.yml'
          selected=[j for j in jobs if j['id']==115627188579 and j['name']=='native-worlds']
          assert len(selected)==1 and selected[0]['status']=='completed' and selected[0]['conclusion']=='failure'
          assert artifact['id']==11864550716 and artifact['name']=='coh-native-world-037-executed-evidence'
          assert artifact['size_in_bytes']==3039985 and artifact['digest']=='sha256:962d7517ca5d91dd00b797f5b428bdf5fce1975c6c4afc392f7dc9e0a24b06fc'
          assert artifact['expired'] is False and artifact['workflow_run']['id']==38494199595
          assert artifact['workflow_run']['head_sha']==run['head_sha']
          PY
          gh api repos/Russianranger/coh-android/actions/artifacts/11864550716/zip > out/inherited-stock-attribution/executed-stock.zip
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools/android/interactive')
          import qualify_native_map_world_037 as gate
          assert gate.pin('out/inherited-stock-attribution/executed-stock.zip')==gate.INHERITED_STOCK['artifact']
          PY
      - name: Reuse exact successful native builds without recompilation
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/retained-history out/candidate-history
          gh api repos/Russianranger/coh-android/actions/runs/38345782437 > out/retained-history/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38345782437/jobs > out/retained-history/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713 > out/retained-history/artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713/zip > out/retained-history/artifact.zip
          python tools/reuse_native_startup_profile.py --archive out/retained-history/artifact.zip --output out/native-baseline --run-metadata out/retained-history/run.json --jobs-metadata out/retained-history/jobs.json --artifact-metadata out/retained-history/artifact.json > out/retained-history/reuse-admission.json
          gh api repos/Russianranger/coh-android/actions/runs/38350813669 > out/candidate-history/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38350813669/jobs > out/candidate-history/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11790609618 > out/candidate-history/artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11790609618/zip > out/candidate-history/artifact.zip
          python tools/reuse_native_map_prefetch.py --archive out/candidate-history/artifact.zip --output out/native-candidate --baseline out/native-baseline --run-metadata out/candidate-history/run.json --jobs-metadata out/candidate-history/jobs.json --artifact-metadata out/candidate-history/artifact.json > out/candidate-history/reuse-admission.json
      - name: Validate portable parsers before genuine native execution
        run: |
          python -m unittest discover -s tools/android/interactive -p test_native_map_world_037.py
          python -m unittest discover -s tools/android/interactive -p test_native_map_world_pool_037.py
      - name: Install the public APK exact x86 PostgreSQL ODBC driver
        shell: pwsh
        run: |
          python -c "import hashlib,pathlib,zipfile; p=pathlib.Path('out/psqlodbc_x86.msi'); raw=zipfile.ZipFile('out/prepared-worlds/COH-Atlas-Gameplay-0.13.36.apk').read('assets/runtime/psqlodbc_x86.msi'); assert hashlib.sha256(raw).hexdigest()=='1b1c85f694ecad95fd3a0125a8b071669772bef098366738de48812124896773'; p.write_bytes(raw)"
          $installer = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', (Resolve-Path 'out/psqlodbc_x86.msi').Path, '/qn', '/norestart') -PassThru -Wait
          if ($installer.ExitCode -notin @(0,3010)) { throw "Pinned x86 ODBC installer failed: $($installer.ExitCode)" }
          $driver = Get-OdbcDriver -Platform '32-bit' | Where-Object { $_.Name -eq 'PostgreSQL Unicode' }
          if (-not $driver) { throw 'Required x86 PostgreSQL Unicode driver missing' }
      - name: Bind actual current pool run and job identity
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', POOL_NAME: 'native-map-${{ matrix.map_id }}-${{ matrix.fx }}'}
        run: |
          gh api "repos/Russianranger/coh-android/actions/runs/$GITHUB_RUN_ID" > out/current-run.json
          gh api "repos/Russianranger/coh-android/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > out/current-jobs.json
          python - <<'PY'
          import json,os,pathlib
          run=json.loads(pathlib.Path('out/current-run.json').read_text());jobs=json.loads(pathlib.Path('out/current-jobs.json').read_text())['jobs']
          assert run['id']==int(os.environ['GITHUB_RUN_ID']) and run['head_sha']==os.environ['GITHUB_SHA']
          assert run['head_branch']=='codex/native-map-world-037' and run['path']=='.github/workflows/android-native-map-world-037.yml'
          selected=[j for j in jobs if j['name']==os.environ['POOL_NAME'] and j['status']=='in_progress']
          assert len(selected)==1
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('NATIVE_POOL_JOB_ID='+str(selected[0]['id'])+'\n')
          PY
      - name: Qualify one private provider pool with fresh genuine native processes and finite evidence deadline
        shell: pwsh
        run: |
          if (-not $env:PGBIN -or -not (Test-Path "$env:PGBIN/pg_ctl.exe")) { throw 'Hosted runner PostgreSQL bin unavailable' }
          $inherited = @()
          $poolTag = if ('${{ matrix.fx }}' -eq 'server_only') { 's' } else { 'f' }
          if ('${{ matrix.map_id }}' -eq '1' -and '${{ matrix.fx }}' -eq 'server_only') { $inherited = @('--inherited-stock-evidence','out/inherited-stock-attribution/executed-stock.zip') }
          python tools/android/interactive/qualify_native_map_world_037.py --inputs out/prepared-worlds --baseline out/native-baseline --candidate out/native-candidate --repository-commit "$env:GITHUB_SHA" --bin "$env:PGBIN" --driver 'PostgreSQL Unicode' --work "C:/nw$env:GITHUB_RUN_ID-${{ matrix.map_id }}$poolTag" --output out/native-world-evidence --pool-map-id '${{ matrix.map_id }}' --pool-fx-variant '${{ matrix.fx }}' --operation-budget-seconds 7200 --run-id "$env:GITHUB_RUN_ID" --job-id "$env:NATIVE_POOL_JOB_ID" --partial-world-evidence out/partial-attribution/executed-partial.zip @inherited
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-native-world-037-pool-evidence-${{ matrix.map_id }}-${{ matrix.fx }}
          path: out/native-world-evidence/
          retention-days: 90
          if-no-files-found: warn
      - name: Remove downloaded ZIP duplicates from native build attribution
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath 'out/retained-history/artifact.zip','out/candidate-history/artifact.zip' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-native-world-037-pool-attribution-${{ matrix.map_id }}-${{ matrix.fx }}
          path: |
            out/retained-history/
            out/candidate-history/
            out/inherited-stock-attribution/
            out/prepared-attribution/
            out/partial-attribution/*.json
            out/current-run.json
            out/current-jobs.json
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    if: always()
    needs: [prepare, native-worlds]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: coh-native-world-037-pool-evidence-*
          path: out/pools
      - name: Recover actual final pool job authority
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/Russianranger/coh-android/actions/runs/$GITHUB_RUN_ID" > out/final-run.json
          gh api "repos/Russianranger/coh-android/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > out/final-jobs.json
          gh api "repos/Russianranger/coh-android/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > out/final-artifacts.json
      - name: Recover exact original partial native evidence for lineage join
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api repos/Russianranger/coh-android/actions/artifacts/11873697327/zip > out/executed-partial.zip
      - name: Join nine inherited and seven fresh native cases without relabelling original execution
        run: python3 tools/android/interactive/aggregate_native_map_world_pools_037.py --pools out/pools --output out/native-world-evidence --run out/final-run.json --jobs out/final-jobs.json --artifacts out/final-artifacts.json --repository-commit "$GITHUB_SHA" --partial-world-evidence out/executed-partial.zip
      - name: Retain exact small final API authorities alongside native evidence
        if: always()
        run: |
          mkdir -p out/native-world-evidence
          cp -- out/final-run.json out/final-jobs.json out/final-artifacts.json out/native-world-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-native-world-037-executed-evidence
          path: out/native-world-evidence/
          retention-days: 90
          if-no-files-found: warn
