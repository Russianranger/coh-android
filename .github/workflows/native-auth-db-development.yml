        $env:GITHUB_SHA --output "$env:RUNNER_TEMP/auth-db-development-public" --auth-success-archive native-android/engine/auth-interop/evidence/auth-success-38996587760/artifact.zip
        --auth-candidate-stage "$env:RUNNER_TEMP/auth-candidate" --db-candidate-stage "$env:RUNNER_TEMP/db-candidate" --retained-intact-stage
