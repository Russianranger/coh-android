        \ and 0<=pin['bytes']<=64*1024**2\n        assert re.fullmatch('[a-f0-9]{64}',pin['sha256'])\n        selected[prefix+relative]=pin\n\
        \    assert sum(x['bytes'] for x in value['files'].values())==105629748\n    members={i.filename:i for i in infos}\n\
        \    for name,pin in selected.items():\n        item=members[name];assert not item.is_dir() and item.file_size==pin['bytes']\n\
        \        destination=target/name;destination.parent.mkdir(parents=True,exist_ok=True)\n        with z.open(item) as\
        \ source,destination.open('xb') as output:shutil.copyfileobj(source,output,1024**2)\n        with destination.open('rb')\
        \ as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()\n        assert destination.stat().st_size==pin['bytes']\
        \ and actual==pin['sha256']\nassert {p.relative_to(target).as_posix() for p in target.rglob('*') if p.is_file()}==set(selected)\n\
        archive.unlink()\nPYCRYPTO\n"
