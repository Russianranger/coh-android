      shell: bash
      run: "python - <<'PYRAW'\nimport hashlib,json,os,pathlib\nroot=pathlib.Path.cwd().resolve();staged=pathlib.Path('C:/fgsrc')\n\
        fixed_names=['CMakeCache.txt', 'MapServer.exe', 'map-startup-build-input.json', 'map-startup-inputs.json', 'native-fresh-groups-server-build-input.json',\
        \ 'native-groups-transaction-server-build-input.json', 'source/Common/seq/anim.c', 'source/Common/seq/coh_fresh_folder_profile_api.h',\
        \ 'source/Common/seq/coh_fresh_original_resource_quiescence.inc', 'source/Common/seq/coh_resource_quiescence.inc', 'source/MapServer/src/group/coh_fresh_source_profile.inc',\
        \ 'source/MapServer/src/group/coh_source_catalog_sink.inc', 'source/MapServer/src/group/coh_source_groups_capture_sink.inc',\
        \ 'source/MapServer/src/group/groupnetsend.c', 'source/MapServer/src/svr/svr_init.c', 'source/libs/UtilitiesLib/src/utils/FolderCache.c',\
        \ 'source/libs/UtilitiesLib/src/utils/coh_fresh_folder_profile.inc', 'source/libs/UtilitiesLib/src/utils/coh_fresh_folder_profile_api.h',\
        \ 'source/libs/UtilitiesLib/src/utils/coh_fresh_source_profile_api.h']\nsources={}\nfor name in fixed_names:\n    relative='out/build/vs2026/bin/OptDebug/MapServer.exe'\
        \ if name=='MapServer.exe' else 'out/build/vs2026/CMakeCache.txt' if name=='CMakeCache.txt' else name.removeprefix('source/')\n\
        \    sources[name]=staged/relative\nif not 0<len(sources)<=64:raise ValueError('RAW_FIXED_INVENTORY_BOUND')\noutput=pathlib.Path(os.environ['RUNNER_TEMP'])/'fresh-groups-UNADMITTED-recovery';output.mkdir()\n\
        files={};missing=[];total=0\nfor name,source in sorted(sources.items()):\n rel=pathlib.PurePosixPath(name)\n if rel.is_absolute()\
        \ or any(x in ('','.','..') for x in rel.parts) or chr(92) in name or ':' in name:raise ValueError('RAW_RELATIVE_NAME')\n if\
        \ not source.exists():missing.append(name);continue\n if source.is_symlink() or not source.is_file() or source.resolve()!=source:raise\
        \ ValueError('RAW_REGULAR_PATH')\n before=source.stat()\n if before.st_nlink!=1 or not 0<=before.st_size<=16*1024**2:raise ValueError('RAW_FILE_BOUND')\n\
        \ total+=before.st_size\n if total>32*1024**2:raise ValueError('RAW_TOTAL_BOUND')\n with source.open('rb') as stream:data=stream.read(16*1024**2+1)\n\
        \ after=source.stat()\n if len(data)!=before.st_size or (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns):raise\
        \ ValueError('RAW_FILE_CHANGED')\n destination=output/name;destination.parent.mkdir(parents=True,exist_ok=True)\n with destination.open('xb')\
        \ as stream:stream.write(data)\n files[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}\nresult={'schema':'coh-fresh-groups-UNADMITTED-build-recovery-v1','source_revision':os.environ['GITHUB_SHA'],'admitted':False,'compiler_success_claimed':False,'pe_identity_validated':False,'runtime_executed':False,'accepted_observer_equivalence':False,'source_generation_admitted':False,'world_authority':False,'files':files,'missing_fixed_members':missing,'total_bytes':total}\n\
        with (output/'UNADMITTED-recovery.json').open('xb') as stream:stream.write((json.dumps(result,indent=2,sort_keys=True)+'\\n').encode())\n\
        print(json.dumps({'admitted':False,'retained_fixed_files':len(files),'missing_fixed_files':len(missing),'runtime_executed':False}))\n\
        PYRAW\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-fresh-groups-observer-compile-${{ github.sha }}
        path: '${{ runner.temp }}/fresh-groups-compile/

          ${{ runner.temp }}/fresh-groups-build-logs/

          ${{ runner.temp }}/fresh-groups-source-admission.json

          ${{ runner.temp }}/fresh-groups-inputs-before.json

          ${{ runner.temp }}/fresh-groups-inputs-after.json

          ${{ runner.temp }}/fresh-groups-UNADMITTED-recovery/

