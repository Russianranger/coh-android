name: Build separate callback-sealed original GROUPS diagnostic observer
'on':
  push:
    branches:
    - native-android
    paths:
    - .github/workflows/native-fresh-groups-build.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-fresh-groups-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-original-observer-compile:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
    - name: Preserve exact original source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Admit frozen independently reviewed profile source proof without replay
      shell: bash
      run: "python - <<'PYPROOF'\nimport hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path.cwd().resolve()\ndef need(ok,code):\n\
        \    if not ok:raise ValueError(code)\ndef raw(path,maximum=8*1024**2):\n    need(not path.is_symlink() and path.is_file() and\
        \ path.stat().st_size<=maximum,'REGULAR_BOUNDED_SOURCE')\n    return path.read_bytes()\ndef fixed(name,digest):\n    data=raw(root/name);need(hashlib.sha256(data).hexdigest()==digest,'FIXED_REVIEWED_EVIDENCE');return\
        \ json.loads(data)\nneed(__debug__ and not os.environ.get('PYTHONOPTIMIZE'),'ASSERTIONS_REQUIRED')\nneed(os.name=='nt' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted','HOSTED_WINDOWS_ONLY')\n\
