        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();need(head==os.environ['GITHUB_SHA'],'EXACT_CHECKOUT')\n\
        q=fixed('native-android/engine/scenecatalog-server/evidence/fresh-callback-profile-20261018/source-qualification.json','5c22a7d426fa38228d87355c439c545ef6506385695a644b38c9bfb792d5ffb4')\n\
        f=fixed('native-android/combined-client/diagnostics/continuation-f-20261017/fresh-callback-profile-source-review-20261018/review.json','e8a31c85135dfe1bdc1f79527f2ee603f40d847c8ba82e41b8716fca5c90b37b')\n\
        s=fixed('native-android/engine/scenecatalog-server/evidence/fresh-callback-profile-20261018/stager-runtime-followup.json','a4df0e7034a8f8b88f1b1ceafcc7c718afed66c80febd1f741eb2d02a22fed70')\n\
        f2=fixed('native-android/combined-client/diagnostics/continuation-f-20261017/fresh-callback-profile-source-review-20261018/followup/review.json','a7f6c2dfaaf3e5b7b5e343f2ded01f153df83741551423213c0ff1e7ad8ee92e')\n\
        need(q['schema']=='coh-fresh-callback-source-qualification-v1' and q['passed'] is True and f['passed'] is True,'QUALIFIED_SOURCE_SCOPE')\n\
        need(len(q['source_sha256'])==34 and q['source_sha256']==f['recorded_source_sha256'] and q['python_test_methods']==26,'REVIEWED_SOURCE_SET')\n\
        need(set(q['modes'])=={'release','address','undefined'},'THREE_HOST_MODES')\nfor name,count in [('release',1425),('address',1426),('undefined',1426)]:\n\
