    - name: Independently admit exact original inputs and stage the separate callback-sealed role
      run: 'python tools/android/interactive/map_startup_inputs.py --output out/native-inputs --cache out/asset-cache

        if ($LASTEXITCODE -ne 0) { throw ''Exact published input admission failed'' }

        python tools/prepare_map_startup_source.py --output C:/fgsrc --animations-pigg out/native-inputs/server-animations.pigg --animation-manifest
        out/native-inputs/server-animation-manifest.json

        if ($LASTEXITCODE -ne 0) { throw ''Private original source staging failed'' }

        python native-android/engine/scenecatalog-server/stage_groups_capture.py --source-root . --already-staged C:/fgsrc

        if ($LASTEXITCODE -ne 0) { throw ''New transaction sink source staging failed'' }

        python native-android/engine/scenecatalog-server/fresh_callback_observer/stage.py --source-root . --already-staged C:/fgsrc

        if ($LASTEXITCODE -ne 0) { throw ''Fresh callback-sealed source staging failed'' }

        Copy-Item -LiteralPath out/native-inputs/map-startup-inputs.json -Destination C:/fgsrc/map-startup-inputs.json

        python native-android/engine/scenecatalog-server/fresh_callback_observer/stage.py --verify --source-root . --already-staged
        C:/fgsrc

        if ($LASTEXITCODE -ne 0) { throw ''Full inherited and fresh staged source verification failed'' }

        '
    - name: Reverify whole original input files before compiler work
      shell: bash
      run: "python - <<'PYINPUTS'\nimport hashlib,importlib.util,json,os,pathlib,subprocess,sys\nroot=pathlib.Path.cwd().resolve();head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\n\
        if head!=os.environ['GITHUB_SHA']:raise ValueError('INPUT_CHECKOUT_CHANGED')\nadmission=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'fresh-groups-source-admission.json').read_bytes())\n\
        for name,digest in admission['source_sha256'].items():\n    path=root/name\n    if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest()!=digest:raise\
        \ ValueError('SOURCE_CHANGED_AROUND_BUILD')\npath=root/'tools/android/interactive/map_startup_inputs.py'\nspec=importlib.util.spec_from_file_location('fresh_original_map_inputs',path);module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\n\
        sys.path.insert(0,str(root/'native-android/engine/scenecatalog-qualification'))\nfrom record_export_compile import validate_inputs\n\
        folder=root/'out/native-inputs';receipt=validate_inputs(json.loads((folder/'map-startup-inputs.json').read_bytes()),module)\n\
        module.checked(folder/'COH-Atlas-Gameplay-0.13.31.apk',module.DONOR)\nfor name,pin in receipt['files'].items():module.checked(folder/name,pin)\n\
        files={name:module.pin(folder/name) for name in ('COH-Atlas-Gameplay-0.13.31.apk',*receipt['files'],'map-startup-inputs.json')}\n\
        result={'schema':'coh-fresh-groups-original-inputs-v1','source_revision':head,'files':files,'donor_rebuilt':False,'runtime_executed':False}\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'fresh-groups-inputs-before.json'\n\noutput=pathlib.Path(os.environ['RUNNER_TEMP'])/'fresh-groups-inputs-before.json'\n\
        with output.open('xb') as stream:stream.write((json.dumps(result,indent=2,sort_keys=True)+'\\n').encode())\nprint(json.dumps({'passed':True,'whole_input_files_reverified':len(files),'runtime_executed':False}))\n\
        PYINPUTS\n"
    - name: Build only the changed nonshipping MapServer observer
