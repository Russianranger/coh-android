        PYINPUTS\n"
    - name: Record and strictly admit only the new source role and compiled PE
      run: 'python native-android/engine/scenecatalog-server/fresh_callback_observer/admit_compile.py --record --source-root . --already-staged
        C:/fgsrc --binary C:/fgsrc/out/build/vs2026/bin/OptDebug/MapServer.exe --cmake-cache C:/fgsrc/out/build/vs2026/CMakeCache.txt
