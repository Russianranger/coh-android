name: Import pinned Issue 24 content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-pinned-content
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Import and verify complete companion snapshot
        run: |
          git config core.autocrlf false
          python3 tools/import_source.py --lock content-lock.json
          python3 tools/verify_source.py
      - name: Commit verified companion content
        run: |
          if git diff --cached --quiet; then
            echo 'Pinned companion snapshot already verified.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Import complete pinned Issue 24 text data and tools'
          git push origin HEAD:main
      - name: Check public binary asset availability
        run: python3 tools/content_assets.py probe --output docs/asset-availability.json
      - name: Record asset availability results
        run: |
          git add docs/asset-availability.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Record hosted-runner binary asset availability'
          git push origin HEAD:main
