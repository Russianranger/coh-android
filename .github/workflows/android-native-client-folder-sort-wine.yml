name: Paired actual Game startup with bounded constructor and original shader probe
on:
  push:
    branches: [codex/native-client-folder-sort-wine-037]
    paths:
      - .github/workflows/android-native-client-folder-sort-wine.yml
      - tools/qualify_native_client_folder_sort_wine.py
      - tools/test_native_client_folder_sort_wine.py
      - tools/qualify_native_client_startup.py
      - tools/test_native_client_startup.py
      - tools/prepare_native_client_profile_fixture.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: native-client-folder-sort-wine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Qualify repaired native GL prerequisite, lifecycle and paired provider guards
        run: |
          python3 -m unittest discover -s tools -p test_native_client_startup.py
          python3 -m unittest discover -s tools -p test_native_client_folder_sort_wine.py
      - name: Admit storage and install complete real PE32 OpenGL software runtime
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 -c "import shutil; assert shutil.disk_usage('.').free >= 30*1024**3"
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb xauth mesa-utils tesseract-ocr libgl1:i386 libglx-mesa0:i386 libgl1-mesa-dri:i386 libx11-6:i386 libxext6:i386 libxrandr2:i386
          mkdir -p out
          dpkg-query -W wine wine32:i386 libgl1:i386 libglx-mesa0:i386 libgl1-mesa-dri:i386 libx11-6:i386 libxext6:i386 libxrandr2:i386 > out/host-gl-packages.txt
      - name: Recover only the successful new Game artifact and exact public .36 native donor
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/candidate-history out/ocr-regression-history
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.error,urllib.request
          base='https://api.github.com/repos/Russianranger/coh-android'
          def request(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==2:raise
                      time.sleep(5)
          run=request(base+'/actions/runs/38479270330');jobs=request(base+'/actions/runs/38479270330/jobs')
          artifact=request(base+'/actions/artifacts/11856633816')
          assert run['head_sha']=='9325f67e1bb4a3e6696dcfd1308ba8e4183171b0' and run['conclusion']=='success'
          native=[j for j in jobs['jobs'] if j['id']==115577567808]
          assert len(native)==1 and native[0]['name']=='native-game' and native[0]['conclusion']=='success'
          assert artifact['name']=='coh-nonshipping-native-client-folder-sort' and artifact['expired'] is False
          assert artifact['size_in_bytes']==4253004 and artifact['digest']=='sha256:5d374e3d515eb171905523fd67d321393783e3f667218488be486efff433918a'
          assert artifact['workflow_run']['head_sha']==run['head_sha']
          for name,value in [('run',run),('jobs',jobs),('artifact',artifact)]:pathlib.Path('out/candidate-history/'+name+'.json').write_text(json.dumps(value,indent=2)+'\n')
          failed_run=request(base+'/actions/runs/38484481041');failed_artifact=request(base+'/actions/artifacts/11859082802')
          assert failed_run['head_sha']=='7004c2a103b8798958a928143e070817a37bbcaa' and failed_run['conclusion']=='failure'
          assert failed_artifact['name']=='coh-nonshipping-native-client-paired-startup' and failed_artifact['expired'] is False
          assert failed_artifact['size_in_bytes']==1908469 and failed_artifact['digest']=='sha256:e57c647d1fe5c3fa8c2c3c09494c67720595c6b806f54233e0f34d531f57a848'
          assert failed_artifact['workflow_run']['head_sha']==failed_run['head_sha']
          for name,value in [('run',failed_run),('artifact',failed_artifact)]:pathlib.Path('out/ocr-regression-history/'+name+'.json').write_text(json.dumps(value,indent=2)+'\n')
          target=pathlib.Path('out/donor-036.apk')
          with urllib.request.urlopen('https://github.com/Russianranger/coh-android/releases/download/coh-atlas-gameplay-v0.13.36/COH-Atlas-Gameplay-0.13.36.apk',timeout=60) as response,target.open('xb') as stream:
              total=0;digest=hashlib.sha256()
              while block:=response.read(1024**2):
                  total+=len(block);assert total<=42076692;digest.update(block);stream.write(block)
          assert total==42076692 and digest.hexdigest()=='14d88da1796d155dc1b98e45ac642c7702ff3286e7ef0f2a0772f8e48693b12f'
          PY
          gh api repos/Russianranger/coh-android/actions/artifacts/11856633816/zip > out/candidate-history/artifact.zip
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          path=pathlib.Path('out/candidate-history/artifact.zip')
          assert path.stat().st_size==4253004 and hashlib.sha256(path.read_bytes()).hexdigest()=='5d374e3d515eb171905523fd67d321393783e3f667218488be486efff433918a'
          output=pathlib.Path('out/native-candidate');output.mkdir()
          with zipfile.ZipFile(path) as archive:
              assert len(archive.namelist())==6 and len(set(archive.namelist()))==6
              for name in archive.namelist():
                  assert '/' not in name and '\\' not in name and archive.getinfo(name).file_size<=64*1024**2
                  (output/name).write_bytes(archive.read(name))
          PY
          python3 tools/package_native_client_folder_sort.py validate --directory out/native-candidate --repository-commit 9325f67e1bb4a3e6696dcfd1308ba8e4183171b0 --donor-apk out/donor-036.apk
          gh api repos/Russianranger/coh-android/actions/artifacts/11859082802/zip > out/ocr-regression-history/artifact.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          sys.path.insert(0,'tools');import qualify_native_client_startup as observer
          path=pathlib.Path('out/ocr-regression-history/artifact.zip')
          assert path.stat().st_size==1908469 and hashlib.sha256(path.read_bytes()).hexdigest()=='e57c647d1fe5c3fa8c2c3c09494c67720595c6b806f54233e0f34d531f57a848'
          output=pathlib.Path('out/ocr-regression');output.mkdir(mode=0o700)
          base='native-client-paired/retained/first-launch/'
          with zipfile.ZipFile(path) as archive:
              assert len(archive.namelist())==49 and len(set(archive.namelist()))==49
              phase=json.loads(archive.read(base+'native-client-phase.json'))
              original=archive.read(base+'startup.ppm')
          assert len(original)==1440015 and hashlib.sha256(original).hexdigest()=='231473437aa48c85c7b8a6da909cafc1a384a5263e450c04b7e82d7c59d1038f'
          assert phase['status']=='failed' and phase['failure']['message']=='Captured current Game frame has no login/account/password text'
          native=phase['evidence']['current_native_evidence']
          assert native['all_data_loaded'] and native['client_main_loop_reached'] and native['client_window_observed']
          assert native['graphics_observation']['renderer_classification']=='software'
          frame=output/'original-startup.ppm';frame.write_bytes(original);frame.chmod(0o400)
          result=observer.observe_login_text(frame,observer.binary_tool('tesseract'),output,'actual-failed-frame')
          assert result['login_text_observed'] and not result['UI_input_sent'] and not result['graphics_quality_changed']
          observer.write(output/'read-only-OCR-regression.json',{'format':1,'status':'passed','role':'actual_failed_native_frame_readonly_OCR_regression',
              'source_run':38484481041,'source_artifact':11859082802,'original_failed_phase':phase,
              'actual_OCR_observation':result,'historical_native_failure_reclassified':False,'new_Game_process_executed':False})
          print('Passed actual retained-frame OCR regression without UI input or quality changes')
          PY
      - name: Reuse exact previously compiled Cg observer without a native rebuild
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/cg-history
          gh api repos/Russianranger/coh-android/actions/runs/38345782437 > out/cg-history/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38345782437/jobs > out/cg-history/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713 > out/cg-history/artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713/zip > out/cg-history/artifact.zip
          python3 tools/reuse_native_startup_profile.py --archive out/cg-history/artifact.zip --output out/cg-observed-package --run-metadata out/cg-history/run.json --jobs-metadata out/cg-history/jobs.json --artifact-metadata out/cg-history/artifact.json
          python3 tools/test_reuse_native_startup_profile.py --package out/cg-observed-package
      - name: Authenticate original asset volumes once and prepare one complete current client provider
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/android/interactive')
          import qualify_runtime_asset_preflight as inputs
          inputs.ensure_assets('out/asset-cache')
          PY
          python3 tools/prepare_native_client_profile_fixture.py --donor-apk out/donor-036.apk --payloads out/asset-cache/payloads --output out/client-fixture
      - name: Run retained two launches then candidate two launches on the same verified provider and closed prefix
        run: >-
          xvfb-run -a -s '-screen 0 800x600x24 +extension GLX +render -noreset'
          python3 tools/qualify_native_client_folder_sort_wine.py
          --fixture out/client-fixture/native-client-fixture.json
          --donor-apk out/donor-036.apk --package out/native-candidate
          --package-commit 9325f67e1bb4a3e6696dcfd1308ba8e4183171b0
          --output out/native-client-paired --prefix "${RUNNER_TEMP}/coh-client-paired-${GITHUB_RUN_ID}"
          --cg-package out/cg-observed-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-nonshipping-native-client-paired-startup
          path: |
            out/native-client-paired/
            out/client-fixture/native-client-fixture.json
            out/candidate-history/*.json
            out/cg-history/*.json
            out/host-gl-packages.txt
            out/ocr-regression/
            out/ocr-regression-history/*.json
          retention-days: 90
          if-no-files-found: warn
