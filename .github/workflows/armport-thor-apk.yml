name: ArmPort Thor APK (M5 candidate)

# User-authorized M5 development: build and sign COH Atlas
# Gameplay 0.13.70, the 0.13.36 app plus the ARM64 client option, for the M5
# Thor play test. Uploads a workflow artifact; publish_release=true (only for a
# user-approved candidate) also publishes it as a GitHub pre-release.
on:
  # Dispatch only, with an explicit package run: a default or push build could
  # silently embed an older client (Sol 5661731725, Astra 5671483734).
  workflow_dispatch:
    inputs:
      m4_run_id:
        description: Successful ArmPort app runtime run (armport-app-client-package) for this head's patches
        required: true
      server_metrics:
        description: Include the two-variant server package qualified by this exact runtime run
        type: boolean
        required: false
        default: false
      server_option:
        description: With server_metrics, keep the shipping MapServer and add the Thor metrics server as an opt-in second archive
        type: boolean
        required: false
        default: false
      external_maps_run_id:
        description: Optional successful armport-external-maps-dbserver run - its DbServer replaces the level-up one (map requests; the game's own zone travel)
        required: false
        default: ''
      zone_beacons_run_id:
        description: Optional successful armport-zone-beacons run (map 71; 0.13.65) - the APK itself carries that graph
        required: false
        default: ''
      navigation_maps_run_id:
        description: Optional successful armport-zone-beacons pack run - the APK pins its navigation map pack (imported like the asset pack)
        required: false
        default: ''
      proot_ioctl:
        description: Build this head's PRoot for Android (patches 0004 and 0005) and add it as the second PRoot build (0.13.69)
        type: boolean
        required: false
        default: false
      publish_release:
        description: Publish the signed APK as a GitHub pre-release (user-approved candidates only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: armport-thor-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  M4_RUN_ID: ${{ inputs.m4_run_id }}
  SERVER_METRICS: ${{ inputs.server_metrics }}
  SERVER_OPTION: ${{ inputs.server_option }}
  EXTERNAL_MAPS_RUN_ID: ${{ inputs.external_maps_run_id }}
  ZONE_BEACONS_RUN_ID: ${{ inputs.zone_beacons_run_id }}
  NAVIGATION_MAPS_RUN_ID: ${{ inputs.navigation_maps_run_id }}
  PROOT_IOCTL: ${{ inputs.proot_ioctl }}
  SIGNER_RUN_ID: '36731428735'
  DONOR_ASSET_ID: '635975286'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Android SDK 35 platform and build tools
        run: timeout 300 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download the public 0.13.36 donor APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/donor"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${DONOR_ASSET_ID}" > "$RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk"
          echo "14d88da1796d155dc1b98e45ac642c7702ff3286e7ef0f2a0772f8e48693b12f  $RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk" | sha256sum -c -
      - name: Require a qualified package built from this head's native patches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test -n "$M4_RUN_ID"
          if [ "$SERVER_OPTION" = true ] && [ "$SERVER_METRICS" != true ]; then
            echo '::error::server_option needs server_metrics (its qualified runtime run)'; exit 1
          fi
          R="$GITHUB_REPOSITORY"
          q=$(gh api "repos/$R/actions/runs/$M4_RUN_ID" --jq '[.path,.status,.conclusion]|join(" ")')
          [ "$q" = ".github/workflows/armport-app-runtime.yml completed success" ] || {
            echo "::error title=ArmPort package provenance::run $M4_RUN_ID is not a successful app runtime run ($q)"; exit 1; }
          if [ "$SERVER_METRICS" = true ]; then
            sha=$(gh api "repos/$R/actions/runs/$M4_RUN_ID" --jq .head_sha)
            [ "$sha" = "$GITHUB_SHA" ] || { echo '::error::Metrics runtime must qualify this exact head'; exit 1; }
          fi
          echo "M4_RUN_ID_VERIFIED=$M4_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: armport-app-client-package
          path: ${{ runner.temp }}/armport-package
          run-id: ${{ env.M4_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Embedded client must come from a build with this head's armport/patches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          client=$(python3 -c "import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read('client-package.json'))['client_run_id'])" \
            "$RUNNER_TEMP/armport-package/armport-client.zip")
          path=$(gh api "repos/$R/actions/runs/$client" --jq .path)
          conclusion=$(gh api "repos/$R/actions/runs/$client" --jq '.conclusion // "none"')
          sha=$(gh api "repos/$R/actions/runs/$client" --jq .head_sha)
          [ "$path" = .github/workflows/armport-build.yml ] && [ "$conclusion" = success ] || {
            echo "::error title=ArmPort package provenance::client run $client is not a successful ArmPort build ($path $conclusion)"; exit 1; }
          tree() { gh api "repos/$R/contents/armport?ref=$1" --jq '.[]|select(.name=="patches")|.sha'; }
          built=$(tree "$sha"); current=$(tree "$GITHUB_SHA")
          [ -n "$built" ] && [ "$built" = "$current" ] || {
            echo "::error title=ArmPort package provenance::client run $client built armport/patches $built at $sha; this head has $current"; exit 1; }
          echo "::notice title=ArmPort package provenance::package run $M4_RUN_ID_VERIFIED, client run $client at $sha, armport/patches tree $current matches $GITHUB_SHA"
      - uses: actions/download-artifact@v4
        if: inputs.server_metrics
        with:
          name: armport-app-server-metrics
          path: ${{ runner.temp }}/qualified-server-metrics
          run-id: ${{ env.M4_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Checkout the immutable server certificate baseline
        if: inputs.server_metrics
        uses: actions/checkout@v4
        with:
          ref: c86a57962363dbe2dc2091dadde6abdfaa2e1e1c
          path: server-baseline
          lfs: false
          persist-credentials: false
      - name: Authenticate server qualification and both variant byte inventories
        if: inputs.server_metrics
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 armport/app/server_pipeline.py check \
            --source "$RUNNER_TEMP/qualified-server-metrics" \
            --repository-commit "$GITHUB_SHA" --runtime-run-id "$M4_RUN_ID" \
            --baseline-root "$GITHUB_WORKSPACE/server-baseline" > "$RUNNER_TEMP/server-qualified.json"
          server=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["native_build_run_id"])' "$RUNNER_TEMP/server-qualified.json")
          client=$(python3 -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("client-package.json"))["client_run_id"])' "$RUNNER_TEMP/armport-package/armport-client.zip")
          data=$(python3 -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("client-package.json"))["data_run_id"])' "$RUNNER_TEMP/armport-package/armport-client.zip")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$server" > "$RUNNER_TEMP/server-build-run.json"
          python3 armport/app/server_pipeline.py check-run \
            --build-run-json "$RUNNER_TEMP/server-build-run.json" --repository-commit "$GITHUB_SHA" \
            --server-run-id "$server" --client-run-id "$client" --data-run-id "$data"
          echo "::notice title=ArmPort server provenance::native build $server at $GITHUB_SHA; retained runtime $M4_RUN_ID passed; Thor server built/source-checked but not runtime/device validated"
      - name: Record the on-demand zone DbServer build run
        if: env.EXTERNAL_MAPS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXTERNAL_MAPS_RUN_ID" > "$RUNNER_TEMP/external-maps-run.json"
      - uses: actions/download-artifact@v4
        if: env.EXTERNAL_MAPS_RUN_ID != ''
        with:
          name: armport-external-maps-dbserver
          path: ${{ runner.temp }}/external-maps-dbserver
          run-id: ${{ env.EXTERNAL_MAPS_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Record the zone beacon graph run
        if: env.ZONE_BEACONS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZONE_BEACONS_RUN_ID" > "$RUNNER_TEMP/zone-beacons-run.json"
      - uses: actions/download-artifact@v4
        if: env.ZONE_BEACONS_RUN_ID != ''
        with:
          name: coh-zone-beacons-71
          path: ${{ runner.temp }}/zone-beacons
          run-id: ${{ env.ZONE_BEACONS_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Record the navigation map pack run
        if: env.NAVIGATION_MAPS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NAVIGATION_MAPS_RUN_ID" > "$RUNNER_TEMP/navigation-maps-run.json"
      - uses: actions/download-artifact@v4
        if: env.NAVIGATION_MAPS_RUN_ID != ''
        with:
          name: coh-navigation-maps
          path: ${{ runner.temp }}/navigation-maps
          run-id: ${{ env.NAVIGATION_MAPS_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: ${{ env.SIGNER_RUN_ID }}
          github-token: ${{ github.token }}
      # 0.13.69: the second PRoot build. Same pinned source, NDK and recipe as the donor's
      # libproot.so (run 36364550345) plus android/native/proot patches 0004 and 0005; two compiler jobs.
      - name: Android NDK 27.2.12479018 for the second PRoot build
        if: inputs.proot_ioctl
        run: timeout 900 sdkmanager 'ndk;27.2.12479018'
      - id: talloc-source
        if: inputs.proot_ioctl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/talloc-source
          key: armport-talloc-dc46c40b9f46bb34dd97fe41f548b0e8b247b77a918576733c528e83abd854dd
      - uses: actions/download-artifact@v4
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        with:
          name: coh-diagnostic-runtime-inputs
          path: ${{ runner.temp }}/accepted-runtime
          run-id: 36364550345
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        with:
          name: coh-proot-android-source-and-build
          path: ${{ runner.temp }}/accepted-proot
          run-id: 36364550345
          github-token: ${{ github.token }}
      - name: Recover the exact pinned talloc source from retained runtime artifacts
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        run: |
          python3 tools/android/extract_talloc_source.py --assets "$RUNNER_TEMP/accepted-runtime" \
            --bundle "$RUNNER_TEMP/accepted-proot/proot-corresponding-sources.tar.gz" \
            --output "$RUNNER_TEMP/talloc-source/talloc-2.4.3.tar.gz"
      - name: Build this head's PRoot for Android ARM64 (patches 0001-0004)
        if: inputs.proot_ioctl
        run: |
          armport/scripts/step.sh "ArmPort Android PRoot build" python3 tools/android/build_proot.py \
            --target android-arm64 --ndk "$ANDROID_HOME/ndk/27.2.12479018" --output out/android/native --jobs 2 \
            --talloc-archive "$RUNNER_TEMP/talloc-source/talloc-2.4.3.tar.gz"
          python3 - <<'EOF'
          import json
          r = json.load(open('out/android/native/arm64-v8a/proot-build-receipt.json'))
          print('::notice title=ArmPort Android PRoot::' + json.dumps({k: r.get(k) for k in (
              'target', 'status', 'source_commit', 'ndk_version', 'compiler', 'files', 'patches',
              'ioctl_command_filter_patch', 'corresponding_sources')}))
          EOF
      - name: Build and sign COH Atlas Gameplay 0.13.70
        env: {COH_INTERACTIVE_KEYSTORE_PASSWORD: android}
        run: |
          mkdir -p out/thor
          server_args=()
          if [ "$SERVER_METRICS" = true ]; then
            server_args=(--server-metrics "$RUNNER_TEMP/qualified-server-metrics" --runtime-run-id "$M4_RUN_ID" --baseline-root "$GITHUB_WORKSPACE/server-baseline")
            if [ "$SERVER_OPTION" = true ]; then server_args+=(--server-option); fi
          fi
          if [ -n "$EXTERNAL_MAPS_RUN_ID" ]; then
            server_args+=(--external-maps-dbserver "$RUNNER_TEMP/external-maps-dbserver" --external-maps-run-json "$RUNNER_TEMP/external-maps-run.json")
          fi
          if [ -n "$ZONE_BEACONS_RUN_ID" ]; then
            server_args+=(--zone-beacons "$RUNNER_TEMP/zone-beacons" --zone-beacons-run-json "$RUNNER_TEMP/zone-beacons-run.json")
          fi
          if [ -n "$NAVIGATION_MAPS_RUN_ID" ]; then
            server_args+=(--navigation-maps "$RUNNER_TEMP/navigation-maps" --navigation-maps-run-json "$RUNNER_TEMP/navigation-maps-run.json")
          fi
          if [ "$PROOT_IOCTL" = true ]; then
            server_args+=(--proot-ioctl out/android/native/arm64-v8a)
          fi
          armport/scripts/step.sh "ArmPort Thor APK build" python3 armport/app/build_thor_apk.py \
            --donor-apk "$RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk" \
            --armport "$RUNNER_TEMP/armport-package/armport-client.zip" \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks" \
            --repository-commit "$GITHUB_SHA" --output out/thor/COH-Atlas-Gameplay-0.13.70.apk "${server_args[@]}"
      - name: Remove retained signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
      - name: Report
        run: |
          python3 - <<'EOF'
          import json
          r = json.load(open('out/thor/thor-apk-build-report.json'))
          keep = {k: r[k] for k in ('apk', 'bytes', 'sha256', 'version_name', 'version_code',
                  'signer_certificate_sha256', 'replaced_members', 'added_members', 'changed_runtime_payloads',
                  'retained_members', 'armport_client')}
          if 'external_maps_dbserver' in r:
              keep['external_maps_dbserver'] = r['external_maps_dbserver']
          if 'zone_beacons' in r:
              keep['zone_beacons'] = r['zone_beacons']
          if 'navigation_map_pack' in r:
              keep['navigation_map_pack'] = r['navigation_map_pack']
          if 'proot_ioctl_filter' in r:
              keep['proot_ioctl_filter'] = {k: r['proot_ioctl_filter'][k] for k in ('switch', 'default', 'members', 'compiler')}
          if 'server_metrics_qualification' in r:
              keep['server_metrics_qualification'] = r['server_metrics_qualification']
              keep['server_metrics_runtime_validated'] = r['server_metrics_runtime_validated']
              keep['server_metrics_placement'] = r['server_metrics_placement']
          print('::notice title=ArmPort Thor APK::' + json.dumps(keep))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: coh-atlas-gameplay-0.13.70-apk
          path: out/thor/
          retention-days: 30
          if-no-files-found: error

  release:
    if: inputs.publish_release
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coh-atlas-gameplay-0.13.70-apk
          path: apk
      - name: Publish the 0.13.70 pre-release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd apk
          test -f COH-Atlas-Gameplay-0.13.70.apk
          sha256sum COH-Atlas-Gameplay-0.13.70.apk > COH-Atlas-Gameplay-0.13.70.apk.sha256
          # The pack this APK pins (its build report's record names the pack's release).
          pack=$(python3 -c "import json, sys; r = json.load(open('thor-apk-build-report.json')).get('navigation_map_pack'); print('https://github.com/' + sys.argv[1] + '/releases/tag/' + r['release_tag'] if r else 'its release (see the test sheet)')" "$GITHUB_REPOSITORY")
          cat > notes.md <<EOF
          COH Atlas Gameplay 0.13.70 (x86 track performance candidate) for the Thor play test.

          Source ${GITHUB_SHA} on ${GITHUB_REF_NAME}; APK run ${GITHUB_RUN_ID}; qualified app runtime ${M4_RUN_ID}.
          In-place update over the installed app; it keeps app data, the saved hero and imported assets.

          New in 0.13.70, from the Thor test of 0.13.69 (2026-11-12):
          Fixed: after travelling, "Save character / log out" could leave the app waiting for ever.
          The character was saved, but the app had not yet been told of the arrival and then refused
          the confirmation. An arrival is now recorded after Save as well.
          New defaults (each has a tick box to go back): "Fast server", the server CI builds, which
          on the phone was in the world 4 min 0 s after the launch began instead of 5 min 43 s, and
          "Lighter system-call monitor", the second PRoot build, which ran two launches on the phone.
          That build now also stops the socket-option call only where PRoot acts on it, and counts
          the calls it still stops; the count is in the report. Its source, build receipt and
          licence files are in the APK under assets/proot-ioctl/ (PRoot: GPL-2.0-or-later; talloc:
          LGPL-3.0-or-later). The 0.13.36 PRoot program is still in the APK, byte for byte.
          Faster zone starts: a zone's navigation map is no longer re-checked file by file when its
          folders are unchanged (16 s per start on the phone, 57 s on a first visit).
          The report now holds the time the game itself reached the zone server; the app learns of
          it about 70 s late from the server log, so its own times were that much too long.
          Other experiments, off by default: "Draw on the game's own thread (frame rate experiment)"
          and "Keep a spare zone server loaded for travel (needs Fast server)".
          From 0.13.69: the saved zone starts while the game starts (Reopen).
          The navigation map pack is unchanged (${pack}); an imported pack stays imported.
          Unchanged: any character name the game accepts, one character per install; every zone can
          start; at most two zone servers, missions are not served yet; the full-window view, gear button
          and controller.
          Test sheet: THOR-TEST-0.13.70.md.
          EOF
          if [ "$SERVER_OPTION" = true ]; then
            echo "Servers: the CI-built MapServer with trusted prepared data by default (device-run in 0.13.69); unticking Fast server runs the 0.13.36 MapServer." >> notes.md
          elif [ "$SERVER_METRICS" = true ]; then
            echo "Servers: instrumented MapServer; trusted bins apply while Fast server is ticked (the default)." >> notes.md
          else
            echo "Servers: shipping MapServer, so the prepared server caches still load. The Fast server option has no effect in this build." >> notes.md
          fi
          gh release create "coh-atlas-gameplay-v0.13.70" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "COH Atlas Gameplay 0.13.70 (performance candidate)" --notes-file notes.md \
            COH-Atlas-Gameplay-0.13.70.apk COH-Atlas-Gameplay-0.13.70.apk.sha256
          echo "::notice title=ArmPort Thor release::https://github.com/${GITHUB_REPOSITORY}/releases/tag/coh-atlas-gameplay-v0.13.70"
