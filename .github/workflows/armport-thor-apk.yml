name: ArmPort Thor APK (M5 candidate)

# User-authorized M5 development: build and sign COH Atlas
# Gameplay 0.13.89, the 0.13.36 app plus the ARM64 client option, for the M5
# Thor play test. Uploads a workflow artifact; publish_release=true (only for a
# user-approved candidate) also publishes it as a GitHub pre-release.
on:
  # Dispatch only, with an explicit package run: a default or push build could
  # silently embed an older client (Sol 5661731725, Astra 5671483734).
  workflow_dispatch:
    inputs:
      m4_run_id:
        description: Successful ArmPort app runtime run (armport-app-client-package) for this head's patches
        required: true
      server_metrics:
        description: Include the two-variant server package qualified by this exact runtime run
        type: boolean
        required: false
        default: false
      server_option:
        description: With server_metrics, keep the shipping MapServer and add the Thor metrics server as an opt-in second archive
        type: boolean
        required: false
        default: false
      external_maps_run_id:
        description: Optional successful armport-external-maps-dbserver run - its DbServer replaces the level-up one (map requests; the game's own zone travel)
        required: false
        default: ''
      zone_beacons_run_id:
        description: Optional successful armport-zone-beacons run (map 71; 0.13.65) - the APK itself carries that graph
        required: false
        default: ''
      navigation_maps_run_id:
        description: Optional successful armport-zone-beacons pack run - the APK pins its navigation map pack (imported like the asset pack)
        required: false
        default: ''
      proot_ioctl:
        description: Build this head's PRoot for Android (patches 0004 to 0006) and add it as the second PRoot build (0.13.69)
        type: boolean
        required: false
        default: false
      publish_release:
        description: Publish the signed APK as a GitHub pre-release (user-approved candidates only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: armport-thor-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  M4_RUN_ID: ${{ inputs.m4_run_id }}
  SERVER_METRICS: ${{ inputs.server_metrics }}
  SERVER_OPTION: ${{ inputs.server_option }}
  EXTERNAL_MAPS_RUN_ID: ${{ inputs.external_maps_run_id }}
  ZONE_BEACONS_RUN_ID: ${{ inputs.zone_beacons_run_id }}
  NAVIGATION_MAPS_RUN_ID: ${{ inputs.navigation_maps_run_id }}
  PROOT_IOCTL: ${{ inputs.proot_ioctl }}
  SIGNER_RUN_ID: '36731428735'
  DONOR_ASSET_ID: '635975286'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Android SDK 35 platform and build tools
        run: timeout 300 sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download the public 0.13.36 donor APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/donor"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${DONOR_ASSET_ID}" > "$RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk"
          echo "14d88da1796d155dc1b98e45ac642c7702ff3286e7ef0f2a0772f8e48693b12f  $RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk" | sha256sum -c -
      - name: Require a qualified package built from this head's native patches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test -n "$M4_RUN_ID"
          if [ "$SERVER_OPTION" = true ] && [ "$SERVER_METRICS" != true ]; then
            echo '::error::server_option needs server_metrics (its qualified runtime run)'; exit 1
          fi
          R="$GITHUB_REPOSITORY"
          q=$(gh api "repos/$R/actions/runs/$M4_RUN_ID" --jq '[.path,.status,.conclusion]|join(" ")')
          [ "$q" = ".github/workflows/armport-app-runtime.yml completed success" ] || {
            echo "::error title=ArmPort package provenance::run $M4_RUN_ID is not a successful app runtime run ($q)"; exit 1; }
          if [ "$SERVER_METRICS" = true ]; then
            sha=$(gh api "repos/$R/actions/runs/$M4_RUN_ID" --jq .head_sha)
            [ "$sha" = "$GITHUB_SHA" ] || { echo '::error::Metrics runtime must qualify this exact head'; exit 1; }
          fi
          echo "M4_RUN_ID_VERIFIED=$M4_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: armport-app-client-package
          path: ${{ runner.temp }}/armport-package
          run-id: ${{ env.M4_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Embedded client must come from a build with this head's armport/patches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          client=$(python3 -c "import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read('client-package.json'))['client_run_id'])" \
            "$RUNNER_TEMP/armport-package/armport-client.zip")
          path=$(gh api "repos/$R/actions/runs/$client" --jq .path)
          conclusion=$(gh api "repos/$R/actions/runs/$client" --jq '.conclusion // "none"')
          sha=$(gh api "repos/$R/actions/runs/$client" --jq .head_sha)
          [ "$path" = .github/workflows/armport-build.yml ] && [ "$conclusion" = success ] || {
            echo "::error title=ArmPort package provenance::client run $client is not a successful ArmPort build ($path $conclusion)"; exit 1; }
          tree() { gh api "repos/$R/contents/armport?ref=$1" --jq '.[]|select(.name=="patches")|.sha'; }
          built=$(tree "$sha"); current=$(tree "$GITHUB_SHA")
          [ -n "$built" ] && [ "$built" = "$current" ] || {
            echo "::error title=ArmPort package provenance::client run $client built armport/patches $built at $sha; this head has $current"; exit 1; }
          echo "::notice title=ArmPort package provenance::package run $M4_RUN_ID_VERIFIED, client run $client at $sha, armport/patches tree $current matches $GITHUB_SHA"
      - uses: actions/download-artifact@v4
        if: inputs.server_metrics
        with:
          name: armport-app-server-metrics
          path: ${{ runner.temp }}/qualified-server-metrics
          run-id: ${{ env.M4_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Checkout the immutable server certificate baseline
        if: inputs.server_metrics
        uses: actions/checkout@v4
        with:
          ref: c86a57962363dbe2dc2091dadde6abdfaa2e1e1c
          path: server-baseline
          lfs: false
          persist-credentials: false
      - name: Authenticate server qualification and both variant byte inventories
        if: inputs.server_metrics
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 armport/app/server_pipeline.py check \
            --source "$RUNNER_TEMP/qualified-server-metrics" \
            --repository-commit "$GITHUB_SHA" --runtime-run-id "$M4_RUN_ID" \
            --baseline-root "$GITHUB_WORKSPACE/server-baseline" > "$RUNNER_TEMP/server-qualified.json"
          server=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["native_build_run_id"])' "$RUNNER_TEMP/server-qualified.json")
          client=$(python3 -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("client-package.json"))["client_run_id"])' "$RUNNER_TEMP/armport-package/armport-client.zip")
          data=$(python3 -c 'import json,sys,zipfile; print(json.loads(zipfile.ZipFile(sys.argv[1]).read("client-package.json"))["data_run_id"])' "$RUNNER_TEMP/armport-package/armport-client.zip")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$server" > "$RUNNER_TEMP/server-build-run.json"
          python3 armport/app/server_pipeline.py check-run \
            --build-run-json "$RUNNER_TEMP/server-build-run.json" --repository-commit "$GITHUB_SHA" \
            --server-run-id "$server" --client-run-id "$client" --data-run-id "$data"
          echo "::notice title=ArmPort server provenance::native build $server at $GITHUB_SHA; retained runtime $M4_RUN_ID passed; Thor server built/source-checked but not runtime/device validated"
      - name: Record the on-demand zone DbServer build run
        if: env.EXTERNAL_MAPS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXTERNAL_MAPS_RUN_ID" > "$RUNNER_TEMP/external-maps-run.json"
      - uses: actions/download-artifact@v4
        if: env.EXTERNAL_MAPS_RUN_ID != ''
        with:
          name: armport-external-maps-dbserver
          path: ${{ runner.temp }}/external-maps-dbserver
          run-id: ${{ env.EXTERNAL_MAPS_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Record the zone beacon graph run
        if: env.ZONE_BEACONS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZONE_BEACONS_RUN_ID" > "$RUNNER_TEMP/zone-beacons-run.json"
      - uses: actions/download-artifact@v4
        if: env.ZONE_BEACONS_RUN_ID != ''
        with:
          name: coh-zone-beacons-71
          path: ${{ runner.temp }}/zone-beacons
          run-id: ${{ env.ZONE_BEACONS_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Record the navigation map pack run
        if: env.NAVIGATION_MAPS_RUN_ID != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NAVIGATION_MAPS_RUN_ID" > "$RUNNER_TEMP/navigation-maps-run.json"
      - uses: actions/download-artifact@v4
        if: env.NAVIGATION_MAPS_RUN_ID != ''
        with:
          name: coh-navigation-maps
          path: ${{ runner.temp }}/navigation-maps
          run-id: ${{ env.NAVIGATION_MAPS_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-client-interactive-signing
          path: ${{ runner.temp }}/coh-retained-signing
          run-id: ${{ env.SIGNER_RUN_ID }}
          github-token: ${{ github.token }}
      # 0.13.69: the second PRoot build. Same pinned source, NDK and recipe as the donor's
      # libproot.so (run 36364550345) plus android/native/proot patches 0004 to 0006; two compiler jobs.
      - name: Android NDK 27.2.12479018 for the second PRoot build
        if: inputs.proot_ioctl
        run: timeout 900 sdkmanager 'ndk;27.2.12479018'
      - id: talloc-source
        if: inputs.proot_ioctl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/talloc-source
          key: armport-talloc-dc46c40b9f46bb34dd97fe41f548b0e8b247b77a918576733c528e83abd854dd
      - uses: actions/download-artifact@v4
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        with:
          name: coh-diagnostic-runtime-inputs
          path: ${{ runner.temp }}/accepted-runtime
          run-id: 36364550345
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        with:
          name: coh-proot-android-source-and-build
          path: ${{ runner.temp }}/accepted-proot
          run-id: 36364550345
          github-token: ${{ github.token }}
      - name: Recover the exact pinned talloc source from retained runtime artifacts
        if: inputs.proot_ioctl && steps.talloc-source.outputs.cache-hit != 'true'
        run: |
          python3 tools/android/extract_talloc_source.py --assets "$RUNNER_TEMP/accepted-runtime" \
            --bundle "$RUNNER_TEMP/accepted-proot/proot-corresponding-sources.tar.gz" \
            --output "$RUNNER_TEMP/talloc-source/talloc-2.4.3.tar.gz"
      - name: Build this head's PRoot for Android ARM64 (patches 0001-0004)
        if: inputs.proot_ioctl
        run: |
          armport/scripts/step.sh "ArmPort Android PRoot build" python3 tools/android/build_proot.py \
            --target android-arm64 --ndk "$ANDROID_HOME/ndk/27.2.12479018" --output out/android/native --jobs 2 \
            --talloc-archive "$RUNNER_TEMP/talloc-source/talloc-2.4.3.tar.gz"
          python3 - <<'EOF'
          import json
          r = json.load(open('out/android/native/arm64-v8a/proot-build-receipt.json'))
          print('::notice title=ArmPort Android PRoot::' + json.dumps({k: r.get(k) for k in (
              'target', 'status', 'source_commit', 'ndk_version', 'compiler', 'files', 'patches',
              'ioctl_command_filter_patch', 'corresponding_sources')}))
          EOF
      - name: Build and sign COH Atlas Gameplay 0.13.89
        env: {COH_INTERACTIVE_KEYSTORE_PASSWORD: android}
        run: |
          mkdir -p out/thor
          server_args=()
          if [ "$SERVER_METRICS" = true ]; then
            server_args=(--server-metrics "$RUNNER_TEMP/qualified-server-metrics" --runtime-run-id "$M4_RUN_ID" --baseline-root "$GITHUB_WORKSPACE/server-baseline")
            if [ "$SERVER_OPTION" = true ]; then server_args+=(--server-option); fi
          fi
          if [ -n "$EXTERNAL_MAPS_RUN_ID" ]; then
            server_args+=(--external-maps-dbserver "$RUNNER_TEMP/external-maps-dbserver" --external-maps-run-json "$RUNNER_TEMP/external-maps-run.json")
          fi
          if [ -n "$ZONE_BEACONS_RUN_ID" ]; then
            server_args+=(--zone-beacons "$RUNNER_TEMP/zone-beacons" --zone-beacons-run-json "$RUNNER_TEMP/zone-beacons-run.json")
          fi
          if [ -n "$NAVIGATION_MAPS_RUN_ID" ]; then
            server_args+=(--navigation-maps "$RUNNER_TEMP/navigation-maps" --navigation-maps-run-json "$RUNNER_TEMP/navigation-maps-run.json")
          fi
          if [ "$PROOT_IOCTL" = true ]; then
            server_args+=(--proot-ioctl out/android/native/arm64-v8a)
          fi
          armport/scripts/step.sh "ArmPort Thor APK build" python3 armport/app/build_thor_apk.py \
            --donor-apk "$RUNNER_TEMP/donor/COH-Atlas-Gameplay-0.13.36.apk" \
            --armport "$RUNNER_TEMP/armport-package/armport-client.zip" \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --keystore "$RUNNER_TEMP/coh-retained-signing/coh-client-interactive.jks" \
            --repository-commit "$GITHUB_SHA" --output out/thor/COH-Atlas-Gameplay-0.13.89.apk "${server_args[@]}"
      - name: Remove retained signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/coh-retained-signing"
      - name: Report
        run: |
          python3 - <<'EOF'
          import json
          r = json.load(open('out/thor/thor-apk-build-report.json'))
          keep = {k: r[k] for k in ('apk', 'bytes', 'sha256', 'version_name', 'version_code',
                  'signer_certificate_sha256', 'replaced_members', 'added_members', 'changed_runtime_payloads',
                  'retained_members', 'armport_client')}
          if 'external_maps_dbserver' in r:
              keep['external_maps_dbserver'] = r['external_maps_dbserver']
          if 'zone_beacons' in r:
              keep['zone_beacons'] = r['zone_beacons']
          if 'navigation_map_pack' in r:
              keep['navigation_map_pack'] = r['navigation_map_pack']
          if 'proot_ioctl_filter' in r:
              keep['proot_ioctl_filter'] = {k: r['proot_ioctl_filter'][k] for k in ('switch', 'default', 'members', 'compiler')}
          if 'server_metrics_qualification' in r:
              keep['server_metrics_qualification'] = r['server_metrics_qualification']
              keep['server_metrics_runtime_validated'] = r['server_metrics_runtime_validated']
              keep['server_metrics_placement'] = r['server_metrics_placement']
          print('::notice title=ArmPort Thor APK::' + json.dumps(keep))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: coh-atlas-gameplay-0.13.89-apk
          path: out/thor/
          retention-days: 30
          if-no-files-found: error

  release:
    if: inputs.publish_release
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coh-atlas-gameplay-0.13.89-apk
          path: apk
      - name: Publish the 0.13.89 pre-release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd apk
          test -f COH-Atlas-Gameplay-0.13.89.apk
          sha256sum COH-Atlas-Gameplay-0.13.89.apk > COH-Atlas-Gameplay-0.13.89.apk.sha256
          # The pack this APK pins (its build report's record names the pack's release).
          pack=$(python3 -c "import json, sys; r = json.load(open('thor-apk-build-report.json')).get('navigation_map_pack'); print('https://github.com/' + sys.argv[1] + '/releases/tag/' + r['release_tag'] if r else 'its release (see the test sheet)')" "$GITHUB_REPOSITORY")
          cat > notes.md <<EOF
          COH Atlas Gameplay 0.13.89 (x86 track performance candidate) for the Thor play test.

          Source ${GITHUB_SHA} on ${GITHUB_REF_NAME}; APK run ${GITHUB_RUN_ID}; qualified app runtime ${M4_RUN_ID}.
          In-place update over the installed app; it keeps app data, the saved hero and imported assets.

          New in 0.13.89 (from the Thor test of 0.13.88, 2026-11-26):
          - The zone starts again after an update. 0.13.88 changed one of the Primalist's files, and a
            phone that had run 0.13.85 to 0.13.87 with the Primalist held shared server data made
            with the old file. 0.13.88 tried to replace it, refused the Primalist's own files in it
            ("Shared server data tree holds a regular file") and every start ended in the game's
            "Map failed to start". Nothing was lost. 0.13.89 keeps the old data for the 13 folders
            the Primalist does not touch and makes only the two it does.
          - When a zone's preparation fails, the status line names the first failure and not only
            "Earlier Atlas preparation did not complete".
          - The first launch after this update compiles the Primalist's definitions once: allow
            several minutes more for that one start.
          Shown in CI: a Primalist made and saved with the content of 0.13.87, then reopened with
          this version's content on the same kept data (the "update" run; no CI run had updated
          before). Not shown: the phone's exact state (one tree of all folders from 0.13.85, half
          opened by 0.13.88's failed start), which is covered by unit tests on the real staging code.
          From 0.13.88 (not yet seen on the Thor past the character list):
          - A saved game that holds a Primalist opens again. In 0.13.87 (and before) the saved
            heroes were checked before the Primalist's class name was known to the check, so
            every launch stopped at "Character attribute is absent from the accepted mapping:
            ents.class" (with or without "Start mission maps"). Nothing was changed in the saved game.
          - A hero made in the character list: the launch now ends "Session finished" (0.13.87
            saved and proved the hero, then reported the session as failed), and Show FPS and
            the 10 / 30 / 60 buttons work for that hero.
          - The Primalist's icon shows in the character creator's archetype list (its
            definition named the picture in a way only the in-game windows understood). The
            large picture beside the list is still missing; no such art exists.
          Shown in CI: a Primalist is created, saved and reopened, and its icon is in the
          creator's archetype list. Not shown: anything on Android.
          From 0.13.87 (on the Thor: a second hero was made beside the first and saved):
          several heroes in one account.
          - "Play" opens the game's own character list. Choose any saved hero and Enter Game,
            or make a new hero in an empty slot. There is no "Switch hero slot" step.
          - The zone of the hero you played last is prepared while the game starts. If you
            enter with another hero, or with a new one, its own zone is started then (a new
            hero's zone is its starting zone; no hero is moved to another zone).
          - A hero made from the character list is saved and proved like a first hero; the
            other heroes of the account are checked to be unchanged.
          - A hero whose creation was interrupted before its first zone started is removed at
            the next "Play" (it has no class or costume and the game cannot enter it); the
            report keeps a copy of its rows.
          - Not supported: deleting a hero in the character list (the session stops; nothing is
            lost, but do not do it), and two heroes in one launch (Finish, then Play again).
          - The two saved games of 0.13.85 (the second hero slot) stay separate and both keep
            working: Setup, "Swap to the other saved game".
          Shown in CI: a second hero made from the character list during "Play", saved, and a
          later launch entered with the first hero while the second was the expected one. Not
          shown: anything on Android (the app side is unit-tested only), a villain or Praetorian
          second hero, more than two heroes.
          From 0.13.86 (navigation with mission maps still unseen on the Thor):
          - With "Start mission maps" ticked the zones keep their navigation data (in 0.13.85
            every zone's navigation map was refused; one zone server took six minutes).
          - The Primalist has an archetype icon.
          - A first launch with the Primalist or "Unlock all content" prepares about 10,700
            files, not 128,765, and keeps the other setting's server data.
          - A launch is no longer marked failed when the hero slotted an enhancement and then
            travelled to another zone.
          - Plain status words in the menu; "Show test details and tools" on the Setup tab
            brings back the check wording, counters, log and test buttons. Show FPS and the
            10 / 30 / 60 FPS buttons are at the top of the Options tab. "Play", "Finish".
          - Free memory is recorded every 30 seconds and kept across a stop by Android.
          From 0.13.85 (on the Thor: the Primalist was created and played; the unlocks worked):
          - Test option "Unlock all content": the one local account owns every store product and
            every veteran (loyalty) reward, is a VIP, and has every pack and archetype access bit.
            Thirteen developer test powers stay locked. Untick it and the locks return; what a
            hero already took stays.
          - Test option "Primalist archetype": the unfinished shapeshifting melee archetype, from
            the definition files the owner supplied. Its name is added to the saved game's
            database on the first launch with the option, at the end of the list. From then on
            the archetype stays on whatever the box says, and versions before 0.13.85 no longer
            open that saved game. Known gaps: no selection screenshots, no ancillary power
            pools, and the balance was never shipped by the original developers.
          - A second saved game: Setup, "Swap to the other saved game" (was "Switch hero slot").
          Both options need "Fast server".
          From 0.13.84 (not yet on the Thor when this was built; missions):
          - Test option, off by default: "Start mission maps". With it a mission door (or a
            mission the game sends you into) starts the mission's map like a zone: the zone you
            came from stays loaded for the way out, and a loaded spare zone server takes the
            mission if one is waiting. Without it a mission map is refused as before.
            Shown in CI: the game asked for a level 1 office mission's map, the map was started,
            the game loaded it, and the hero left it for the zone and saved. Not known before
            the Thor: enemies and objectives, a mission entered by its door, and the mission
            files in the shared zone data (CI has no zone asset pack). Mission maps have no
            navigation data yet, so enemies may stand still. The first session with the option
            prepares the shared zone data once more (a few minutes).
            Leave the mission before you save. A hero saved inside a mission is kept and
            reopens in the zone it entered from, but that launch is reported as failed.
          - A hero whose last session ended inside a mission can be reopened (it could not
            before: the app refused the saved position).
          - A long session can make more trips: up to 128 zone or mission starts and 48 spare
            zone servers per session (32 and 12 before).
          From 0.13.83 (not yet on the Thor when this was built):
          - The menu has three tabs. Play: the commands of a session in the order they are
            used. Options: the launch options. Setup: runtime, asset import, controller,
            storage, test tools. What is happening is shown above the tabs.
          - The options are in four categories. Recommended: the 19 that are ticked in a new
            install. Optional: "Keep the zone you just left loaded" (on the Thor the way back
            took 9-10 s instead of 21-31 s through the spare, and the lowest free memory was
            3.5 GB instead of 4.9 GB). Test: options under test in a version. Experimental:
            five that showed no clear benefit on the Thor.
          - The FPS buttons come alive sooner again: the app acts on the zone server's "the
            hero is in the zone" line within half a second instead of at its next 15-second
            look (9-11 s on the Thor in 0.13.82).
          - A launch is no longer marked failed because the hero gained enhancements in play.
          From 0.13.82 (confirmed on the Thor): citizens have names; the FPS buttons no longer
          wait 40-60 s and nothing pauses when they come alive; "Finish zone loading while the
          game loads the zone" is on by default; "Keep prepared zone object files" stays
          experimental (1-2 s gained per zone load, about 5 s lost on a first visit).
          From 0.13.81:
          - A trip starts sooner: the app looks for the game's request to start a zone twice
            a second instead of every five seconds.
          From 0.13.80 (from the Thor test of 0.13.79, 2026-11-21):
          - A first visit no longer waits for the zone's navigation map: the app prepares the
            navigation maps of every zone while a loaded spare waits, and stops at once when
            you travel or save. A map that is not prepared yet is prepared in about 10 s
            instead of 35 s.
          - Visiting a new zone no longer makes the app check every other zone's navigation
            map in full again in the next launch.
          - The game's log says where its group-file loading time goes (one line per zone load).
          From 0.13.79:
          - "Keep a spare zone server loaded for travel" is a recommended option, on by
            default.
          - "Faster number emulation in zone servers", on by default. On the Thor it made no
            measurable difference to an ordinary zone start; it shortens the one-time
            preparation of a zone's collision meshes (2 s instead of 10 s for Mercy Island).
          - The game's log keeps the stages of its own zone load: 5.5-6.8 s of its 7-8 s go to
            loading the zone's group files.
          From 0.13.78:
          - Fast server: after loading a map, the zone server no longer reads a small bounds
            file for each of about 500 library files (23-29 ms on the Thor; 1.8 s before the
            change in CI).
          From 0.13.76 (from the Thor test of 0.13.75, 2026-11-19):
          - The options list starts with a line that says whether every option is at its
            recommended setting and names the ones that are not, and a button "Restore
            recommended options". The four 0.13.75 test launches ran with "Do not monitor
            ordinary socket traffic" left unticked by an earlier test; that halves the frame rate.
          - A spare zone server also takes a trip whose start options differ from its own only
            by the game's "-transient" option, which has no effect on these servers.
          Confirmed on the Thor in 0.13.75: a zone server started in 55-76 s (about 150 s in
          0.13.73) with the object library list trusted, the collision meshes read back from a
          file, and animations loaded on first use; no animation or collision problems were seen.
          From 0.13.74: zone servers load an animation when a character first uses it ("Load zone
          server animations when first used"), and Wine's server remembers where folders are
          ("Remember folder locations in the Wine server"). In CI a zone server start fell from
          95 s to 57 s; untick either one if a launch fails or characters stop animating.
          From 0.13.73 (confirmed on the Thor: 60 frames a second at the cap): "Use performance
          graphics" reaches the ARM64 client, and "Do not monitor ordinary socket traffic" keeps
          the display server's frames out of the system-call monitor (the frame rate halves
          without it).
          From 0.13.70-72: Save after travelling is confirmed; "Fast server" and "Lighter
          system-call monitor" are on by default, each with a tick box to go back; a zone's
          navigation map check is skipped when its folders are unchanged.
          The second PRoot build's source, build receipt and licence files are in the APK under
          assets/proot-ioctl/ (PRoot: GPL-2.0-or-later; talloc: LGPL-3.0-or-later). The 0.13.36
          PRoot program is still in the APK, byte for byte.
          Other experiment, off by default: "Draw on the game's own thread (frame rate experiment)".
          The navigation map pack is unchanged (${pack}); an imported pack stays imported.
          Unchanged: any character name the game accepts, one hero per saved game; every zone can
          start; at most two zone servers (three with the optional one); supergroup bases are not served; the full-window view, gear button
          and controller.
          Test sheet: THOR-TEST-0.13.89.md.
