name: ArmPort build

# COH-ArmPort: build the original client code as ARM64 Windows with llvm-mingw
# and run test programs under the Android app's own ARM64 Wine 10 runtime.
on:
  workflow_dispatch:
  push:
    branches: ['armport/**', 'COH-ArmPort']
    paths:
      - 'armport/**'
      - '!armport/survey/**'
      - '!armport/shaders/**'
      - '!armport/*.md'
      - '.github/workflows/armport-build.yml'
  pull_request:
    branches: ['COH-ArmPort']
    paths:
      - 'armport/**'
      - '!armport/survey/**'
      - '!armport/shaders/**'
      - '!armport/*.md'
      - '.github/workflows/armport-build.yml'

permissions:
  contents: read

env:
  # Same llvm-mingw release the app's Wine runtime is built with.
  LLVM_MINGW: '20250910'
  LLVM_MINGW_SHA256: '175f344e3db2e11b3d53f4f828ae7b5f0073a4d239b9600fa023ef4b90eb5a7e'
  # Two compiler processes, including nested ExternalProject/CPM builds,
  # matching the project's bounded build-host memory rule.
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  WINEDEBUG: '-all'
  WINEDLLOVERRIDES: 'mscoree,mshtml='

jobs:
  assets:
    # The reviewed client asset bundle (fonts, UI textures, models) the other
    # runtime workflows use. It is in an unpublished draft release, which the
    # workflow token can read only with contents: write; that permission is
    # limited to this job, which only downloads and caches the archive.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /tools/fetch_runtime_asset_bundle.py
            /assets/reference-inputs-receipt.json
          sparse-checkout-cone-mode: false
          lfs: false
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reference-assets.zip
          key: armport-reference-assets-28b4aa8f0b3a71287e9a596df23097722bd71db9ddb9a5a906b5af9d6152cc07
      - name: Retrieve the reviewed asset ZIP
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fetch_runtime_asset_bundle.py --receipt assets/reference-inputs-receipt.json \
            --output "$RUNNER_TEMP/reference-assets.zip" --release-asset-id 588984151

  libraries:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /armport/
            /upstream/ouroboros/
            !/upstream/ouroboros/data/
            /upstream/i24/data/defs/ui/bodyparts.bp
            /native-android/engine/entities/qualification/costume-export-20261017/exact-client-dictionary-bins.zip
            /android/runtime-lock.json
            /.github/
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Install llvm-mingw (aarch64 host)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW}/llvm-mingw-${LLVM_MINGW}-ucrt-ubuntu-22.04-aarch64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "$RUNNER_TEMP/llvm.tar.xz" --strip-components=1 -C /opt/llvm-mingw
          /opt/llvm-mingw/bin/aarch64-w64-mingw32-clang --version | head -1

      - name: Install the app's ARM64 Wine runtime
        run: |
          url=$(python3 -c "import json;print(json.load(open('android/runtime-lock.json'))['wine']['url'])")
          sha=$(python3 -c "import json;print(json.load(open('android/runtime-lock.json'))['wine']['sha256'])")
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wine.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/wine.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/wine
          sudo tar -xzf "$RUNNER_TEMP/wine.tar.gz" -C /opt/wine
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build \
            libfreetype6 libfontconfig1 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 \
            libxfixes3 libxcursor1 libxinerama1 libxxf86vm1 libgnutls30t64 libunwind8 libgl1
          /opt/wine/bin/wine --version
          echo "WINEPREFIX=$RUNNER_TEMP/wineprefix" >> "$GITHUB_ENV"

      - name: Prepare patched source
        run: python3 armport/scripts/prepare.py --out "$RUNNER_TEMP/armport"

      - name: Configure
        env:
          COH_LLVM_MINGW: /opt/llvm-mingw
          COH_WINE: /opt/wine/bin/wine
        run: |
          cmake -S "$RUNNER_TEMP/armport/src" -B "$RUNNER_TEMP/armport/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/armport/cmake/aarch64-w64-mingw32.cmake" \
            -DCOX_ARMPORT_TESTS_DIR="$GITHUB_WORKSPACE/armport/tests" 2>&1 | tail -40

      - name: Build UtilitiesLib, test program and precise floating-point check
        run: |
          cmake --build "$RUNNER_TEMP/armport/build" --target UtilitiesLib armport_bodyparts verify_precise_floating_point \
            armport_address_space_laa armport_address_space_nolaa \
            -- -k 0 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Run the M1 test under ARM64 Wine
        run: |
          cd "$RUNNER_TEMP"
          unzip -o -q "$GITHUB_WORKSPACE/native-android/engine/entities/qualification/costume-export-20261017/exact-client-dictionary-bins.zip" data/bin/BodyParts.bin
          cp "$GITHUB_WORKSPACE/upstream/i24/data/defs/ui/bodyparts.bp" .
          exe="$RUNNER_TEMP/armport/build/bin/armport_bodyparts.exe"
          file "$exe"
          set +e
          /opt/wine/bin/wine "$exe" "$(/opt/wine/bin/winepath -w bodyparts.bp)" \
            "$(/opt/wine/bin/winepath -w data/bin/BodyParts.bin)" > result.json 2> stderr.txt
          rc=$?
          set -e
          cat result.json; tail -20 stderr.txt
          echo "::notice title=ArmPort M1 bodyparts (exit $rc)::$(head -c 900 result.json)"
          exit $rc

      - name: Address space under ARM64 Wine (large-address-aware on and off)
        run: |
          for v in laa nolaa; do
            out=$(/opt/wine/bin/wine "$RUNNER_TEMP/armport/build/bin/armport_address_space_$v.exe" 2>/dev/null | tr -d '\r')
            echo "$out"
            echo "::notice title=ArmPort address space ($v)::$out"
          done

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|undefined (reference|symbol)|>>> referenced by" "$RUNNER_TEMP/build.log" | sed 's#.*/armport/src/##' | sort | uniq -c | sort -rn | head -40 > errors.txt || true
          cat errors.txt
          i=0
          while IFS= read -r chunk; do
            echo "::warning title=ArmPort build errors $i::$chunk"
            i=$((i+1))
          done < <(awk 'NR%6==1{if(buf)print buf;buf=$0;next}{buf=buf"%0A"$0}END{if(buf)print buf}' errors.txt | head -8)

  client:
    # M2: compile and link CityOfHeroes.exe for ARM64 Windows. Release is the
    # client that ships; OptDebug (non-FINAL) is the configuration upstream
    # uses to build the data bins (-createbins), which FINAL builds cannot do.
    strategy:
      fail-fast: false
      matrix:
        config: [Release, OptDebug]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /armport/
            /upstream/ouroboros/
            !/upstream/ouroboros/data/
            /.github/
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Install llvm-mingw (aarch64 host)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW}/llvm-mingw-${LLVM_MINGW}-ucrt-ubuntu-22.04-aarch64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "$RUNNER_TEMP/llvm.tar.xz" --strip-components=1 -C /opt/llvm-mingw
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      # The linked client is cached by its build inputs, so runtime-only changes
      # (smoke run, data) do not rebuild it.
      - name: Restore a client built from the same inputs
        id: exe-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/client-bin
          key: armport-client-${{ matrix.config }}-${{ env.LLVM_MINGW }}-${{ hashFiles('armport/patches/**', 'armport/standins/**', 'armport/cmake/**', 'armport/scripts/prepare.py', 'upstream/ouroboros/**') }}

      - name: Prepare patched source
        if: steps.exe-cache.outputs.cache-hit != 'true'
        run: python3 armport/scripts/prepare.py --out "$RUNNER_TEMP/armport"

      - name: Configure
        if: steps.exe-cache.outputs.cache-hit != 'true'
        env:
          COH_LLVM_MINGW: /opt/llvm-mingw
        run: |
          cmake -S "$RUNNER_TEMP/armport/src" -B "$RUNNER_TEMP/armport/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/armport/cmake/aarch64-w64-mingw32.cmake" \
            -DCOX_BUILD_COMMON=ON -DCOX_BUILD_GAME=ON \
            -DCOX_ARMPORT_COMPILE_ONLY=ON \
            -DCOX_ARMPORT_DIR="$GITHUB_WORKSPACE/armport" 2>&1 | tee "$RUNNER_TEMP/configure.log" | tail -40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build CityOfHeroes.exe
        if: steps.exe-cache.outputs.cache-hit != 'true'
        run: |
          cmake --build "$RUNNER_TEMP/armport/build" --target Game -- -k 0 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60
          rc=${PIPESTATUS[0]}
          exe=$(find "$RUNNER_TEMP/armport/build" -name 'CityOfHeroes.exe' | head -1)
          if [ -n "$exe" ]; then
            info="$(file "$exe" | cut -d: -f2) size $(stat -c %s "$exe")"
            echo "::notice title=ArmPort M2 client linked (${{ matrix.config }})::$info"
            [ "$rc" -eq 0 ] && mkdir -p "$RUNNER_TEMP/client-bin" && cp "$exe" "$RUNNER_TEMP/client-bin/"
          fi
          exit $rc

      - name: Add the llvm-mingw runtime DLLs next to the client
        run: cp /opt/llvm-mingw/aarch64-w64-mingw32/bin/libc++.dll /opt/llvm-mingw/aarch64-w64-mingw32/bin/libunwind.dll "$RUNNER_TEMP/client-bin/"

      - uses: actions/upload-artifact@v4
        with:
          name: armport-client-${{ matrix.config }}
          path: ${{ runner.temp }}/client-bin
          retention-days: 7

      - name: Report build errors
        if: failure()
        run: |
          for log in configure.log build.log; do
            [ -f "$RUNNER_TEMP/$log" ] || continue
            {
              grep -A1 "^FAILED:" "$RUNNER_TEMP/$log" | cut -c1-300 | head -20
              grep -E "CMake Error|error:|undefined (reference|symbol)|>>> referenced by|>>> defined at" "$RUNNER_TEMP/$log" \
                | sed 's#.*/armport/src/##' | sort | uniq -c | sort -rn | head -60
            } > "$log.errors.txt" || true
          done
          progress=$(grep -oE "^\[[0-9]+/[0-9]+\]" "$RUNNER_TEMP/build.log" 2>/dev/null | tail -1)
          echo "::notice title=ArmPort M2 build progress::last step $progress"
          cat ./*.errors.txt 2>/dev/null | head -80
          cat ./*.errors.txt 2>/dev/null > errors.txt || true
          echo "::notice title=ArmPort M2 error lines::$(wc -l < errors.txt) distinct"
          i=0
          while IFS= read -r chunk; do
            echo "::warning title=ArmPort client errors $i::$chunk"
            i=$((i+1))
          done < <(awk 'NR%6==1{if(buf)print buf;buf=$0;next}{buf=buf"%0A"$0}END{if(buf)print buf}' errors.txt | head -10)

  client-run1:
    # Build data/bin with the OptDebug client, then run the Release client on
    # it; records the Cg programs the Release client asks for.
    needs: [assets, client]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /armport/
            /upstream/i24/data/
            !/upstream/i24/data/maps/
            /android/runtime-lock.json
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: armport-client-Release
          path: ${{ runner.temp }}/client-bin
      - uses: actions/download-artifact@v4
        with:
          name: armport-client-OptDebug
          path: ${{ runner.temp }}/client-dev
      - name: Restore the reviewed asset ZIP
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reference-assets.zip
          key: armport-reference-assets-28b4aa8f0b3a71287e9a596df23097722bd71db9ddb9a5a906b5af9d6152cc07
          fail-on-cache-miss: true
      - name: Unpack client assets
        run: |
          echo "28b4aa8f0b3a71287e9a596df23097722bd71db9ddb9a5a906b5af9d6152cc07  $RUNNER_TEMP/reference-assets.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/assets" && unzip -q "$RUNNER_TEMP/reference-assets.zip" -d "$RUNNER_TEMP/assets"
          # Use the data root inside the archive if it has one.
          for sub in data assets; do
            if [ -d "$RUNNER_TEMP/assets/$sub" ]; then mv "$RUNNER_TEMP/assets" "$RUNNER_TEMP/assets-zip" && mv "$RUNNER_TEMP/assets-zip/$sub" "$RUNNER_TEMP/assets"; break; fi
          done
          echo "::notice title=ArmPort client assets::$(ls "$RUNNER_TEMP/assets" | tr '\n' ' ')"
      - name: Install the app's ARM64 Wine runtime, Xvfb and Mesa
        run: armport/scripts/install_wine_runtime.sh
      - name: Install llvm-mingw (for llvm-symbolizer)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW}/llvm-mingw-${LLVM_MINGW}-ucrt-ubuntu-22.04-aarch64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "$RUNNER_TEMP/llvm.tar.xz" --strip-components=1 -C /opt/llvm-mingw
      - name: Create bins (OptDebug) and run the Release client
        run: |
          python3 armport/scripts/smoke_run.py --build "$RUNNER_TEMP/client-bin" --data upstream/i24/data --data "$RUNNER_TEMP/assets" \
            --runtime "$RUNNER_TEMP/runtime" --wine /opt/wine/bin --llvm-mingw /opt/llvm-mingw \
            --createbins --createbins-build "$RUNNER_TEMP/client-dev" --bins-out "$RUNNER_TEMP/client-bins/bin" \
            --requests-out "$RUNNER_TEMP/cg-requests"
      - name: Export the last screen
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/screen.jpg" ] && python3 armport/scripts/screen_export.py "$RUNNER_TEMP/screen.jpg" "ArmPort screen" || echo "no screen"
      - uses: actions/upload-artifact@v4
        with:
          name: armport-client-bins
          path: ${{ runner.temp }}/client-bins
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: armport-cg-requests
          path: ${{ runner.temp }}/cg-requests
          if-no-files-found: ignore
          retention-days: 7

  cg-precompile:
    # Compile the Cg programs the client asked for with the original cgc.exe.
    needs: client-run1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            armport/shaders
            upstream/ouroboros/3rdparty/cg
            upstream/i24/data/shaders
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: armport-cg-requests
          path: cg-requests
        continue-on-error: true
      - name: Compile requested programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cg-requests | Out-Null
          python armport/shaders/compile_requests.py `
            --cgc upstream/ouroboros/3rdparty/cg/bin/cgc.exe `
            --shaders upstream/i24/data/shaders `
            --requests cg-requests --out cg-arb
      - uses: actions/upload-artifact@v4
        with:
          name: armport-cg-arb
          path: cg-arb
          retention-days: 7

  client-run:
    # Run the Release client with the bins and the precompiled ARB programs.
    needs: [assets, client, client-run1, cg-precompile]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /armport/
            /upstream/i24/data/
            !/upstream/i24/data/maps/
            /android/runtime-lock.json
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: armport-client-Release
          path: ${{ runner.temp }}/client-bin
      - uses: actions/download-artifact@v4
        with:
          name: armport-cg-arb
          path: ${{ runner.temp }}/cg-arb
      - uses: actions/download-artifact@v4
        with:
          name: armport-client-bins
          path: ${{ runner.temp }}/client-bins
        continue-on-error: true
      - name: Restore the reviewed asset ZIP
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reference-assets.zip
          key: armport-reference-assets-28b4aa8f0b3a71287e9a596df23097722bd71db9ddb9a5a906b5af9d6152cc07
          fail-on-cache-miss: true
      - name: Unpack client assets
        run: |
          echo "28b4aa8f0b3a71287e9a596df23097722bd71db9ddb9a5a906b5af9d6152cc07  $RUNNER_TEMP/reference-assets.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/assets" && unzip -q "$RUNNER_TEMP/reference-assets.zip" -d "$RUNNER_TEMP/assets"
          # Use the data root inside the archive if it has one.
          for sub in data assets; do
            if [ -d "$RUNNER_TEMP/assets/$sub" ]; then mv "$RUNNER_TEMP/assets" "$RUNNER_TEMP/assets-zip" && mv "$RUNNER_TEMP/assets-zip/$sub" "$RUNNER_TEMP/assets"; break; fi
          done
          echo "::notice title=ArmPort client assets::$(ls "$RUNNER_TEMP/assets" | tr '\n' ' ')"
      - name: Install the app's ARM64 Wine runtime, Xvfb and Mesa
        run: armport/scripts/install_wine_runtime.sh
      - name: Run CityOfHeroes.exe with bins and precompiled Cg programs
        run: |
          mkdir -p "$RUNNER_TEMP/client-bins"
          python3 armport/scripts/smoke_run.py --build "$RUNNER_TEMP/client-bin" \
            --data upstream/i24/data --data "$RUNNER_TEMP/assets" --data "$RUNNER_TEMP/client-bins" \
            --runtime "$RUNNER_TEMP/runtime" --wine /opt/wine/bin --cg-dir "$RUNNER_TEMP/cg-arb" \
            --requests-out "$RUNNER_TEMP/cg-requests-2"
      - name: Export the last screen
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/screen.jpg" ] && python3 armport/scripts/screen_export.py "$RUNNER_TEMP/screen.jpg" "ArmPort screen" || echo "no screen"
