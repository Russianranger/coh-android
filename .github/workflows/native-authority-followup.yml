name: Native dictionary refinements and original shard activation
on:
  push:
    branches: [native-android]
    paths: [.github/workflows/native-authority-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-authority-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refinement-contracts:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[authority-followup]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install only new source oracle dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ libssl-dev zlib1g-dev
      - name: Fetch only historical source identities required by retained binary admission
        run: git fetch --depth=1 --no-tags origin 8f4117e154fa7d9d9a8eb3f4f6b11bd50ab1c919 28fe37cc2432db4adbfe047bd07a1e738d6aa754
      - name: Reuse exact successful LOD and gameplay-ID receipts from the failed enclosing job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import gzip,hashlib,json,pathlib,posixpath,subprocess
          import zipfile
          output=pathlib.Path('out/authority-followup/source');output.mkdir(parents=True)
          archive=output/'retained-source.zip'
          with archive.open('xb') as stream:subprocess.run(['gh','api','repos/Russianranger/coh-android/actions/artifacts/12113568787/zip'],stdout=stream,check=True,timeout=120)
          assert archive.stat().st_size==16349 and hashlib.sha256(archive.read_bytes()).hexdigest()=='04a42b9b430b8adab280f2a7a14090c1ca0c5c3b836890727b8ddff668377311'
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())=={'lod-cache.json','power-ids.json.gz'} and z.testzip() is None
              for name in z.namelist():
                  raw=z.read(name);proof=json.loads(gzip.decompress(raw) if name.endswith('.gz') else raw)
                  assert proof['passed'] is True
                  for path,sha in proof['source_sha256'].items():
                      normalized=posixpath.normpath(path);assert not normalized.startswith(('/','../'))
                      body=pathlib.Path(normalized).read_bytes();assert hashlib.sha256(body).hexdigest()==sha
                  (output/name).write_bytes(raw)
          archive.unlink()
          print('Retained exact successful LOD and ID results; unchanged source verified without repeating either qualifier')
          PYCODE
      - name: Execute only remaining service and private-supervisor admission tests
        run: |
          python3 -m unittest discover -s native-android/engine/auth-interop/deployment -p test_db_shard_activation.py -v
          python3 -m unittest discover -s native-android/engine/scenecatalog-server -p test_admit_groups_capture.py -v
          python3 native-android/engine/scenecatalog-server/test_capture_groups_transaction.py --fixture native-android/combined-client/diagnostics/primary-authority-20261017/unit-groups-fixture.cohgtx --output out/authority-followup/source/private-supervisor.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authority-followup-source-${{ github.sha }}
          path: out/authority-followup/source/
          if-no-files-found: error
          retention-days: 90
  actual-original-auth-db-registration:
    needs: refinement-contracts
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Preserve exact original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reuse exact accepted corrected AuthServer without recompilation or account tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,stat,subprocess,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']);archive=root/'exact-auth-candidate.zip'
          with archive.open('xb') as stream:subprocess.run(['gh','api','repos/Russianranger/coh-android/actions/artifacts/12085517046/zip'],stdout=stream,check=True,timeout=180)
          assert archive.stat().st_size==427525 and hashlib.sha256(archive.read_bytes()).hexdigest()=='da7fa3172867eabd9a652d36a4545cb78e91983123f85d894d18a9b3bac8d04d'
          out=root/'auth-candidate';out.mkdir()
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist();assert len(infos)<=128 and len({i.filename for i in infos})==len(infos) and sum(i.file_size for i in infos)<=8*1024**2 and z.testzip() is None
              for info in infos:
                  path=pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename and ':' not in info.filename and not stat.S_ISLNK(info.external_attr>>16)
              z.extractall(out)
          archive.unlink()
          PY
      - name: Observe original AuthServer DbServer registration in owned disposable SQL namespace
        run: |
          python native-android/engine/auth-interop/deployment/hosted_db_shard_activation.py --source-root . --expected-commit $env:GITHUB_SHA --auth-success-archive native-android/engine/auth-interop/evidence/auth-success-38996587760/artifact.zip --auth-candidate-stage "$env:RUNNER_TEMP/auth-candidate" --output "$env:RUNNER_TEMP/db-shard-activation"
          if ($LASTEXITCODE -ne 0) { throw 'Original interserver activation did not qualify; retain refusal and cleanup receipts' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-original-auth-db-registration-${{ github.sha }}
          path: ${{ runner.temp }}/db-shard-activation/
          if-no-files-found: error
          retention-days: 90
