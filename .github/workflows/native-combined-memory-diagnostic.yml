name: Native Combined 0.1.10 memory diagnostic candidate
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '1'
jobs:
  package:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Admit exact current candidate raw and committed qualification inputs
      run: |
        python3 - <<'PYADMIT'
        import hashlib,json,os,pathlib,subprocess
        if not __debug__ or os.environ.get('PYTHONOPTIMIZE'):raise ValueError('OPTIMIZED_SOURCE_GATE')
        assert os.environ['GITHUB_REPOSITORY']=='Russianranger/coh-android' and os.environ['GITHUB_REF']=='refs/heads/native-android'
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert head==os.environ['GITHUB_SHA']
        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no']).strip()
        root=pathlib.Path.cwd().resolve();pins={}
        scopes=['native-android/combined-client','native-android/engine','native-android/protocol','native-android/src','native-android/include','.github/workflows/native-combined-client.yml','.github/workflows/native-combined-memory-diagnostic.yml']
        for name in subprocess.check_output(['git','ls-files','-z','--',*scopes]).decode().split('\0'):
            if not name or any(part in ('diagnostics','qualification','evidence') for part in pathlib.Path(name).parts):continue
            path=root/name
            assert path.resolve()==path and path.is_file() and not path.is_symlink()
            raw=path.read_bytes()
            assert subprocess.check_output(['git','show',head+':'+name])==raw
            pins[name]=hashlib.sha256(raw).hexdigest()
        assert pins and subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
        output=pathlib.Path(os.environ['RUNNER_TEMP'])/'combined-memory-source-admission.json'
        with output.open('x') as stream:
            json.dump({'schema':'coh-combined-memory-candidate-source-v1','passed':True,'source_revision':head,'reviewed_raw_and_committed_source_sha256':pins,'complete_compiler_dependency_closure_claimed':False,'historical_qualifier_mains_replayed':False,'APK_executed':False,'world_authority':False},stream,indent=2,sort_keys=True)
            stream.write('\n')
        PYADMIT
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install the existing pinned Android build components
      run: |
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev
        python3 -m pip install --disable-pip-version-check Pillow==12.3.0
    - name: Reuse qualified crypto and exact accepted scene/runtime metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p native-android/results/combined-memory-diagnostic
        gh api repos/Russianranger/coh-android/actions/artifacts/11980774730/zip > /tmp/combined-crypto.zip
        python3 native-android/combined-client/tools/reuse_crypto.py --archive /tmp/combined-crypto.zip --crypto-root /tmp/combined-crypto --output native-android/results/combined-memory-diagnostic/crypto-reuse.json
        python3 native-android/combined-client/tools/prepare.py --evidence native-android/results/combined-memory-diagnostic/build-inputs.json
        cp "$RUNNER_TEMP/combined-memory-source-admission.json" native-android/results/combined-memory-diagnostic/source-admission.json
    - name: Run the full original source, import and local-session host qualification
      run: |
        python3 native-android/combined-client/tools/host_check.py --output native-android/results/combined-memory-diagnostic/host
        python3 native-android/combined-client/tools/test_fragment_driver.py
    - name: Build, lint and audit the ARM64 Thor test APK
      run: |
        python3 native-android/combined-client/gradle.py --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' -PcohCryptoRoot=/tmp/combined-crypto :app:assembleDebug :app:lintDebug
        cp native-android/combined-client/app/build/outputs/apk/debug/app-debug.apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-arm64.apk
        python3 native-android/combined-client/tools/package_check.py --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-arm64.apk --abi arm64-v8a --require-clean --require-interop --build-profile memory-diagnostic --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --output native-android/results/combined-memory-diagnostic/arm64-package.json
        python3 native-android/combined-client/tools/interop_package_audit.py --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-arm64.apk --abi arm64-v8a --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --output native-android/results/combined-memory-diagnostic/arm64-interop-dso.json
    - name: Build and audit the separate Android 13 emulator APK and peer
      run: |
        python3 native-android/combined-client/gradle.py --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' -PprobeAbis=x86_64 -PcohCryptoRoot=/tmp/combined-crypto :app:assembleDebug :app:lintDebug
        cp native-android/combined-client/app/build/outputs/apk/debug/app-debug.apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-x86_64.apk
        python3 native-android/combined-client/tools/package_check.py --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-x86_64.apk --abi x86_64 --require-clean --require-interop --build-profile memory-diagnostic --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --output native-android/results/combined-memory-diagnostic/x86_64-package.json
        python3 native-android/combined-client/tools/interop_package_audit.py --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-x86_64.apk --abi x86_64 --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --output native-android/results/combined-memory-diagnostic/x86_64-interop-dso.json
        python3 native-android/combined-client/tools/build_interop_peer.py --fragment-compat --ndk "$ANDROID_HOME/ndk/28.2.13676358" --crypto-root /tmp/combined-crypto/x86_64 --output native-android/results/combined-memory-diagnostic/interop-peer
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: combined-memory-diagnostic-packages-${{ github.sha }}
        path: native-android/results/combined-memory-diagnostic/
        if-no-files-found: error
        retention-days: 90
