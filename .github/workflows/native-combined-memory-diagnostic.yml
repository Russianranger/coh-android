      run: |
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        gh api repos/Russianranger/coh-android/actions/artifacts/12159047135/zip > /tmp/combined-previous019.zip
        python3 - <<'PYPIN'
        import hashlib,pathlib
        p=pathlib.Path('/tmp/combined-previous019.zip')
        assert p.stat().st_size==17073074
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='af0aaa0afe0d50cbedb54a7a8ea7dcda4dab3462516a71f5d49051230c9e152a'
