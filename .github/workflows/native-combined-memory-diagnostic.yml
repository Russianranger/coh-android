        for name in subprocess.check_output(['git','ls-files','-z','--',*scopes]).decode().split('\0'):
            if not name or any(part in ('diagnostics','qualification','evidence') for part in pathlib.Path(name).parts):continue
            path=root/name
            assert path.resolve()==path and path.is_file() and not path.is_symlink()
            raw=path.read_bytes()
            assert subprocess.check_output(['git','show',head+':'+name])==raw
            pins[name]=hashlib.sha256(raw).hexdigest()
        assert pins and subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
        output=pathlib.Path(os.environ['RUNNER_TEMP'])/'combined-memory-source-admission.json'
        with output.open('x') as stream:
            json.dump({'schema':'coh-combined-memory-candidate-source-v1','passed':True,'source_revision':head,'reviewed_raw_and_committed_source_sha256':pins,'complete_compiler_dependency_closure_claimed':False,'historical_qualifier_mains_replayed':False,'APK_executed':False,'world_authority':False},stream,indent=2,sort_keys=True)
            stream.write('\n')
        PYADMIT
    - uses: actions/download-artifact@v4
      with:
        name: combined-memory-diagnostic-packages-${{ github.sha }}
        path: native-android/results/combined-memory-diagnostic
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install pinned SDK tools for the separate UI capture test helper
      run: |
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        python3 -m pip install --disable-pip-version-check Pillow==12.3.0
    - name: Fetch the exact external donor for Android SAF import qualification
      run: |
        curl --fail --silent --show-error --location --retry 2 --output /tmp/combined-donor.apk https://github.com/Russianranger/coh-android/releases/download/coh-atlas-gameplay-v0.13.36/COH-Atlas-Gameplay-0.13.36.apk
        echo '14d88da1796d155dc1b98e45ac642c7702ff3286e7ef0f2a0772f8e48693b12f  /tmp/combined-donor.apk' | sha256sum -c -
    - name: Enable hosted Android emulator acceleration
      run: |
        test -c /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Qualify actual import picker, admission and native preview boundaries
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        emulator-build: '16428233'
        channel: stable
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front
          none
        disable-animations: true
        script: python3 native-android/combined-client/tools/emulator_check.py --adb "$ANDROID_HOME/platform-tools/adb" --serial
          emulator-5554 --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-x86_64.apk
          --output native-android/results/combined-memory-diagnostic/android13-framework --donor-apk /tmp/combined-donor.apk
          --ui-peer-binary native-android/results/combined-memory-diagnostic/host/local-android/coh-local-peer-x86_64 --protocol-binary
          native-android/results/combined-memory-diagnostic/host/local-android/coh-local-x86_64 --protocol-receipt native-android/results/combined-memory-diagnostic/host/local-android/android-build.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: combined-memory-diagnostic-android13-framework-${{ github.sha }}
        path: native-android/results/combined-memory-diagnostic/android13-framework/
        if-no-files-found: error
        retention-days: 90
