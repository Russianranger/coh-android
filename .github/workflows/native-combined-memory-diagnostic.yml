    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Prepare the focused framework test
      run: |
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        python3 -m pip install --disable-pip-version-check Pillow==12.3.0
        test -c /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Test new diagnostic JNI, sockets, report and lifecycle on Android 13
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 33
        emulator-build: '16428233'
        channel: stable
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front
          none
        disable-animations: true
        script: python3 native-android/combined-client/tools/fragment_interop_emulator_check.py --adb "$ANDROID_HOME/platform-tools/adb"
          --serial emulator-5554 --apk native-android/results/combined-memory-diagnostic/CoH-Native-Combined-0.1.10-memory-diagnostic-x86_64.apk
          --package-receipt native-android/results/combined-memory-diagnostic/x86_64-package.json --peer native-android/results/combined-memory-diagnostic/interop-peer/coh-initial-interop-peer-x86_64
          --peer-receipt native-android/results/combined-memory-diagnostic/interop-peer/build.json --build-profile memory-diagnostic
