name: Actual original GROUPS and bounded native initial observation
'on':
  push:
    branches: [native-android]
    paths: [.github/workflows/native-live-groups-fixture.yml]
  workflow_dispatch: {}
permissions: {contents: read, actions: read}
concurrency:
  group: native-live-groups-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matching-original-native-observation:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-groups-fixture]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FIXTURE_ARTIFACT_ID: '12117765534'
      FIXTURE_ZIP_BYTES: '580433'
      FIXTURE_ZIP_SHA256: '5ba50e1620a64a0a4be971f6481bb1d1af7e841200873058f58f3e301d0ce45b'
      FIXTURE_RECEIPT_SHA256: 'ecd51a26955f8462e6c1644b065f11fc6d018d39b96633110a36698a4cbf7b51'
      # Independently admitted genuine fresh fixture; no runtime is repeated.
      FIXTURE_RUN_ID: '39074781817'
      FIXTURE_REVISION: 'fd213266f1b6665acece877dabb7dab6663e647c'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify successful original fixture provenance and exact ZIP before extraction
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,stat,subprocess,zipfile
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.geteuid()!=0
          assert os.environ['GITHUB_REPOSITORY']=='Russianranger/coh-android'
          assert os.environ['GITHUB_REF']=='refs/heads/native-android'
          for name in ('FIXTURE_ARTIFACT_ID','FIXTURE_ZIP_BYTES','FIXTURE_RUN_ID'):
              assert re.fullmatch('[1-9][0-9]*',os.environ[name])
          for name in ('FIXTURE_ZIP_SHA256','FIXTURE_RECEIPT_SHA256'):
              assert re.fullmatch('[0-9a-f]{64}',os.environ[name])
          assert re.fullmatch('[0-9a-f]{40}',os.environ['FIXTURE_REVISION'])
          maximum=560*1024**2;size=int(os.environ['FIXTURE_ZIP_BYTES']);assert 0<size<=maximum
          os.umask(0o077)
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs';base.mkdir(mode=0o700)
          def api(suffix):
              return json.loads(subprocess.check_output(['gh','api','repos/Russianranger/coh-android/'+suffix],timeout=60))
          run=api('actions/runs/'+os.environ['FIXTURE_RUN_ID'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['FIXTURE_REVISION'] and run['head_branch']=='native-android'
          assert run['path']=='.github/workflows/native-graphical-fixture.yml'
          assert run['repository']['id']==run['head_repository']['id']==1368730125
          remote=api('actions/artifacts/'+os.environ['FIXTURE_ARTIFACT_ID'])
          assert remote['id']==int(os.environ['FIXTURE_ARTIFACT_ID']) and remote['expired'] is False
          assert remote['name']=='source-created-graphical-fixture-'+os.environ['FIXTURE_REVISION']
          assert remote['size_in_bytes']==size and remote['digest']=='sha256:'+os.environ['FIXTURE_ZIP_SHA256']
          origin=remote['workflow_run'];assert origin['id']==int(os.environ['FIXTURE_RUN_ID'])
          assert origin['head_sha']==os.environ['FIXTURE_REVISION']
          assert origin['repository_id']==origin['head_repository_id']==1368730125
          archive=base/'fixture.zip'
          with archive.open('xb') as output:
              subprocess.run(['gh','api','repos/Russianranger/coh-android/actions/artifacts/'+os.environ['FIXTURE_ARTIFACT_ID']+'/zip'],stdout=output,check=True,timeout=600)
          with archive.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert archive.stat().st_size==size and actual==os.environ['FIXTURE_ZIP_SHA256']
          target=base/'fixture';target.mkdir(mode=0o700)
          expected={'fixture.pgdump','account.txt','original-guest-report.json','external-observer.json',
                    'backup-request.json','backup-receipt.json','fixture-capture.json'}
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist();assert len(infos)==len(expected) and {i.filename for i in infos}==expected
              assert sum(i.file_size for i in infos)<=maximum
              for item in infos:
                  assert item.filename in expected and not item.is_dir() and not item.flag_bits&1
                  assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG)
                  assert 0<item.file_size<=(512*1024**2 if item.filename=='fixture.pgdump' else 16*1024**2)
              for item in infos:
                  with z.open(item) as source,(target/item.filename).open('xb') as output:
                      shutil.copyfileobj(source,output,1024**2)
                  assert (target/item.filename).stat().st_size==item.file_size
          archive.unlink()
          # Only exact fixture test data is retained; no caller supplies a user DB.
          print('Exact successful source fixture artifact admitted for byte-level receipt checks')
          PY
      - name: Admit exact source-created fixture receipt before installing or launching runtime
        run: |
          python3 native-android/engine/scenecatalog-server/admit_graphical_fixture.py --fixture "$RUNNER_TEMP/groups-inputs/fixture" --receipt-sha256 "$FIXTURE_RECEIPT_SHA256" > "$RUNNER_TEMP/groups-inputs/fixture-admission.json"
          python3 - <<'PY'
          import json,os,pathlib,re
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs';value=json.loads((base/'fixture-admission.json').read_bytes())
          assert value['passed'] is True and value['fixture_only'] is True
          assert value['source_generation_admitted'] is False and value['world_authority'] is False
          assert type(value['wire_slot']) is int and value['wire_slot']==0
          assert re.fullmatch('[0-9a-f]{64}',value['database_dump_sha256'])
          assert pathlib.Path(value['database_dump'])==base/'fixture/fixture.pgdump'
          assert pathlib.Path(value['account_file'])==base/'fixture/account.txt'
          for name in ('fixture.pgdump','account.txt'):(base/'fixture'/name).chmod(0o600)
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write('GROUPS_DUMP_SHA256='+value['database_dump_sha256']+'\n')
          PY
      - name: Recover unchanged retained original observer and DbServer donor without compilation
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,stat,subprocess,zipfile
          os.umask(0o077);base=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs'
          specs=[
            (12114435243,39067419736,'83b93ed89775feb51793df6ee3fca7ac2f0d1334',
             'original-live-groups-observer-compile-83b93ed89775feb51793df6ee3fca7ac2f0d1334',3347636,
             'cfe1a5fc58b0390fa28d86922573304044f633cfab1ca60ae6ed2f1dcaade8d7','observer',32*1024**2),
            (11772107531,38302653186,'46904ced3d7efb6218ecf92d9e44ad597d3146d0',
             None,50269915,'9c4ba6faafb1a62cbdd0cda45b435de1ee8358b25dc65ef4842bfa2189b70d3b','donor',64*1024**2)]
          def api(suffix):return json.loads(subprocess.check_output(['gh','api','repos/Russianranger/coh-android/'+suffix],timeout=60))
          for ident,run,revision,name,size,digest,directory,limit in specs:
              remote=api('actions/artifacts/'+str(ident));origin=remote['workflow_run']
              assert remote['id']==ident and remote['expired'] is False and remote['size_in_bytes']==size
              assert remote['digest']=='sha256:'+digest and (name is None or remote['name']==name)
              assert origin['id']==run and origin['head_sha']==revision
              assert origin['repository_id']==origin['head_repository_id']==1368730125
              archive=base/(str(ident)+'.zip')
              with archive.open('xb') as output:
                  subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=600)
              with archive.open('rb') as source:actual=hashlib.file_digest(source,'sha256').hexdigest()
              assert archive.stat().st_size==size and actual==digest
              target=base/directory;target.mkdir(mode=0o700)
              with zipfile.ZipFile(archive) as z:
                  infos=z.infolist();assert 0<len(infos)<=256 and len({i.filename for i in infos})==len(infos)
                  assert sum(i.file_size for i in infos)<=limit
                  for item in infos:
                      path=pathlib.PurePosixPath(item.filename)
                      assert path.as_posix()==item.filename and not path.is_absolute()
                      assert path.parts and all(p not in ('','.','..') for p in path.parts)
                      assert '\\' not in item.filename and ':' not in item.filename
                      assert not item.flag_bits&1 and stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)
                  for item in infos:
                      target_path=target/item.filename
                      if item.is_dir():target_path.mkdir(mode=0o700,parents=True,exist_ok=True);continue
                      target_path.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                      with z.open(item) as source,target_path.open('xb') as output:shutil.copyfileobj(source,output,1024**2)
                      assert target_path.stat().st_size==item.file_size
              archive.unlink()
          PY
      - name: Check unchanged retained original PE against current exact source without building
        run: |
          python3 native-android/engine/scenecatalog-server/admit_groups_capture.py --compile-directory "$RUNNER_TEMP/groups-inputs/observer/groups-compile" --source-root . --compile-receipt-sha256 698da0508b0849f1e5c95f2ea2198f56a6664a6c893b0e33f7243c038491b235
          python3 native-android/engine/scenecatalog-server/test_groups_public_summary.py
      - name: Install x86 hosted runtime with PG18 and source-qualified classic Wine10
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(id -u)" != 0
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg xvfb xauth gcc g++ libssl-dev zlib1g-dev postgresql-common
          # Prevent creation/startup of an unrelated default main cluster.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/coh-groups-pgdg.sources
          sudo apt-get update -qq
          # Exact signed noble-pgdg index exposes this18.6 packaging revision.
          # Pin server, matching client and libpq together, then verify full bytes.
          mkdir -p "$RUNNER_TEMP/groups-pg-packages"
          (
            cd "$RUNNER_TEMP/groups-pg-packages"
            apt-get download postgresql-18:amd64=18.6-1.pgdg24.04+2 postgresql-client-18:amd64=18.6-1.pgdg24.04+2 libpq5:amd64=18.6-1.pgdg24.04+2
            cat > packages.sha256 <<'EOF'
          c0773357df8769abb70e92722196d9b53422d71c0f29a4f39c834b94276cfa3d  postgresql-18_18.6-1.pgdg24.04+2_amd64.deb
          b9d10d99a73bf7aa375be2fe36626c40499cfdf553d0ad174674a88a1b256b43  postgresql-client-18_18.6-1.pgdg24.04+2_amd64.deb
          b487c5ed2ceb9244c6a9d6ae65818ed6707c3c44a2e14488394ae4194c52c53b  libpq5_18.6-1.pgdg24.04+2_amd64.deb
          EOF
            sha256sum -c packages.sha256
            sudo apt-get install -y --no-install-recommends ./*.deb
          )
          test "$(/usr/lib/postgresql/18/bin/postgres --version)" = 'postgres (PostgreSQL) 18.6 (Ubuntu 18.6-1.pgdg24.04+2)'
          mkdir -p "$RUNNER_TEMP/groups-wine-packages"
          curl --fail --silent --show-error --location https://dl.winehq.org/wine-builds/winehq.key -o "$RUNNER_TEMP/groups-wine-packages/winehq.key"
          echo "d965d646defe94b3dfba6d5b4406900ac6c81065428bf9d9303ad7a72ee8d1b8  $RUNNER_TEMP/groups-wine-packages/winehq.key" | sha256sum -c -
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/groups-wine-packages/winehq.key" | awk -F: '$1=="fpr" {print $10; exit}')" = D43F640145369C51D786DDEA76F1A20FF987672F
          gpg --dearmor --output "$RUNNER_TEMP/groups-wine-packages/winehq.gpg" "$RUNNER_TEMP/groups-wine-packages/winehq.key"
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$RUNNER_TEMP/groups-wine-packages/winehq.gpg" /etc/apt/keyrings/coh-groups-winehq.gpg
          echo 'deb [arch=amd64,i386 signed-by=/etc/apt/keyrings/coh-groups-winehq.gpg] https://dl.winehq.org/wine-builds/ubuntu noble main' | sudo tee /etc/apt/sources.list.d/coh-groups-winehq.list
          sudo apt-get update -qq
          cd "$RUNNER_TEMP/groups-wine-packages"
          apt-get download winehq-stable:amd64=10.0.0.0~noble-1 wine-stable:amd64=10.0.0.0~noble-1 wine-stable-amd64:amd64=10.0.0.0~noble-1 wine-stable-i386:i386=10.0.0.0~noble-1
          cat > packages.sha256 <<'EOF'
          794ed19f7fc8319d005c10da60833fd0925e2cd2587355b3b97fafdb9e95d368  winehq-stable_10.0.0.0~noble-1_amd64.deb
          31e6eb2e15ae2e38ef72c9865c0d01da4bc587e554e7db46fe1a75b4420878e1  wine-stable_10.0.0.0~noble-1_amd64.deb
          393d545040fe5c029eadeb31fcea52126714473e6c11b3cd851447b2dcbf1f72  wine-stable-amd64_10.0.0.0~noble-1_amd64.deb
          5ba523409f013b12953f577bc3322aeae599bb16afac66c59ebe2dde7b337bfa  wine-stable-i386_10.0.0.0~noble-1_i386.deb
          EOF
          sha256sum -c packages.sha256
          sudo apt-get install -y --install-recommends ./*.deb
          df -h "$RUNNER_TEMP"
      - name: Record only fixed public pre-runtime tooling facts
        run: |
          mkdir -p out/groups-public
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,re,subprocess
          def version(command,expression):
              value=subprocess.check_output(command,text=True,timeout=15).strip()
              assert re.fullmatch(expression,value);return value
          pg=pathlib.Path('/usr/lib/postgresql/18/bin')
          value={'schema':'coh-groups-public-tooling-v1','orchestration_revision':os.environ['GITHUB_SHA'],
                 'machine':platform.machine(),'wine_version':version(['/opt/wine-stable/bin/wine','--version'],r'wine-10\.0(?: \([^\r\n]{1,120}\))?'),
                 'postgres_version':version([str(pg/'postgres'),'--version'],r'postgres \(PostgreSQL\) 18\.[0-9]+(?: \([^\r\n]{1,120}\))?'),
                 'restore_version':version([str(pg/'pg_restore'),'--version'],r'pg_restore \(PostgreSQL\) 18\.[0-9]+(?: \([^\r\n]{1,120}\))?'),
                 'runtime_started':False,'private_state_included':False}
          assert value['machine']=='x86_64'
          with pathlib.Path('out/groups-public/tooling.json').open('x') as output:json.dump(value,output,indent=2);output.write('\n')
          PY
      - name: Build and qualify only the new nonshipping receiver before large staging
        run: |
          python3 native-android/combined-client/tools/check_local_initial_capture.py --output "$RUNNER_TEMP/groups-inputs/initial-capture" --test --sanitize
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,sys
          sys.path.insert(0,'native-android/engine/scenecatalog-server')
          import capture_groups_transaction as capture
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs/initial-capture'
          receipt=base/'build.json';pin=hashlib.sha256(receipt.read_bytes()).hexdigest()
          raw=json.loads(receipt.read_bytes())
          assert raw['consumed_source_equals_committed_head'] is True
          value=capture.native_input(base/'coh-capture-local-initial',receipt,pin)
          assert value['build_schema']=='coh-local-initial-capture-build-v1'
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as output:output.write('INITIAL_BUILD_SHA256='+pin+'\n')
          print('New receiver committed dependency closure and no-READY/no-completion-ACK role admitted')
          PYCODE
      - name: Prepare original control runtime files without SQL or any capture startup
        run: |
          python3 tools/android/interactive/map_startup_inputs.py --output out/groups-native-inputs --cache out/groups-asset-cache
          PYTHONPATH=tools/android/interactive python3 -c "import qualify_runtime_asset_preflight as p;p.ensure_assets('out/groups-asset-cache')"
          python3 tools/android/atlasgame/prepare_server_fx_control_fixture.py --donor-apk out/groups-native-inputs/COH-Atlas-Gameplay-0.13.31.apk --payloads out/groups-asset-cache/payloads --output out/groups-control
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free>=16*1024**3
          PY
      - name: Inspect seven exact staged default texture bodies without namespace authority
        id: default_headers
        continue-on-error: true
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,signal,subprocess,sys,time
          def owned(command,timeout):
              child=None;passed=False
              try:
                  child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                  stdout,stderr=child.communicate(timeout=timeout)
                  passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2
              except Exception:passed=False
              finally:
                  if child is not None:
                      try:os.killpg(child.pid,signal.SIGTERM)
                      except ProcessLookupError:pass
                      end=time.monotonic()+2
                      while time.monotonic()<end:
                          try:os.killpg(child.pid,0)
                          except ProcessLookupError:break
                          time.sleep(.05)
                      else:
                          try:os.killpg(child.pid,signal.SIGKILL)
                          except ProcessLookupError:pass
                      try:child.wait(timeout=5)
                      except Exception:passed=False
                      try:os.killpg(child.pid,0);passed=False
                      except ProcessLookupError:pass
                      for stream in (child.stdout,child.stderr):
                          if stream is not None:stream.close()
              return passed
          staging=pathlib.Path('out/groups-control').resolve(strict=True)
          payloads=pathlib.Path('out/groups-asset-cache/payloads').resolve(strict=True)
          public=pathlib.Path('out/groups-public').resolve(strict=True)
          pin=hashlib.sha256((staging/'control-fixture.json').read_bytes()).hexdigest()
          command=[sys.executable,'native-android/engine/world-render-adapter/inspect_default_headers.py',
              '--staging-root',str(staging),'--payloads',str(payloads),'--control-fixture-sha256',pin,
              '--output',str(public/'default-headers.json'),'--retain-directory',str(public/'fresh-default-headers')]
          passed=owned(command,600)
          print(json.dumps({'fixed_seven_source_inspection_completed':passed,'world_authority':False}))
          raise SystemExit(0 if passed else 2)
          PYCODE
      - name: Observe one actual original GROUPS and native raw initial transaction in owned private runtime
        run: |
          CONTROL_RUNTIME=$(python3 -c "import json;print(json.load(open('out/groups-control/control-fixture.json'))['runtime_host_path'])")
          xvfb-run -a python3 native-android/engine/scenecatalog-server/capture_groups_transaction.py \
            --runtime "$CONTROL_RUNTIME" --control-fixture out/groups-control/control-fixture.json \
            --db-donor-apk "$RUNNER_TEMP/groups-inputs/donor/COH-Atlas-Gameplay-0.13.34.apk" \
            --compile-directory "$RUNNER_TEMP/groups-inputs/observer/groups-compile" \
            --compile-receipt-sha256 698da0508b0849f1e5c95f2ea2198f56a6664a6c893b0e33f7243c038491b235 \
            --database-dump "$RUNNER_TEMP/groups-inputs/fixture/fixture.pgdump" --database-dump-sha256 "$GROUPS_DUMP_SHA256" \
            --account-file "$RUNNER_TEMP/groups-inputs/fixture/account.txt" --wire-slot 0 \
            --native-capture "$RUNNER_TEMP/groups-inputs/initial-capture/coh-capture-local-initial" \
            --native-build-receipt "$RUNNER_TEMP/groups-inputs/initial-capture/build.json" \
            --native-build-receipt-sha256 "$INITIAL_BUILD_SHA256" \
            --pg-bin /usr/lib/postgresql/18/bin --wine /opt/wine-stable/bin/wine --wineserver /opt/wine-stable/bin/wineserver \
            --work "$RUNNER_TEMP/groups-private-work" --output "$RUNNER_TEMP/groups-private-result" --timeout-seconds 1200
      - name: Verify complete same-envelope associations, admit snapshot and retain only fresh test bodies
        id: source_snapshot
        run: |
          python3 native-android/engine/scenecatalog-server/check_source_snapshot_verifier.py \
            --capture "$RUNNER_TEMP/groups-private-result/source.cohgtx" \
            --native-packet "$RUNNER_TEMP/groups-private-result/native/groups.bin" \
            --work "$RUNNER_TEMP/groups-private-verification" \
            --output "$RUNNER_TEMP/groups-private-verification/verification.json"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,signal,subprocess,sys,time
          private=pathlib.Path(os.environ['RUNNER_TEMP'])
          def sha(path):
              digest=hashlib.sha256()
              with path.open('rb') as stream:
                  while block:=stream.read(65536):digest.update(block)
              return digest.hexdigest()
          # Latch exact fresh outputs inside the same source-owned job. Do not
          # print these private receipt/run/capture/verifier identities.
          result=private/'groups-private-result';verification=private/'groups-private-verification'
          inputs=private/'groups-inputs'
          runtime=json.loads(pathlib.Path('out/groups-control/control-fixture.json').read_bytes())['runtime_host_path']
          command=[sys.executable,'native-android/engine/scenecatalog-server/admit_source_snapshot.py',
              '--private-output',str(result),'--private-work',str(private/'groups-private-work'),
              '--fixture-directory',str(inputs/'fixture'),'--runtime',runtime,
              '--control-fixture','out/groups-control/control-fixture.json',
              '--db-donor-apk',str(inputs/'donor/COH-Atlas-Gameplay-0.13.34.apk'),
              '--compile-directory',str(inputs/'observer/groups-compile'),
              '--native-capture',str(inputs/'initial-capture/coh-capture-local-initial'),
              '--native-build-receipt',str(inputs/'initial-capture/build.json'),
              '--verification',str(verification/'verification.json'),
              '--verifier-executable',str(verification/'build/verify-source-snapshot'),
              '--capture-receipt-sha256',sha(result/'capture-receipt.json'),
              '--run-identity-sha256',sha(result/'run-identity.json'),
              '--fixture-receipt-sha256',os.environ['FIXTURE_RECEIPT_SHA256'],
              '--compile-receipt-sha256','698da0508b0849f1e5c95f2ea2198f56a6664a6c893b0e33f7243c038491b235',
              '--native-build-receipt-sha256',os.environ['INITIAL_BUILD_SHA256'],
              '--verification-sha256',sha(verification/'verification.json'),
              '--output','out/groups-public/source-snapshot.json']
          # Capture the tool's fixed status too: no subprocess exception may
          # serialize a fully expanded private command into the Actions log.
          def owned(command,timeout):
              child=None;passed=False
              try:
                  child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                  stdout,stderr=child.communicate(timeout=timeout)
                  passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2
              except Exception:passed=False
              finally:
                  if child is not None:
                      try:os.killpg(child.pid,signal.SIGTERM)
                      except ProcessLookupError:pass
                      end=time.monotonic()+2
                      while time.monotonic()<end:
                          try:os.killpg(child.pid,0)
                          except ProcessLookupError:break
                          time.sleep(.05)
                      else:
                          try:os.killpg(child.pid,signal.SIGKILL)
                          except ProcessLookupError:pass
                      try:child.wait(timeout=5)
                      except Exception:passed=False
                      try:os.killpg(child.pid,0);passed=False
                      except ProcessLookupError:pass
                      for stream in (child.stdout,child.stderr):
                          if stream is not None:stream.close()
              return passed
          passed=owned(command,900)
          print(json.dumps({'source_snapshot_admission_completed':passed,'world_authority':False}))
          if not passed:raise SystemExit(2)
          # Fresh-only gate repeats the exact complete source admission and
          # copies only the four approved byte-exact source bodies. It launches
          # no new runtime; generic private captures cannot use this export.
          retention=list(command)
          retention[1]='native-android/engine/scenecatalog-server/retain_fresh_source_snapshot.py'
          retention[retention.index('--output')+1]='out/groups-public/fresh-source-snapshot'
          retention+=['--source-admission','out/groups-public/source-snapshot.json',
              '--source-admission-sha256',sha(pathlib.Path('out/groups-public/source-snapshot.json'))]
          retained=owned(retention,1200)
          print(json.dumps({'four_fresh_source_payloads_retained':retained,'world_authority':False}))
          if not retained:raise SystemExit(2)
          initial=list(retention)
          initial[1]='native-android/engine/scenecatalog-server/retain_fresh_initial_observation.py'
          initial[initial.index('--output')+1]='out/groups-public/fresh-initial-observation'
          destination=inputs/'fresh-initial-command.json'
          with os.fdopen(os.open(destination,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w') as output:json.dump(initial,output)
          PYCODE
      - name: Retain optional initial packet only through the fresh fixture export gate
        id: initial_snapshot
        if: steps.source_snapshot.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,signal,subprocess,time
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs/fresh-initial-command.json'
          command=json.loads(path.read_bytes())
          def owned(command,timeout):
              child=None;passed=False
              try:
                  child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                  stdout,stderr=child.communicate(timeout=timeout)
                  passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2
              except Exception:passed=False
              finally:
                  if child is not None:
                      try:os.killpg(child.pid,signal.SIGTERM)
                      except ProcessLookupError:pass
                      end=time.monotonic()+2
                      while time.monotonic()<end:
                          try:os.killpg(child.pid,0)
                          except ProcessLookupError:break
                          time.sleep(.05)
                      else:
                          try:os.killpg(child.pid,signal.SIGKILL)
                          except ProcessLookupError:pass
                      try:child.wait(timeout=5)
                      except Exception:passed=False
                      try:os.killpg(child.pid,0);passed=False
                      except ProcessLookupError:pass
                      for stream in (child.stdout,child.stderr):
                          if stream is not None:stream.close()
              return passed
          retained=owned(command,1200)
          print(json.dumps({'fresh_test_initial_packet_retained':retained,'world_authority':False}))
          raise SystemExit(0 if retained else 2)
          PYCODE
      - name: Extract only fixed public booleans and coarse source-defined failure enum
        if: always()
        run: |
          mkdir -p out/groups-public
          python3 native-android/engine/scenecatalog-server/summarize_groups_capture.py --private-output "$RUNNER_TEMP/groups-private-result" --output out/groups-public/summary.json
