name: Native authentic saved catalog validation
on:
  push:
    branches: [native-android]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-catalog-capture-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.ref == 'refs/heads/native-android' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[catalog-capture-validate]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install host source-oracle prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zlib1g-dev curl unzip
      - name: Install checksum-pinned public Android NDK r28c
        run: |
          curl --fail --silent --show-error --location --retry 2 --output /tmp/catalog-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  /tmp/catalog-ndk.zip' | sha256sum -c -
          unzip -q /tmp/catalog-ndk.zip -d /tmp/catalog-ndk
      - name: Reject mixed or overclaiming capture qualification
        run: python3 -m unittest discover -s native-android/engine/scenecatalog-qualification/tests -p test_capture_android.py -v
      - name: Validate exact capture on host with sanitizers and build ARM64 and x86_64 executables
        run: >-
          python3 native-android/engine/scenecatalog-qualification/capture_android.py build
          --source-root . --archive native-android/corpus/server-catalog/capture-38948147691/evidence.zip
          --ndk /tmp/catalog-ndk/android-ndk-r28c --output native-android/results/authentic-catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authentic-catalog-host-arm64-x86_64
          path: native-android/results/authentic-catalog/
          if-no-files-found: error
          retention-days: 90
  android13:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: native-authentic-catalog-host-arm64-x86_64
          path: native-android/results/authentic-catalog
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Enable hosted Android emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Validate retained authentic catalog on Android 13 x86_64
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/engine/scenecatalog-qualification/capture_android.py run --source-root . --adb "$ANDROID_HOME/platform-tools/adb" --artifacts native-android/results/authentic-catalog --output native-android/results/authentic-catalog-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-authentic-catalog-android13
          path: native-android/results/authentic-catalog-android/
          if-no-files-found: error
          retention-days: 90
