name: Native original persist-newer production
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-body-catalog-prerequisite.yml
      - native-android/engine/body-catalog/persist_newer_provider.py
      - native-android/engine/body-catalog/persist-newer-source-pins.json
      - native-android/engine/body-catalog/test_persist_newer.c
      - native-android/engine/body-catalog/check_persist_newer.py
      - native-android/engine/body-catalog/schema_crc_provider.py
      - native-android/engine/body-catalog/schema-crc-source-pins.json
      - native-android/engine/body-catalog/cryptopp_adler_source.py
      - native-android/engine/body-catalog/binary_read_open_provider.py
      - native-android/engine/body-catalog/binary-read-open-source-pins.json
      - native-android/engine/coh_contracts.h
      - native-android/engine/costume-import/coh_costume_import.h
      - native-android/engine/body-catalog/check_schema_crc.py
      - native-android/engine/body-catalog/qualification/schema-crc-20261019/cryptopp-adler-source.*
      - native-android/engine/entities/qualification/costume-export-20261017/exact-client-dictionary-bins.zip
      - upstream/ouroboros/libs/UtilitiesLib/**
      - upstream/ouroboros/Common/gameData/BodyPart.*
      - upstream/ouroboros/cmake/dependencies/CryptoPP.cmake
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-persist-newer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  persist-newer:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install persist-newer test digest headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Qualify bounded original production cache-header selection
        run: |
          python3 native-android/engine/body-catalog/check_persist_newer.py --sanitize --output "$RUNNER_TEMP/persist-newer-host.json" --evidence-directory "$RUNNER_TEMP/persist-newer-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-persist-newer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/persist-newer-host.json
            ${{ runner.temp }}/persist-newer-evidence/
          if-no-files-found: error
          retention-days: 90
