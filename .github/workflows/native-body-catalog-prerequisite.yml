name: Native original schema checksum
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-body-catalog-prerequisite.yml
      - native-android/engine/body-catalog/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-schema-crc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  schema-crc:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install schema-checksum test digest headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Qualify bounded original schema checksum
        run: |
          python3 native-android/engine/body-catalog/check_schema_crc.py --sanitize --output "$RUNNER_TEMP/schema-crc-host.json" --evidence-directory "$RUNNER_TEMP/schema-crc-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-schema-crc-${{ github.sha }}
          path: |
            ${{ runner.temp }}/schema-crc-host.json
            ${{ runner.temp }}/schema-crc-evidence/
          if-no-files-found: error
          retention-days: 90
