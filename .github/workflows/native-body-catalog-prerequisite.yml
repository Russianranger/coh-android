name: Native body-part loader provenance
on:
  push:
    branches: [native-android]
    paths:
      - .github/workflows/native-body-catalog-prerequisite.yml
      - native-android/engine/body-catalog/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-body-loader-${{ github.ref }}
  cancel-in-progress: false
jobs:
  body-part-loader:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install loader test digest headers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Qualify bounded original body-part cache-hit loader
        run: |
          python3 native-android/engine/body-catalog/check_body_part_loader.py --sanitize --output "$RUNNER_TEMP/body-loader-host.json" --evidence-directory "$RUNNER_TEMP/body-loader-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-body-loader-${{ github.sha }}
          path: |
            ${{ runner.temp }}/body-loader-host.json
            ${{ runner.temp }}/body-loader-evidence/
          if-no-files-found: error
          retention-days: 90
