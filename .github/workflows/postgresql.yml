name: PostgreSQL backend
on:
  workflow_dispatch:
  push:
    paths:
      - 'database/postgresql/**'
      - 'patches/postgresql/**'
      - 'tools/prepare_pg_source.py'
      - 'tools/verify_source.py'
      - '.github/workflows/postgresql.yml'
  pull_request:
    paths:
      - 'database/postgresql/**'
      - 'patches/postgresql/**'
      - 'tools/prepare_pg_source.py'
      - 'tools/verify_source.py'
      - '.github/workflows/postgresql.yml'
permissions:
  contents: read
concurrency:
  group: postgresql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: PostgreSQL and ODBC integration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            database
            patches
            tools
          sparse-checkout-cone-mode: true
      - name: Enable official PostgreSQL packages
        if: matrix.postgres == 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
      - name: Install PostgreSQL and Unicode ODBC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-${{ matrix.postgres }} postgresql-client-${{ matrix.postgres }} unixodbc-dev odbc-postgresql cmake ninja-build
      - name: Build shared-dialect ODBC probe
        run: |
          cmake -S database/postgresql/tests -B out/pg-probe -G Ninja
          cmake --build out/pg-probe
      - name: Persistence and recovery tests
        run: >-
          python3 database/postgresql/tests/run_integration.py
          --bin /usr/lib/postgresql/${{ matrix.postgres }}/bin --probe out/pg-probe/odbc_probe
          --root "$RUNNER_TEMP/coh-pg" --report out/postgresql-integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-${{ matrix.postgres }}-test-evidence
          path: out/postgresql-integration.json
          if-no-files-found: ignore
  dbserver:
    name: Patched Win32 DbServer build
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            upstream/ouroboros
            database
            patches
            tools
            docs/source-manifest.json
            upstream-lock.json
          sparse-checkout-cone-mode: false
      - name: Verify and stage patched source
        run: python tools/prepare_pg_source.py --output out/pg-source
      - name: Configure Win32
        working-directory: out/pg-source
        run: cmake --preset vs2026 "-DPATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe"
      - name: Build DbServer
        working-directory: out/pg-source
        run: cmake --build out/build/vs2026 --config OptDebug --target DbServer --parallel
      - name: Compile Win32 ODBC probe
        run: |
          cmake -S database/postgresql/tests -B out/pg-probe-win32 -G "Visual Studio 18 2026" -A Win32
          cmake --build out/pg-probe-win32 --config Release
      - name: Install pinned 32-bit psqlODBC
        run: |
          $uri = 'https://ftp.postgresql.org/pub/odbc/releases/REL-18_00_0004/psqlodbc_x86.msi'
          $installer = Join-Path $env:RUNNER_TEMP 'psqlodbc_x86.msi'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne '1b1c85f694ecad95fd3a0125a8b071669772bef098366738de48812124896773') { throw 'ODBC installer hash mismatch' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "ODBC installation failed: $($process.ExitCode)" }
      - name: Exercise Win32 ODBC against PostgreSQL
        run: >-
          python database/postgresql/tests/run_integration.py
          --bin "$env:PGBIN" --probe out/pg-probe-win32/Release/odbc_probe.exe
          --root "$env:RUNNER_TEMP/coh-pg" --report out/postgresql-win32-integration.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-win32-development-build
          path: |
            out/pg-source/out/build/vs2026/**/DbServer.exe
            out/pg-source/out/build/vs2026/**/*.dll
            out/pg-source/postgresql-build-input.json
            out/pg-probe-win32/Release/odbc_probe.exe
            out/postgresql-win32-integration.json
          if-no-files-found: error
