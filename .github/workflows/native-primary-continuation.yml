name: Native primary protocol continuation contracts
on:
  push:
    branches: [native-android]
    paths:
      - native-android/engine/scenegraph/**
      - native-android/engine/entities/**
      - native-android/engine/auth-interop/**
      - native-android/engine/continuation/**
      - .github/workflows/native-primary-continuation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-primary-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-and-android-build:
    if: github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install original-source oracle dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev curl unzip
      - name: Install pinned public Android NDK r28c
        run: |
          curl --fail --silent --show-error --location --output /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  /tmp/ndk.zip' | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp/native-primary-ndk
      - name: Check artifact admission and malformed receipts
        run: python3 -m unittest discover -s native-android/engine/continuation/tests -v
      - name: Run original-source oracles and sanitized host suites; build both Android ABI test ELFs
        run: >-
          python3 native-android/engine/continuation/qualify.py
          --source-root . --sanitize --require-clean --workers 3
          --ndk /tmp/native-primary-ndk/android-ndk-r28c
          --output native-android/results/primary-continuation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-primary-continuation-host-arm64-x86_64
          path: native-android/results/primary-continuation/
          if-no-files-found: error
          retention-days: 90
  android13-contract-execution:
    needs: host-and-android-build
    if: github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: native-primary-continuation-host-arm64-x86_64
          path: native-android/results/primary-continuation
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable hosted emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Execute exact standalone contracts on Android 13 x86_64
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/engine/continuation/run_android.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --require-clean --artifacts native-android/results/primary-continuation --output native-android/results/primary-continuation/android-execution/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-primary-continuation-android13-execution
          path: native-android/results/primary-continuation/android-execution/
          if-no-files-found: error
          retention-days: 90
