name: Reuse native Map candidate with explicit fixture generation and warm parity
on:
  push:
    branches: [codex/native-map-prefetch-reuse-036]
    paths:
      - .github/workflows/android-native-map-prefetch-reuse.yml
      - tools/reuse_native_startup_profile.py
      - tools/test_reuse_native_startup_profile.py
      - tools/prepare_native_cg_profile_source.py
      - tools/qualify_native_startup_profile.py
      - tools/prepare_native_startup_reuse_fixture.py
      - tools/test_native_startup_reuse_fixture.py
      - tools/reuse_native_map_prefetch.py
      - tools/test_reuse_native_map_prefetch.py
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: native-map-prefetch-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wine-preload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Recover only the exact successful Windows artifact without rebuilding
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/native-history
          gh api repos/Russianranger/coh-android/actions/runs/38345782437 > out/native-history/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38345782437/jobs > out/native-history/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713 > out/native-history/artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11788852713/zip > out/native-history/artifact.zip
          python3 tools/reuse_native_startup_profile.py --archive out/native-history/artifact.zip \
            --output out/native-profile --run-metadata out/native-history/run.json \
            --jobs-metadata out/native-history/jobs.json --artifact-metadata out/native-history/artifact.json \
            > out/native-history/reuse-admission.json
          python3 tools/test_reuse_native_startup_profile.py --package out/native-profile
          python3 -m unittest discover -s tools -p 'test_native_cg_profile_source.py'
          python3 -m unittest discover -s tools -p 'test_native_startup_profile_source.py'
          python3 -m unittest discover -s tools -p 'test_qualify_native_startup_profile.py'
          python3 -m unittest discover -s tools -p 'test_native_startup_reuse_fixture.py'
      - name: Recover exact successful Map candidate and actual native fixture evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p out/candidate-history
          gh api repos/Russianranger/coh-android/actions/runs/38350813669 > out/candidate-history/run.json
          gh api repos/Russianranger/coh-android/actions/runs/38350813669/jobs > out/candidate-history/jobs.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11790609618 > out/candidate-history/artifact.json
          gh api repos/Russianranger/coh-android/actions/artifacts/11790609618/zip > out/candidate-history/artifact.zip
          python3 tools/reuse_native_map_prefetch.py --archive out/candidate-history/artifact.zip \
            --output out/native-candidate --baseline out/native-profile \
            --run-metadata out/candidate-history/run.json --jobs-metadata out/candidate-history/jobs.json \
            --artifact-metadata out/candidate-history/artifact.json > out/candidate-history/reuse-admission.json
          python3 tools/test_reuse_native_map_prefetch.py --package out/native-candidate --baseline out/native-profile
          python3 -m unittest discover -s tools -p test_package_native_map_prefetch.py
      - name: Admit runner storage and install isolated native tools
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 -c "import shutil; assert shutil.disk_usage('.').free >= 30*1024**3"
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 gcc-mingw-w64-i686 xvfb xauth
      - name: Authenticate unchanged original complete input volumes
        run: |
          python3 tools/android/interactive/map_startup_inputs.py --output out/native-inputs --cache out/asset-cache
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/android/interactive')
          import qualify_runtime_asset_preflight as inputs
          inputs.ensure_assets('out/asset-cache')
          PY
      - name: Prepare disposable complete provider without PostgreSQL or player data
        run: >-
          python3 tools/android/atlasgame/prepare_server_fx_control_fixture.py
          --donor-apk out/native-inputs/COH-Atlas-Gameplay-0.13.31.apk
          --payloads out/asset-cache/payloads --output out/native-control-fixture
      - name: Generate one owned fixture then measure observed baseline and metadata candidate
        run: |
          task_native_runtime=$(python3 -c "import json; print(json.load(open('out/native-control-fixture/control-fixture.json'))['runtime_host_path'])")
          xvfb-run -a python3 tools/qualify_native_startup_profile.py \
            --package out/native-profile --reuse-completed-windows-package --generate-owned-fixture --runtime "$task_native_runtime" \
            --native-prefetch-package out/native-candidate --native-prefetch-commit 47e40d4d586d29e273e31ed4d0d51d160832b89d \
            --control-fixture out/native-control-fixture/control-fixture.json \
            --work out/native-profile-work --output out/native-profile-qualification \
            --repository-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coh-map-prefetch-generated-fixture-Wine-evidence, path: out/native-profile-qualification/, if-no-files-found: warn, retention-days: 90}
      - name: Preserve source attribution and original overall workflow status
        if: always()
        run: rm -f -- out/native-history/artifact.zip out/candidate-history/artifact.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coh-map-prefetch-retained-native-attribution, path: out/native-history/, if-no-files-found: warn, retention-days: 90}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coh-map-prefetch-candidate-native-attribution, path: out/candidate-history/, if-no-files-found: warn, retention-days: 90}
