name: Thor immutable client APK full startup qualification
on:
  push:
    paths:
      - '.github/workflows/android-client-qualification.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-client-qualification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  runtime:
    # GitHub requires write-level repository access to READ unpublished draft assets.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a40250b0032bd05a333514920722ddffa4427730
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coh-game-client-test-apk
          path: out/client
          run-id: 36707839624
          github-token: ${{ github.token }}
      - name: Verify immutable APK and build receipt
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          source = 'a40250b0032bd05a333514920722ddffa4427730'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == source
          root = pathlib.Path('out/client')
          expected = {
              'COH-Game-Client-Test-0.6.0.apk': (370539567, '7ef2ec40931ada23910f2e6125ad0d754049003aba9deb882dbaee4ea6f3d803'),
              'client-apk-build-report.json': (25878, '7bf426d82fde722b25a6b2839b51579aea982c314de4c1152e60e78c3f27201d'),
          }
          for name, (size, digest) in expected.items():
              path = root / name
              assert path.is_file() and not path.is_symlink() and path.stat().st_size == size, name
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest, name
          report = json.loads((root/'client-apk-build-report.json').read_text())
          assert report['repository_commit'] == source
          inputs = {'format': 1, 'scope': 'immutable_apk_full_startup_qualification',
                    'workflow_commit': os.environ['GITHUB_SHA'], 'repository_commit': source,
                    'apk_donor_run_id': 36707839624, 'apk_artifact_id': 11092624222,
                    'apk_sha256': expected['COH-Game-Client-Test-0.6.0.apk'][1],
                    'build_report_sha256': expected['client-apk-build-report.json'][1],
                    'startup_timeout_seconds': 900, 'observation_seconds': 30,
                    'apk_rebuilt': False, 'caches_regenerated': False}
          (root/'qualification-inputs.json').write_text(json.dumps(inputs, indent=2)+'\n')
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: coh-diagnostic-runtime-inputs
          path: out/client-base-runtime
          run-id: 36364550345
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: coh-proot-android-source-and-build
          path: out/client-accepted-proot
          run-id: 36364550345
          github-token: ${{ github.token }}
      - name: Recover exact accepted native runtime source
        run: >-
          python3 tools/android/extract_talloc_source.py
          --assets out/client-base-runtime
          --bundle out/client-accepted-proot/proot-corresponding-sources.tar.gz
          --output out/android/source-cache/talloc-2.4.3.tar.gz
          > out/client/talloc-source-receipt.json
      - name: Install host runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gawk default-jdk-headless
      - name: Build matching native ARM64 PRoot
        run: >-
          python3 tools/android/build_proot.py --target linux-arm64
          --output out/android/native --talloc-archive out/android/source-cache/talloc-2.4.3.tar.gz
      - name: Retrieve the existing reviewed game asset ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_runtime_asset_bundle.py --receipt assets/reference-inputs-receipt.json --output out/client-assets.zip --release-asset-id 588984151
      - name: Observe exact APK graphical client through external private Unix RFB
        run: >-
          python3 tools/android/client/host_smoke.py
          --apk out/client/COH-Game-Client-Test-0.6.0.apk
          --archive out/client-assets.zip
          --build-report out/client/client-apk-build-report.json
          --repository-commit a40250b0032bd05a333514920722ddffa4427730 --proot out/android/native/linux-arm64
          --startup-timeout-seconds 900
          --work out/client-host --evidence out/client-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coh-game-client-test-arm64-evidence
          path: |
            out/client-evidence/
            out/client/qualification-inputs.json
            out/client/talloc-source-receipt.json
            out/android/native/linux-arm64/proot-build-receipt.json
          if-no-files-found: warn
