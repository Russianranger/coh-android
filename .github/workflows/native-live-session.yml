name: Native Android live-session protocol foundations
on:
  push:
    branches: [native-android]
    paths:
      - native-android/engine/auth/**
      - native-android/engine/login/**
      - native-android/engine/live/**
      - native-android/engine/dbclient/**
      - native-android/engine/mapclient/**
      - native-android/engine/network/**
      - native-android/engine/replication/**
      - native-android/engine/session/**
      - native-android/engine/build.py
      - .github/workflows/native-live-session.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-live-session-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-and-arm64:
    if: github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install source-oracle and native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev perl make curl unzip
      - name: Install the pinned public Android NDK
        run: |
          curl --fail --silent --show-error --location --output /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  /tmp/ndk.zip' | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp/native-live-ndk
      - name: Run independent sanitized host contracts and build public crypto and full Android test binaries
        run: |
          python3 native-android/engine/session/qualify_live.py --source-root . --sanitize --ndk /tmp/native-live-ndk/android-ndk-r28c --output native-android/results/live-session --jobs 2 --workers 3 --require-clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-live-session-host-arm64
          path: |
            native-android/results/live-session/
            !native-android/results/live-session/crypto/build/**
          if-no-files-found: error
          retention-days: 90
  android-contract-execution:
    needs: host-and-arm64
    if: github.ref == 'refs/heads/native-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: native-live-session-host-arm64
          path: native-android/results/live-session
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable hosted Android emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Execute public crypto and native TCP/UDP contracts on Android 13
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          emulator-build: '16428233'
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 native-android/engine/session/run_live_android.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --artifacts native-android/results/live-session --output native-android/results/live-session/android-execution/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-live-session-android13-execution
          path: native-android/results/live-session/android-execution/
          if-no-files-found: error
          retention-days: 90
