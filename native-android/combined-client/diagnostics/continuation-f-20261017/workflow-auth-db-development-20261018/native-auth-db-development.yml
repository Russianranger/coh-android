        \        assert origin['repository_id']==origin['head_repository_id']==1368730125\n        assert remote['name']=='original-db-threadname-compile-only-'+revision\n\
        \        run=api('actions/runs/'+str(run_id))\n        assert run['head_sha']==revision and run['head_branch']=='native-android'\n\
        \        assert run['path']==workflow and run['status']=='completed' and run['conclusion']=='success'\n        assert\
        \ run['repository']['id']==run['head_repository']['id']==1368730125\n    archive=base/(directory+'.zip')\n    with\
        \ archive.open('xb') as output:subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=180)\n\
        \    assert archive.stat().st_size==size and hashlib.sha256(archive.read_bytes()).hexdigest()==digest\n    target=base/directory;target.mkdir()\n\
        \    with zipfile.ZipFile(archive) as z:\n        infos=z.infolist();assert 0<len(infos)<=128 and len({i.filename\
        \ for i in infos})==len(infos)\n        assert sum(i.file_size for i in infos)<=32*1024**2 and z.testzip() is None\n\
        \        for item in infos:\n            path=pathlib.PurePosixPath(item.filename)\n            assert path.as_posix()==item.filename\
        \ and not path.is_absolute() and path.parts\n            assert all(p not in ('','.','..') for p in path.parts)\n\
        \            assert '\\\\' not in item.filename and ':' not in item.filename and not item.flag_bits&1\n          \
        \  assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG)\n            assert 0<=item.file_size<=16*1024**2\
        \ and not item.is_dir()\n        for item in infos:\n            destination=target/item.filename;destination.parent.mkdir(parents=True,exist_ok=True)\n\
        \            with z.open(item) as source,destination.open('xb') as output:shutil.copyfileobj(source,output,1024**2)\n\
        \            assert destination.stat().st_size==item.file_size\n    archive.unlink()\nPY\n"
    - name: Recover only exact immutable x64 crypto headers library and ownership manifest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python - <<'PYCRYPTO'\nimport hashlib,json,os,pathlib,re,shutil,stat,subprocess,zipfile\nbase=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        def api(suffix):return json.loads(subprocess.check_output(['gh','api','repos/Russianranger/coh-android/'+suffix],timeout=60))\n\
        ident=12078663003;revision='cacc6273834142cf8c8f902018eb13cb8f9b5271'\nremote=api('actions/artifacts/'+str(ident));origin=remote['workflow_run']\n\
        assert remote['id']==ident and remote['expired'] is False and remote['size_in_bytes']==71999000\nassert remote['name']=='native-original-authserver-encrypted-login'\n\
        assert remote['digest']=='sha256:aa7a1badbeb8926cec15009f7f87ebb797aa2345c0c97a183cd1e23866a3499b'\nassert origin['id']==38974164017\
        \ and origin['head_sha']==revision\nassert origin['repository_id']==origin['head_repository_id']==1368730125\nrun=api('actions/runs/38974164017')\n\
        assert run['status']=='completed' and run['head_sha']==revision and run['head_branch']=='native-android'\nassert run['path']=='.github/workflows/native-auth-login.yml'\n\
        assert run['repository']['id']==run['head_repository']['id']==1368730125\n# Only the immutable crypto subgroup is\
        \ reused, not the old Auth outcome.\narchive=base/'retained-intact.zip'\nwith archive.open('xb') as output:subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=300)\n\
        with archive.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()\nassert archive.stat().st_size==71999000\
        \ and digest=='aa7a1badbeb8926cec15009f7f87ebb797aa2345c0c97a183cd1e23866a3499b'\ntarget=base/'retained-intact';target.mkdir()\n\
        with zipfile.ZipFile(archive) as z:\n    infos=z.infolist();assert 0<len(infos)<=2048 and len({i.filename for i in\
        \ infos})==len(infos)\n    assert sum(i.file_size for i in infos)<=128*1024**2 and z.testzip() is None\n    for item\
        \ in infos:\n        name=item.filename[:-1] if item.is_dir() else item.filename\n        path=pathlib.PurePosixPath(name)\n\
        \        assert path.as_posix()==name and not path.is_absolute() and path.parts\n        assert all(p not in ('','.','..')\
        \ for p in path.parts)\n        assert chr(92) not in name and ':' not in name and not item.flag_bits&1\n        assert\
        \ stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)\n        assert 0<=item.file_size<=64*1024**2\n\
        \    prefix='intact-openssl-reuse/'\n    name=prefix+'manifest.json';manifest=z.read(name)\n    assert len(manifest)==58665\
        \ and hashlib.sha256(manifest).hexdigest()=='1c1c05eb10132e4d1d172d29a04d36311981e6c7023c7ee388348339c460896b'\n \
        \   value=json.loads(manifest)\n    assert value['schema']=='coh-intact-openssl-build-ownership-v1'\n    assert len(value['files'])==384\
        \ and value['total_bytes']==105629748\n    assert value['files']['libcrypto.lib']['sha256']=='95aec97b796992a58f8745e1bbbc6eac634931420f13b0763d2db57537543698'\n\
        \    selected={name:{'bytes':len(manifest),'sha256':hashlib.sha256(manifest).hexdigest()}}\n    for relative,pin in\
        \ value['files'].items():\n        path=pathlib.PurePosixPath(relative)\n        assert path.as_posix()==relative\
        \ and not path.is_absolute() and path.parts\n        assert all(p not in ('','.','..') for p in path.parts) and chr(92)\
        \ not in relative and ':' not in relative\n        assert set(pin)=={'bytes','sha256'} and type(pin['bytes']) is int\
        \ and 0<=pin['bytes']<=64*1024**2\n        assert re.fullmatch('[a-f0-9]{64}',pin['sha256'])\n        selected[prefix+relative]=pin\n\
        \    assert sum(x['bytes'] for x in value['files'].values())==105629748\n    members={i.filename:i for i in infos}\n\
        \    for name,pin in selected.items():\n        item=members[name];assert not item.is_dir() and item.file_size==pin['bytes']\n\
        \        destination=target/name;destination.parent.mkdir(parents=True,exist_ok=True)\n        with z.open(item) as\
        \ source,destination.open('xb') as output:shutil.copyfileobj(source,output,1024**2)\n        with destination.open('rb')\
        \ as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()\n        assert destination.stat().st_size==pin['bytes']\
        \ and actual==pin['sha256']\nassert {p.relative_to(target).as_posix() for p in target.rglob('*') if p.is_file()}==set(selected)\n\
        archive.unlink()\nPYCRYPTO\n"
