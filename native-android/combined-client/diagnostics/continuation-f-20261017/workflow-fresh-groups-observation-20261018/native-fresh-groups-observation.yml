      run: "python3 - <<'PYCODE'\nimport json,os,pathlib,signal,subprocess,time\npath=pathlib.Path(os.environ['RUNNER_TEMP'])/'groups-inputs/fresh-initial-command.json'\n\
        command=json.loads(path.read_bytes())\ndef owned(command,timeout):\n    child=None;passed=False\n    try:\n        child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)\n\
        \        stdout,stderr=child.communicate(timeout=timeout)\n        passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2\n\
        \    except Exception:passed=False\n    finally:\n        if child is not None:\n            try:os.killpg(child.pid,signal.SIGTERM)\n\
        \            except ProcessLookupError:pass\n            end=time.monotonic()+2\n            while time.monotonic()<end:\n \
        \               try:os.killpg(child.pid,0)\n                except ProcessLookupError:break\n                time.sleep(.05)\n\
        \            else:\n                try:os.killpg(child.pid,signal.SIGKILL)\n                except ProcessLookupError:pass\n\
        \            try:child.wait(timeout=5)\n            except Exception:passed=False\n            try:os.killpg(child.pid,0);passed=False\n\
        \            except ProcessLookupError:pass\n            for stream in (child.stdout,child.stderr):\n                if stream\
        \ is not None:stream.close()\n    return passed\nretained=owned(command,1200)\nprint(json.dumps({'fresh_test_initial_packet_retained':retained,'world_authority':False}))\n\
        raise SystemExit(0 if retained else 2)\nPYCODE\n"
    - name: Extract only fixed public booleans and coarse source-defined failure enum
      if: always()
      run: 'mkdir -p out/groups-public

        python3 native-android/engine/scenecatalog-server/summarize_groups_capture.py --private-output "$RUNNER_TEMP/groups-private-result"
        --output out/groups-public/summary.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fresh-profile-groups-public-status-${{ github.sha }}
        path: 'out/groups-public/summary.json

          out/groups-public/tooling.json

          out/groups-public/source-snapshot.json

          '
        if-no-files-found: warn
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: always() && steps.source_snapshot.outcome == 'success'
      with:
        name: admitted-fresh-source-snapshot-${{ github.sha }}
        path: 'out/groups-public/fresh-source-snapshot/catalog.cohcat

          out/groups-public/fresh-source-snapshot/runtime.cohrts

          out/groups-public/fresh-source-snapshot/resources.cohres

          out/groups-public/fresh-source-snapshot/public-bounds.cohrbw

          out/groups-public/fresh-source-snapshot/manifest.json

