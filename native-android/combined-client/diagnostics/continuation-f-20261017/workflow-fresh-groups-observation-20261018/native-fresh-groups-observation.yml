        \    '--fixture-directory',str(inputs/'fixture'),'--runtime',runtime,\n    '--control-fixture','out/groups-control/control-fixture.json',\n\
        \    '--db-donor-apk',str(inputs/'donor/COH-Atlas-Gameplay-0.13.34.apk'),\n    '--compile-directory',str(inputs/'observer/fresh-groups-compile'),\n\
        \    '--native-capture',str(inputs/'initial-capture/coh-capture-local-initial'),\n    '--native-build-receipt',str(inputs/'initial-capture/build.json'),\n\
        \    '--verification',str(verification/'verification.json'),\n    '--verifier-executable',str(verification/'build/verify-source-snapshot'),\n\
        \    '--capture-receipt-sha256',sha(result/'capture-receipt.json'),\n    '--run-identity-sha256',sha(result/'run-identity.json'),\n\
        \    '--fixture-receipt-sha256',os.environ['FIXTURE_RECEIPT_SHA256'],\n    '--compile-receipt-sha256','0daf56e8dcae5d40ab9d5ef08bc09d022eba0a9a609170ce6d1ce867b2ca18c5',\n\
        \    '--native-build-receipt-sha256',os.environ['INITIAL_BUILD_SHA256'],\n    '--verification-sha256',sha(verification/'verification.json'),\n\
        \    '--output','out/groups-public/source-snapshot.json']\n# Capture the tool's fixed status too: no subprocess exception may\n\
        # serialize a fully expanded private command into the Actions log.\ndef owned(command,timeout):\n    child=None;passed=False\n\
        \    try:\n        child=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)\n\
        \        stdout,stderr=child.communicate(timeout=timeout)\n        passed=child.returncode==0 and len(stdout)+len(stderr)<=1024**2\n\
        \    except Exception:passed=False\n    finally:\n        if child is not None:\n            try:os.killpg(child.pid,signal.SIGTERM)\n\
        \            except ProcessLookupError:pass\n            end=time.monotonic()+2\n            while time.monotonic()<end:\n \
