name: Selected-shard grant with bounded failure diagnostics
'on':
  push:
    branches:
    - native-android
    paths:
    - .github/workflows/native-db-threadname-selected-play.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: native-db-threadname-selected-play-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selected-shard-grant:
    if: github.repository == 'Russianranger/coh-android' && github.ref == 'refs/heads/native-android' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message,
      '[db-threadname-selected-play]'))
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
    - name: Preserve exact source line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check only new bounded native failure and after-probe controls
      run: |
        python -m unittest discover -s native-android/engine/auth-interop/deployment -p test_selected_probe_failure.py -v
        if ($LASTEXITCODE -ne 0) { throw 'New failure-observation controls failed' }
    - name: Recover exact accepted AuthServer and independently admitted new DbServer build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python - <<'PY'
        import hashlib,json,os,pathlib,shutil,stat,subprocess,zipfile
        assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
        assert os.environ['GITHUB_REPOSITORY']=='Russianranger/coh-android'
        assert os.environ['GITHUB_REF']=='refs/heads/native-android'
        base=pathlib.Path(os.environ['RUNNER_TEMP'])
        def api(suffix):return json.loads(subprocess.check_output(['gh','api','repos/Russianranger/coh-android/'+suffix],timeout=60))
        specs=[
          (12085517046,427525,'da7fa3172867eabd9a652d36a4545cb78e91983123f85d894d18a9b3bac8d04d','auth-candidate',None,None,None),
          (12118334160,1130748,'8d139b6b229742b9b1274e985c26e1847edca821bcc3836a367dd9e96be1c1c1','db-candidate',39080037562,'2729bfc16c9f757fd850c24a0bc6df366a2e40ab','.github/workflows/native-db-threadname-build.yml')]
        for ident,size,digest,directory,run_id,revision,workflow in specs:
            remote=api('actions/artifacts/'+str(ident))
            assert remote['id']==ident and remote['expired'] is False
            assert remote['size_in_bytes']==size and remote['digest']=='sha256:'+digest
            if run_id is not None:
                origin=remote['workflow_run'];assert origin['id']==run_id and origin['head_sha']==revision
                assert origin['repository_id']==origin['head_repository_id']==1368730125
                assert remote['name']=='original-db-threadname-compile-only-'+revision
                run=api('actions/runs/'+str(run_id))
                assert run['head_sha']==revision and run['head_branch']=='native-android'
                assert run['path']==workflow and run['status']=='completed' and run['conclusion']=='success'
                assert run['repository']['id']==run['head_repository']['id']==1368730125
            archive=base/(directory+'.zip')
            with archive.open('xb') as output:subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=180)
            assert archive.stat().st_size==size and hashlib.sha256(archive.read_bytes()).hexdigest()==digest
            target=base/directory;target.mkdir()
            with zipfile.ZipFile(archive) as z:
                infos=z.infolist();assert 0<len(infos)<=128 and len({i.filename for i in infos})==len(infos)
                assert sum(i.file_size for i in infos)<=32*1024**2 and z.testzip() is None
                for item in infos:
                    path=pathlib.PurePosixPath(item.filename)
                    assert path.as_posix()==item.filename and not path.is_absolute() and path.parts
                    assert all(p not in ('','.','..') for p in path.parts)
                    assert '\\' not in item.filename and ':' not in item.filename and not item.flag_bits&1
                    assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG)
                    assert 0<=item.file_size<=16*1024**2 and not item.is_dir()
                for item in infos:
                    destination=target/item.filename;destination.parent.mkdir(parents=True,exist_ok=True)
                    with z.open(item) as source,destination.open('xb') as output:shutil.copyfileobj(source,output,1024**2)
                    assert destination.stat().st_size==item.file_size
            archive.unlink()
        PY
    - name: Recover only exact immutable x64 crypto headers library and ownership manifest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python - <<'PYCRYPTO'
        import hashlib,json,os,pathlib,re,shutil,stat,subprocess,zipfile
        base=pathlib.Path(os.environ['RUNNER_TEMP'])
        def api(suffix):return json.loads(subprocess.check_output(['gh','api','repos/Russianranger/coh-android/'+suffix],timeout=60))
        ident=12078663003;revision='cacc6273834142cf8c8f902018eb13cb8f9b5271'
        remote=api('actions/artifacts/'+str(ident));origin=remote['workflow_run']
        assert remote['id']==ident and remote['expired'] is False and remote['size_in_bytes']==71999000
        assert remote['name']=='native-original-authserver-encrypted-login'
        assert remote['digest']=='sha256:aa7a1badbeb8926cec15009f7f87ebb797aa2345c0c97a183cd1e23866a3499b'
        assert origin['id']==38974164017 and origin['head_sha']==revision
        assert origin['repository_id']==origin['head_repository_id']==1368730125
        run=api('actions/runs/38974164017')
        assert run['status']=='completed' and run['head_sha']==revision and run['head_branch']=='native-android'
        assert run['path']=='.github/workflows/native-auth-login.yml'
        assert run['repository']['id']==run['head_repository']['id']==1368730125
        # Only the immutable crypto subgroup is reused, not the old Auth outcome.
        archive=base/'retained-intact.zip'
        with archive.open('xb') as output:subprocess.run(['gh','api',f'repos/Russianranger/coh-android/actions/artifacts/{ident}/zip'],stdout=output,check=True,timeout=300)
        with archive.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
        assert archive.stat().st_size==71999000 and digest=='aa7a1badbeb8926cec15009f7f87ebb797aa2345c0c97a183cd1e23866a3499b'
        target=base/'retained-intact';target.mkdir()
        with zipfile.ZipFile(archive) as z:
            infos=z.infolist();assert 0<len(infos)<=2048 and len({i.filename for i in infos})==len(infos)
            assert sum(i.file_size for i in infos)<=128*1024**2 and z.testzip() is None
            for item in infos:
                name=item.filename[:-1] if item.is_dir() else item.filename
                path=pathlib.PurePosixPath(name)
                assert path.as_posix()==name and not path.is_absolute() and path.parts
                assert all(p not in ('','.','..') for p in path.parts)
                assert chr(92) not in name and ':' not in name and not item.flag_bits&1
                assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)
                assert 0<=item.file_size<=64*1024**2
            prefix='intact-openssl-reuse/'
            name=prefix+'manifest.json';manifest=z.read(name)
            assert len(manifest)==58665 and hashlib.sha256(manifest).hexdigest()=='1c1c05eb10132e4d1d172d29a04d36311981e6c7023c7ee388348339c460896b'
            value=json.loads(manifest)
            assert value['schema']=='coh-intact-openssl-build-ownership-v1'
            assert len(value['files'])==384 and value['total_bytes']==105629748
            assert value['files']['libcrypto.lib']['sha256']=='95aec97b796992a58f8745e1bbbc6eac634931420f13b0763d2db57537543698'
            selected={name:{'bytes':len(manifest),'sha256':hashlib.sha256(manifest).hexdigest()}}
            for relative,pin in value['files'].items():
                path=pathlib.PurePosixPath(relative)
                assert path.as_posix()==relative and not path.is_absolute() and path.parts
                assert all(p not in ('','.','..') for p in path.parts) and chr(92) not in relative and ':' not in relative
                assert set(pin)=={'bytes','sha256'} and type(pin['bytes']) is int and 0<=pin['bytes']<=64*1024**2
                assert re.fullmatch('[a-f0-9]{64}',pin['sha256'])
                selected[prefix+relative]=pin
            assert sum(x['bytes'] for x in value['files'].values())==105629748
            members={i.filename:i for i in infos}
            for name,pin in selected.items():
                item=members[name];assert not item.is_dir() and item.file_size==pin['bytes']
                destination=target/name;destination.parent.mkdir(parents=True,exist_ok=True)
                with z.open(item) as source,destination.open('xb') as output:shutil.copyfileobj(source,output,1024**2)
                with destination.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
                assert destination.stat().st_size==pin['bytes'] and actual==pin['sha256']
        assert {p.relative_to(target).as_posix() for p in target.rglob('*') if p.is_file()}==set(selected)
        archive.unlink()
        PYCRYPTO
    - name: Observe live selected-shard grant then wipe and close before DB login
      run: |
        python native-android/engine/auth-interop/deployment/hosted_db_threadname_selected_play.py --source-root . --expected-commit $env:GITHUB_SHA --output "$env:RUNNER_TEMP/db-threadname-selected-play" --auth-success-archive native-android/engine/auth-interop/evidence/auth-success-38996587760/artifact.zip --auth-candidate-stage "$env:RUNNER_TEMP/auth-candidate" --db-candidate-stage "$env:RUNNER_TEMP/db-candidate" --retained-intact-stage "$env:RUNNER_TEMP/retained-intact" --send-cap ${{ matrix.send_cap }} --expected-db-receipt-sha256 6b0ca58a18c5899f1fae4a353cd4eec7e770b308d1bd512f052b2306e34c6912 --expected-db-binary-sha256 e14a11d8cb9f5419ec641455f45326fdf64c7ace3e254f333ae110069a185d3c
        if ($LASTEXITCODE -ne 0) { throw 'Selected-shard grant refused; preserve fixed diagnostics and cleanup' }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: db-threadname-selected-play-cap${{ matrix.send_cap }}-${{ github.sha }}
        path: ${{ runner.temp }}/db-threadname-selected-play/receipt.json
        if-no-files-found: error
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        send_cap:
        - 1024
